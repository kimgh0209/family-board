<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="포켓몬탐험">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<title>우리가족 포켓몬 탐험</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Jua',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d2b53;min-height:100vh;background:#7cc662}
body:before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:var(--scene) center/cover no-repeat,#8fd3ff}
button,input{font:inherit}
button{border:3px solid #1d2b53;border-radius:18px;padding:10px 16px;background:#fff;color:#1d2b53;box-shadow:0 4px 0 #1d2b53}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1d2b53}
button.go{background:linear-gradient(#6ee06a,#34a83a);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
button.red{background:linear-gradient(#ff7a6b,#e0322b);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
button.big{display:block;width:100%;padding:15px;font-size:21px;margin-top:12px}
button:disabled{opacity:.55}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px;padding-top:calc(14px + env(safe-area-inset-top))}
.hero{text-align:center}
.ribbon{display:inline-block;background:#e0322b;color:#fff;border:3px solid #1d2b53;border-radius:20px;padding:3px 18px;font-size:15px;transform:rotate(-3deg);position:relative;z-index:1}
.logo{margin:-4px 0 0;font-size:46px;line-height:1.15;color:#ffd23f;-webkit-text-stroke:9px #1f4fa8;paint-order:stroke fill;letter-spacing:1px;filter:drop-shadow(0 5px 0 #12306b)}
.stage{display:flex;align-items:flex-end;justify-content:center;height:130px}
.stage img{filter:drop-shadow(0 6px 3px rgba(0,0,0,.25))}
.stage .h1{width:112px;animation:bob 2.2s ease-in-out infinite}
.stage .h2{width:112px;height:112px;image-rendering:pixelated;margin:0 -4px}
.stage .h3{width:104px;animation:bob 2.2s ease-in-out .7s infinite}
.card{background:rgba(255,255,255,.96);border:3px solid #1d2b53;border-radius:22px;padding:12px;margin-top:14px;box-shadow:0 5px 0 rgba(29,43,83,.45)}
.tag{display:inline-block;background:#2f6fd0;color:#fff;border-radius:12px;padding:3px 12px;font-size:15px;margin-bottom:6px}
.mecard{display:flex;align-items:center;justify-content:center;font-size:22px}.mecard img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;margin-right:10px}.mecard b{font-weight:400;color:#e0322b;font-size:28px}
.who{display:flex;flex-wrap:wrap;justify-content:center}
.who button{width:56px;margin:4px 2px;padding:2px 0 4px;background:#eef5ff;font-size:14px}
.who button img{display:block;width:48px;height:48px;margin:0 auto;object-fit:contain;image-rendering:pixelated}
.who button.on{background:#ffd23f}
.huntbtn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:18px;padding:14px;border-radius:32px;background:linear-gradient(#ff7a6b,#d92b25);color:#fff;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.3);box-shadow:0 7px 0 #1d2b53}
.huntbtn small{display:block;font-size:14px;opacity:.95}
.huntbtn:disabled{background:#90a4ae;opacity:1}
.pb{display:inline-block;width:52px;height:52px;flex:none;margin-right:14px;border:3px solid #1d2b53;border-radius:50%;background:radial-gradient(circle,#fff 0 17%,#1d2b53 18% 27%,transparent 28%),linear-gradient(#ff5a4e 0 44%,#1d2b53 44% 56%,#fff 56%)}
.huntbtn:not(:disabled) .pb{animation:shake 2.4s ease-in-out infinite}
.menu{display:flex;margin:18px -5px 0}
.menu button{flex:1;margin:0 5px;padding:8px 2px;font-size:16px}
.menu b{display:block;font-size:30px}
.menu small{display:block;font-size:12px;opacity:.7}
.menu .m1{background:#ffe7a3}.menu .m2{background:#c9ecff}.menu .m3{background:#e6dcff}.menu .m4{background:#ffd0c8}
.note{background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;font-size:12px;line-height:1.6;margin-top:18px;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
.title{text-align:center;background:linear-gradient(#ff6b5e,#d92b25);color:#fff;border:3px solid #1d2b53;border-radius:20px;padding:10px;margin:12px 0 6px;font-weight:400;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 rgba(29,43,83,.45)}
.backb{font-size:15px;padding:7px 13px}
.chips{display:flex;flex-wrap:wrap}
.chips button{margin:4px 6px 4px 0;padding:7px 10px;background:#eef5ff}
.chips button.on{background:#ffd23f}
.chips button:disabled:not(.on){opacity:.4}
.chips button:disabled.on{opacity:1}
.state{text-align:center;background:#fff6d6}.state.ok{background:#dcfce0}
input[type=text],input[type=password]{width:100%;padding:12px;border:3px solid #b8cdf0;border-radius:14px;margin-top:6px;background:#fff;color:#1d2b53}
.small{font-size:13px;color:#5a6b8c;line-height:1.55}
.bad{color:#c62828}
.msg{text-align:center;margin-top:10px}
.msg:not(:empty){background:#fff;border-radius:12px;padding:8px}
.count{text-align:center;background:rgba(255,255,255,.9);border-radius:12px;padding:5px}
.empty{width:100%;text-align:center;background:rgba(255,255,255,.92);border-radius:16px;padding:18px;margin:8px 5px}
.grid{display:flex;flex-wrap:wrap;margin:0 -5px}
.mem{width:calc(50% - 10px);margin:6px 5px;background:#fffdf4;border-radius:16px;padding:6px;font-size:13px;text-align:left}
.mem b{display:block;margin-top:5px;font-size:17px;font-weight:400}
.frame{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#bfe6ff}
.frame>.bg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.pal{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.pal img{display:block;width:100%}
.pal.card-img img{border-radius:18%;box-shadow:0 3px 10px rgba(0,0,0,.35)}
/* 체육관 · 레이드 */
.gymmark{position:relative;width:96px;height:96px;text-align:center}
.gymmark img{width:58px;height:58px;margin-top:2px;object-fit:contain;filter:drop-shadow(0 0 6px #ff3d2e);animation:bob 2.2s ease-in-out infinite}
.gymmark i{display:block;margin-top:-14px;font-style:normal;font-size:30px;position:relative}
.gymmark b{position:absolute;left:-12px;right:-12px;bottom:-12px;font-weight:400;font-size:12px;background:#d92b25;color:#fff;border:2px solid #fff;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.gymmark.mine b{background:#7b3fd0}
.gymrow{display:flex;align-items:center;width:100%;margin-top:12px;text-align:left}
.gymrow img{width:64px;height:64px;object-fit:contain;margin-right:10px}
.gymrow b{display:block;font-weight:400;font-size:19px}.gymrow small{font-size:13px;color:#5a6b8c}
.boss{text-align:center;background:linear-gradient(#35205f,#7b2d5a);color:#fff}.boss img{display:block;width:60%;margin:0 auto}.boss b{font-weight:400;font-size:21px}
.pl{width:72px;margin:4px;text-align:center;font-size:14px}.pl img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}.pl span,.pl small{display:block}.pl small{font-size:11px;color:#5a6b8c}
.rpick{display:flex;flex-wrap:wrap}.rpick button{width:calc(33.33% - 8px);margin:4px;padding:6px 2px;font-size:13px}.rpick .bagimg{height:76px;background:none}.rpick .bagimg img{max-height:72px}
.gymdel{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.gymdel button{font-size:13px;padding:5px 12px}
.timer{background:#fff;border:3px solid #1d2b53;border-radius:16px;padding:6px 14px;font-size:18px}
#foe.boss{left:50%;top:37%;width:48%}
#hpfoe.raidhp{top:calc(142px + env(safe-area-inset-top));width:58%}
#mine.raidme{top:59%;width:40%}
#team{position:absolute;right:8px;top:calc(142px + env(safe-area-inset-top));z-index:4}
.mate{display:flex;align-items:center;background:rgba(255,255,255,.92);border-radius:14px;padding:2px 8px 2px 2px;margin-bottom:6px;font-size:13px}.mate img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}.mate small{display:block;font-size:11px}.mate.out{opacity:.5}
/* 지도 첫 화면 */
#home{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
#mapslot,#map,#spawns{position:absolute;top:0;left:0;right:0;bottom:0}
#mapslot{background:var(--scene) center/cover no-repeat,#8bd169}
#map{z-index:1;background:#bfe6a8}
#map .leaflet-tile-pane{filter:saturate(1.5) hue-rotate(8deg) brightness(1.03)}
#map .leaflet-bottom{bottom:calc(172px + env(safe-area-inset-bottom))}
#spawns{z-index:2;pointer-events:none}
.spmark{background:none;border:0}
.spawn{display:block;width:76px;height:76px;animation:bob 1.8s ease-in-out infinite}
.spawn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.spawn img.framed{border-radius:50%;object-fit:cover;border:3px solid #fff}
.spawn.rocket img{image-rendering:pixelated}
.spawn.rocket em{position:absolute;right:-4px;top:-6px;font-style:normal;font-size:26px}
button.spawn{position:absolute;margin:-38px 0 0 -38px;width:84px;height:84px;padding:0;border:0;background:none;box-shadow:none;pointer-events:auto}
button.spawn:active{transform:scale(.9);box-shadow:none}
.meicon{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(47,111,208,.45) 0 45%,rgba(47,111,208,.15) 46% 70%,transparent 71%)}
.meicon img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;margin-top:-10px}
.fixedme{position:absolute;left:50%;top:54%;margin:-35px 0 0 -35px}
.hud{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:5;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud .me{display:flex;align-items:center;background:#fff;border:3px solid #1d2b53;border-radius:30px;padding:3px 14px 3px 4px;box-shadow:0 4px 0 rgba(29,43,83,.45)}
.hud .me img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated;margin-right:6px}
.hud .me b{font-weight:400;font-size:20px;margin-right:10px}
.geo{max-width:46%;background:rgba(255,255,255,.92);border-radius:14px;padding:5px 10px;font-size:12px;text-align:right}
.recenter{position:absolute;right:12px;top:calc(84px + env(safe-area-inset-top));z-index:5;width:52px;height:52px;border-radius:50%;padding:0;font-size:24px}
.foot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5}
.foot .menu{margin:10px -5px 0}
.foot .menu b{font-size:24px}
.banner{background:#fff;border:4px double #1f4fa8;border-radius:16px;padding:8px 10px;text-align:center;font-size:15px}
.banner.bad{color:#c62828;margin-bottom:6px}
#memobox{position:absolute;left:12px;right:12px;top:calc(140px + env(safe-area-inset-top));z-index:5;background:#fffdf4;border:3px solid #1d2b53;border-radius:18px;padding:10px;box-shadow:0 5px 0 rgba(29,43,83,.35)}
#memobox input{-webkit-user-select:text;user-select:text}
/* 탐험 화면 */
#hunt{-webkit-touch-callout:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#hunt .sky{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#cam{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
.top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;z-index:5}
#msg{position:absolute;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));background:#fff;border:4px double #1f4fa8;border-radius:18px;padding:11px;text-align:center;font-size:20px;z-index:4;box-shadow:0 5px 0 rgba(29,43,83,.35)}
#msg:empty{display:none}
#wild{position:absolute;transform:translate(-50%,-50%);z-index:2;transition:opacity .3s}
#wild img{display:block;width:100%}
#wild.card-img img{border-radius:18%;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#wild .bob{animation:bob 1.6s ease-in-out infinite}
#wild.appear .bob{animation:appear .6s}
#wild.suck .bob{animation:suck .55s ease-in forwards}
#ball{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:4px solid #222;border-radius:50%;background:linear-gradient(#e53935 0%,#e53935 45%,#222 45%,#222 55%,#fff 55%,#fff 100%);z-index:3}
#ball:after{content:'';position:absolute;left:23px;top:23px;width:22px;height:22px;border:4px solid #222;border-radius:50%;background:#fff}
#ball.wob{animation:wob .7s ease-in-out}
#ball.done:after{background:#ffeb3b}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;z-index:5}
.bottom button{margin:4px}
.shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid #cfd8dc;padding:0;vertical-align:middle}
.star{position:absolute;font-size:34px;z-index:4;animation:star 1s ease-out forwards}
.down .bagimg img{filter:grayscale(1);opacity:.55;transform:rotate(80deg)}
.bagimg{height:120px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#eef5ff}
.bagimg.t0{background:radial-gradient(circle,#fff,#ffd9a8)}.bagimg.t1{background:radial-gradient(circle,#fff,#bfe3ff)}.bagimg.t2{background:radial-gradient(circle,#fff,#c9f2b4)}.bagimg.t3{background:radial-gradient(circle,#fff,#fff0a0)}.bagimg.t4{background:radial-gradient(circle,#fff,#ddd0ff)}.bagimg.t5{background:radial-gradient(circle,#fff,#ffcfe0)}
.bagimg img{max-width:100%;max-height:112px}
.bagimg.card-img img{border-radius:18%}
.row2{display:flex;gap:10px}
.row2 button{flex:1}
/* 로켓단 배틀 */
.energy{position:relative;height:28px;margin:0 4px 8px;border:3px solid #1d2b53;border-radius:16px;background:#fff;overflow:hidden}
.energy i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4fc3f7,#ffd23f);transition:width .2s}
.energy span{position:relative;font-size:14px;line-height:22px}
.energy.full{animation:glow .6s ease-in-out infinite alternate}
.bottom .atk,.bottom .spc{width:calc(50% - 8px);height:76px;padding:4px;vertical-align:top;line-height:1.25}
.bottom .atk{font-size:18px}
.bottom .spc{font-size:16px}
.bottom .spc.ready{animation:pulse .6s ease-in-out infinite alternate}
.fx{position:absolute;transform:translate(-50%,-50%);font-size:34px;z-index:5;pointer-events:none;transition:left .35s linear,top .35s linear}
.spfx{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,60,.55);z-index:4;pointer-events:none;animation:flash 1.3s ease-out}
.spfx b{font-weight:400;font-size:34px;color:#ffd23f;-webkit-text-stroke:7px #c62828;paint-order:stroke fill;text-align:center;padding:0 14px;animation:appear .5s}
@keyframes glow{from{box-shadow:0 0 4px #ffd23f}to{box-shadow:0 0 18px 6px #ffd23f}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes flash{0%{background:rgba(255,255,255,.95)}25%{background:rgba(20,10,60,.55)}}
.fig{position:absolute;transform:translate(-50%,-50%);z-index:2}
.fig img{display:block;width:100%}
.fig.card-img img{border-radius:18%}
#rocket{left:50%;top:44%;width:46%}
#rocket img{image-rendering:pixelated}
#rocket.side{left:86%;top:27%;width:24%;z-index:1}
#foe{left:62%;top:34%;width:38%}
#mine{left:32%;top:55%;width:44%}
.fig.hit{animation:hit .45s}
#mine.lunge{animation:lungeA .5s}
#foe.lunge{animation:lungeB .5s}
.fig.faint{animation:faint .8s forwards}
.fig.blast{animation:blast 1.4s ease-in forwards}
.hp{position:absolute;width:44%;background:rgba(255,255,255,.94);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;z-index:3}
.hp .barbg{height:9px;background:#dde3ea;border-radius:6px;overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;width:100%;background:#43a047;transition:width .4s}
#hpfoe{left:3%;top:24%}
#hpme{right:3%;top:61%}
.dmg{position:absolute;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000;z-index:6;animation:star 1s ease-out forwards;white-space:nowrap}
#pick{position:absolute;left:10px;right:10px;top:calc(132px + env(safe-area-inset-top));bottom:calc(16px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(255,255,255,.95);border-radius:18px;padding:8px;z-index:6}
#pick button{width:calc(33.33% - 8px);margin:4px;padding:6px 2px;font-size:13px;vertical-align:top;background:#f1f6fb}
#pick .bagimg{height:80px;background:none}
#pick .bagimg img{max-height:76px}
@keyframes hit{20%,60%{transform:translate(-58%,-50%);filter:brightness(2.5)}40%,80%{transform:translate(-42%,-50%)}}
@keyframes lungeA{45%{transform:translate(-20%,-80%) scale(1.1)}}
@keyframes lungeB{45%{transform:translate(-80%,-20%) scale(1.1)}}
@keyframes faint{to{transform:translate(-50%,20%) scale(.6);opacity:0}}
@keyframes blast{20%{transform:translate(-50%,-30%) rotate(-15deg)}100%{transform:translate(120%,-420%) rotate(900deg) scale(.1);opacity:0}}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-22deg)}84%{transform:rotate(22deg)}92%{transform:rotate(-8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes appear{0%{transform:scale(.1);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes suck{35%{transform:scale(1.1);filter:brightness(4)}100%{transform:scale(.05);opacity:0;filter:brightness(4)}}
@keyframes wob{25%{transform:translateX(-18px) rotate(-35deg)}55%{transform:translateX(18px) rotate(35deg)}80%{transform:translateX(-6px) rotate(-12deg)}}
@keyframes star{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='https://pokeapi.co/api/v2/';
const ART=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const AL='https://s4.anilist.co/file/anilistcdn/character/large/';           // 가족보드 치이카와 마을과 같은 그림
const CHII=[[288497,'치이카와','b288497-SwvcX32INEHD.png'],[288498,'하치와레','b288498-OdHiY9TX3Qpm.png'],[288499,'우사기','b288499-BR8llXagiDBS.png'],[288500,'모몽가','b288500-5e0XSZz0W97a.png'],[288503,'라코','b288503-nBgwdHdBixfG.png'],[288502,'쿠리만쥬','b288502-aepNSDaAQQev.png'],[320258,'시사','b320258-nu08J3r0IZ21.png'],[288501,'포셰트 갑옷씨','b288501-1HKeRw1U4PWB.png'],[288507,'노동 갑옷씨','b288507-lZEhW71MnC1u.png'],[288508,'라멘 갑옷씨','b288508-TIwVO7FlM5qA.png']];
const SPARE=[[25,'피카츄'],[133,'이브이'],[1,'이상해씨'],[4,'파이리'],[7,'꼬부기'],[39,'푸린'],[52,'나옹'],[54,'고라파덕'],[143,'잠만보'],[151,'뮤'],[175,'토게피'],[94,'팬텀']];   // 도감을 못 읽을 때 써요
const DEX_MAX=1025;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const batchim=w=>{const c=String(w).charCodeAt(String(w).length-1)-44032;return c>=0&&c<11172&&c%28>0};
const dstr=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function openDb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('famgo',1);r.onupgradeneeded=()=>r.result.createObjectStore('mem',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function dbRun(mode,fn){return new Promise((ok,no)=>{const t=db.transaction('mem',mode),q=fn(t.objectStore('mem'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)})}
async function loadMem(){
  try{db=await openDb();MEM=(await dbRun('readonly',s=>s.getAll()))||[]}catch(e){db=null;saveBroken=true}
  MEM.sort((a,b)=>b.id-a.id);
}
async function putMem(r){
  const i=MEM.findIndex(x=>x.id===r.id);if(i<0)MEM.unshift(r);else MEM[i]=r;
  try{if(!db)throw 0;await dbRun('readwrite',s=>s.put(r))}catch(e){saveBroken=true;alert('추억을 저장하지 못했어요. 저장 공간을 확인해 주세요. 사파리의 "개인정보 보호" 창에서는 저장이 안 돼요.')}
}

const SET_REPO='kimgh0209/family-go-settings',KEY_NAME='famgo_key';
const DEF={limit:5,near:500,chii:50,rocket:'normal',bonusMax:2,rename:false,db:'',names:['아빠','엄마','한율','이현','서비'],updatedAt:0};
const OPT={limit:[[3,'3마리'],[5,'5마리'],[10,'10마리'],[999,'제한 없음']],near:[[200,'200m'],[500,'500m'],[1000,'1km']],chii:[[20,'포켓몬 많이'],[50,'반반'],[80,'치이카와 많이']],
  rocket:[['off','안 나옴'],['normal','가끔'],['often','자주']],bonusMax:[[0,'없음'],[1,'1번'],[2,'2번'],[3,'3번']],rename:[[false,'잠금'],[true,'허용']]};
function cleanSet(j){                                  // 이상한 값은 기본값으로
  const o=Object.assign({},DEF);if(!j||typeof j!=='object')return o;
  Object.keys(OPT).forEach(k=>{if(OPT[k].some(x=>x[0]===j[k]))o[k]=j[k]});
  if(Array.isArray(j.names)){const n=j.names.map(x=>String(x).trim().slice(0,8)).filter(Boolean).slice(0,8);if(n.length)o.names=n}
  const u=String(j.db||'').trim().replace(/\/+$/,'');if(/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u))o.db=u;
  o.updatedAt=+j.updatedAt||0;return o;
}

const getKey=()=>{try{return localStorage.getItem(KEY_NAME)||''}catch(e){return ''}};
function gh(path,opt){
  opt=opt||{};const k=opt.key!==undefined?opt.key:getKey(),h={Accept:opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json'};if(k)h.Authorization='Bearer '+k;
  return fetch(`https://api.github.com/repos/${SET_REPO}/${path}${opt.body?'':'?t='+Date.now()}`,{method:opt.body?'PUT':'GET',cache:'no-store',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
}
async function pullSettings(){
  try{
    let r=await gh('contents/settings.json',{raw:true,key:''}).catch(()=>null);
    if(!r||!r.ok)r=await fetch(`https://raw.githubusercontent.com/${SET_REPO}/main/settings.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)return false;const j=cleanSet(await r.json());
    if(j.updatedAt>((cfg.remote||{}).updatedAt||0)){cfg.remote=j;saveCfg();if(screen==='home')geoRefresh();return true}
  }catch(e){}

}
async function pushSettings(set,key){                  // 성공하면 '' , 실패하면 안내 글
  try{
    const g=await gh('contents/settings.json',{key});
    if(g.status===401)return '접속 키가 맞지 않아요';
    if(!g.ok&&g.status!==404)return '설정 저장소를 열지 못했어요 ('+g.status+')';
    const sha=g.ok?(await g.json()).sha:undefined,body=Object.assign(cleanSet(set),{updatedAt:Date.now()});
    const p=await gh('contents/settings.json',{key,body:{message:'탐험 앱 설정 변경',sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(body,null,1))))}});
    if(!p.ok)return p.status===401?'접속 키가 맞지 않아요':(p.status===403||p.status===404)?'이 키에는 설정 저장소에 쓸 권한이 없어요':'저장하지 못했어요 ('+p.status+')';
    cfg.remote=body;saveCfg();return '';

}

const SHARD_START=3,SHARD_EVERY=3;

let here=null,geoState='📍 위치를 찾는 중...',watchId=null;
const meters=(a,b)=>{const R=6371000,r=Math.PI/180,x=(b.lon-a.lon)*r*Math.cos((a.lat+b.lat)*r/2),y=(b.lat-a.lat)*r;return Math.sqrt(x*x+y*y)*R};
function suggestPlace(){                              // 전에 이 근처에서 적어 둔 메모가 있으면 미리 넣어 줘요
  if(!here)return '';const r=MEM.find(m=>m.place&&m.lat!=null&&meters(here,m)<150);return r?r.place:'';
}
function geoRefresh(){if(screen==='gym'){const g=gymById(gymId),n=!!(here&&g&&meters(here,g)<=RAID_RANGE);if(n!==gymNear){gymNear=n;render()}return}if(screen!=='home')return;if($('mapslot'))updateHome();else render()}
function locate(){                                    // 걸어 다니면 내 위치가 따라와요
  if(!navigator.geolocation){geoState='위치를 쓸 수 없는 기기예요';return}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    here={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5)};geoState='📍 내 위치';geoRefresh();
  },()=>{if(!here){geoState='📍 위치를 못 찾았어요. 설정에서 위치를 허용해 주세요';geoRefresh()}},{enableHighAccuracy:true,timeout:20000,maximumAge:10000});
}

const NEAR_SPAWN=150,SPAWN_MAX=3,SPAWN_LIFE=10*60000;
let SP=null,spawning=false,spawnSeq=0;
function newSpot(){                                    // 내 주위 25~65m 어딘가 (지도가 없을 때는 화면 안 어딘가)
  const a=Math.random()*Math.PI*2,m=25+Math.random()*40,c=here?Math.cos(here.lat*Math.PI/180):1;
  const used=SP?SP.list.length:0;
  return {dLat:m*Math.cos(a)/111320,dLon:m*Math.sin(a)/(111320*c),x:[.24,.72,.46,.75][used%4]+(Math.random()-.5)*.1,y:[.32,.42,.66,.7][used%4]+(Math.random()-.5)*.08};
}
async function refreshSpawns(){
  const who=cfg.me;if(!who||spawning)return;
  if(SP&&here&&!SP.center)SP.center={lat:here.lat,lon:here.lon};          // 위치를 늦게 찾아도 보이던 친구는 그대로
  if(SP&&(SP.who!==who||Date.now()-SP.at>SPAWN_LIFE||(here&&meters(here,SP.center)>NEAR_SPAWN)))SP=null;
  if(!SP)SP={who,center:here?{lat:here.lat,lon:here.lon}:null,at:Date.now(),list:[],rolled:false};
  const mine=SP;spawning=true;
  try{
    const want=Math.min(SPAWN_MAX,leftOf(who));
    let wild=mine.list.filter(x=>x.type==='wild');
    while(wild.length>want){mine.list.splice(mine.list.indexOf(wild.pop()),1)}
    if(!mine.rolled){mine.rolled=true;if(!mine.list.some(x=>x.type==='rocket')&&rocketDue(who))mine.list.push(Object.assign({id:++spawnSeq,type:'rocket'},newSpot()))}
    drawSpawns();
    for(let n=wild.length;n<want;n++){
      const w=await pickWild();if(SP!==mine||!w)break;
      mine.list.push(Object.assign({id:++spawnSeq,type:'wild',w},newSpot()));drawSpawns();
    }
  }finally{spawning=false;if(SP!==mine&&screen==='home')refreshSpawns()}   // 찾는 사이에 장소가 바뀌었으면 다시
}

function cutPixels(o){                                // 치이카와 그림의 한 가지 색 배경을 지워요 (가족보드와 같은 방식)
  const W=o.naturalWidth,H=o.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.drawImage(o,0,0);
  const d=x.getImageData(0,0,W,H),p=d.data,N=W*H;
  if(p[3]<20)return o.src;
  const edge=[];for(let i=0;i<W;i++)edge.push(i,(H-1)*W+i);for(let j=0;j<H;j++)edge.push(j*W,j*W+W-1);
  const key=i=>(p[i*4]>>4)+','+(p[i*4+1]>>4)+','+(p[i*4+2]>>4),bins={};let bk='',bc=0;
  edge.forEach(i=>{const k=key(i);bins[k]=(bins[k]||0)+1;if(bins[k]>bc){bc=bins[k];bk=k}});
  if(bc/edge.length<.55)return null;
  let r=0,g=0,b=0,n=0;edge.forEach(i=>{if(key(i)===bk){r+=p[i*4];g+=p[i*4+1];b+=p[i*4+2];n++}});r/=n;g/=n;b/=n;
  const dist=i=>{const a=p[i*4]-r,e=p[i*4+1]-g,f=p[i*4+2]-b;return a*a+e*e+f*f},T2=44*44;
  const seen=new Uint8Array(N),q=new Int32Array(N);let h=0,t=0;
  const push=i=>{if(!seen[i]&&dist(i)<T2){seen[i]=1;q[t++]=i}};edge.forEach(push);
  while(h<t){const i=q[h++],cx=i%W;if(cx>0)push(i-1);if(cx<W-1)push(i+1);if(i>=W)push(i-W);if(i<N-W)push(i+W)}
  if(t<N*.12||t>N*.9)return null;
  let x0=W,y0=H,x1=0,y1=0;
  for(let i=0;i<N;i++){
    if(seen[i]){p[i*4+3]=0;continue}
    const cx=i%W,cy=(i-cx)/W;
    if(((cx>0&&seen[i-1])||(cx<W-1&&seen[i+1])||(cy>0&&seen[i-W])||(cy<H-1&&seen[i+W]))&&dist(i)<T2*3)p[i*4+3]=110;
    if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy;
  }
  if(x1<=x0||y1<=y0)return null;
  x.putImageData(d,0,0);
  const c2=document.createElement('canvas');c2.width=x1-x0+1;c2.height=y1-y0+1;c2.getContext('2d').drawImage(c,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
  return c2.toDataURL('image/png');
}
async function palSrc(r){                             // {src, framed}: 배경을 못 지우면 둥근 카드 모양으로 보여줘요
  if(r.kind!=='chii')return {src:r.img,framed:false};
  if(CUT[r.img])return CUT[r.img];
  try{const o=await loadImg(r.img+'?c=1',true),u=cutPixels(o);if(u){await loadImg(u);return CUT[r.img]={src:u,framed:false}}}catch(e){}
  return {src:r.img,framed:true};
}
async function pickWild(){                            // 포켓몬 반, 치이카와 반. 그림이 안 뜨면 다시 골라요
  for(let n=0;n<4;n++){
    let w;
    if(Math.random()<SET().chii/100){const c=CHII[Math.floor(Math.random()*CHII.length)];w={kind:'chii',cid:c[0],name:c[1],img:AL+c[2]}}
    else{
      let id=1+Math.floor(Math.random()*DEX_MAX),name='';
      try{const res=await fetch(API+'pokemon-species/'+id);if(!res.ok)throw 0;const s=await res.json();name=(s.names.find(x=>x.language.name==='ko')||{name:s.name}).name}
      catch(e){const s=SPARE[Math.floor(Math.random()*SPARE.length)];id=s[0];name=s[1]}
      w={kind:'poke',cid:id,name,img:ART(id)};
    }
    try{await loadImg(w.img);w.show=await palSrc(w);return w}catch(e){}
  }
  return null;
}

async function prepareShare(r){                       // 배경 사진 + 친구를 한 장으로 합쳐 둬요 (누르자마자 공유할 수 있게)

/* ---------- 체육관 · 가족 레이드 ----------
   체육관: 근처 유명한 곳(OpenStreetMap) + 아빠가 직접 만든 곳. 레이드는 체육관 200m 안에 있어야 해요.
   실시간 소식은 Firebase 실시간 데이터베이스로 주고받아요. 이름·친구·체력·체육관 위치만 올리고 사진과 메모는 올리지 않아요. */
const RAID_RANGE=200,RAID_TIME=120000,RAID_HP=380,RAID_STALE=10*60000,BOSS_HIT=[4,7],BOSS_EVERY=1500,FLUSH_EVERY=900;
const BOSSES=[[150,'뮤츠'],[149,'망나뇽'],[248,'마기라스'],[384,'레쿠쟈'],[383,'그란돈'],[382,'가이오가'],[249,'루기아'],[250,'칠색조'],[487,'기라티나'],[483,'디아루가'],[484,'펄기아'],[6,'리자몽'],[130,'갸라도스'],[143,'잠만보'],[445,'한카리아스'],[373,'보만다']];
const hashNum=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const bossOf=gid=>{const b=BOSSES[hashNum(gid+'|'+dstr(Date.now()))%BOSSES.length];return {kind:'poke',cid:b[0],name:b[1],img:ART(b[0])}};   // 같은 날 같은 체육관은 모두에게 같은 보스

/* 가족 암호: 암호 자체는 저장하지 않고, 암호로 만든 긴 글자(주소)만 이 폰에 저장해요 */
const normPass=p=>String(p||'').replace(/\s+/g,'').toLowerCase();
async function famHash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('famgo:'+normPass(p)));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const dbReady=()=>!!(SET().db&&cfg.fam);
const dbUrl=p=>`${SET().db.replace(/\/+$/,'')}/fam/${cfg.fam}/${p}.json`;
async function db_(method,path,body){
  const r=await fetch(dbUrl(path),{method,cache:'no-store',body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('db '+r.status);return r.json();
}
const inc=n=>({'.sv':{increment:n}});
function applyAt(root,path,data,merge){
  const k=String(path).split('/').filter(Boolean);
  if(!k.length){if(!merge)return data;let o=Object.assign({},root);Object.keys(data||{}).forEach(x=>{o=applyAt(o,x,data[x],false)});return o}
  const o=Object.assign({},root||{}),v=applyAt(o[k[0]],k.slice(1).join('/'),data,merge);
  if(v===null||v===undefined)delete o[k[0]];else o[k[0]]=v;return o;
}
function dbWatch(path,cb,fail){                        // 바뀔 때마다 바로 알려 줘요
  const es=new EventSource(dbUrl(path));let st=null;
  const on=merge=>e=>{try{const m=JSON.parse(e.data);st=applyAt(st,m.path,m.data,merge);cb(st)}catch(x){}};
  es.addEventListener('put',on(false));es.addEventListener('patch',on(true));es.onerror=()=>{if(fail)fail()};
  return ()=>es.close();
}

const cleanGym=(id,g)=>g&&typeof g.lat==='number'&&typeof g.lon==='number'?{id,name:String(g.name||'체육관').slice(0,30),lat:g.lat,lon:g.lon,mine:true}:null;

async function raidFlush(){                            // 모은 피해를 한 번에 보내요

function updateTimer(){const t=$('timer');if(t&&raid&&raid.start)t.textContent='⏱ '+Math.max(0,Math.ceil((RAID_TIME-(Date.now()-raid.start))/1000))+'초'}
function raidUpdate(){                                 // 서버 소식이 올 때마다: 보스 체력, 가족 상태, 승패

}
function raidFaint(){
  const h=H,R=h.rd;setDown(h.who,R.key,true);raidFlush();
  const n=shardsOf(h.who);$('msg').textContent=`😵 ${R.mine.name}${batchim(R.mine.name)?'이':'가'} 쓰러졌어요!`;
  const m=$('mine');if(m)m.className+=' faint';
  $('bar').innerHTML=`<button class="red" data-act="raidrevive" ${n?'':'disabled'}>${n?`✨ 살려서 다시 싸우기 (💎 ${n}개)`:'💎 조각이 없어요 · 가족을 응원해요!'}</button>`;
}
function raidRevive(){
  const h=H;if(!h||h.state!=='raid'||h.rd.over||h.rd.my>0||shardsOf(h.who)<1)return;const R=h.rd;
  addShard(h.who,-1);setDown(h.who,R.key,false);R.my=100;setHp('hpme',100);const m=$('mine');if(m)m.className=m.className.replace(/ faint/g,'');
  const mv=R.moves;$('bar').innerHTML=`<div class="energy" id="energy"><i id="energyi"></i><span id="energyt">필살기 에너지</span></div><button class="go atk" disabled>👊 공격 중!</button><button class="red spc" data-raid="big" id="spcBtn" disabled>${mv[2]} ${esc(mv[1])}</button>`;
  $('msg').textContent='✨ 다시 싸워요!';raidBar();raidFlush();
}
function stopRaid(){const R=H&&H.rd;if(R){clearInterval(R.auto);clearInterval(R.boss);clearInterval(R.flush);R.auto=R.boss=R.flush=0}}
async function raidEnd(win){
  const h=H,R=h.rd,me=safeKey(h.who);R.over=true;const mineDmg=((raid.players||{})[me]||{}).dmg||0,boss=raid.boss;stopRaid();$('bar').innerHTML='';
  if(!win){$('msg').textContent=`⏱ 시간이 다 됐어요. ${boss.name}${batchim(boss.name)?'이':'가'} 아직 버티고 있어요. 다시 도전!`;$('bar').innerHTML='<button class="go" data-act="quit">🗺 지도로</button>';return}
  const f=$('foe');if(f)f.className+=' faint';$('msg').textContent=`🏆 가족이 함께 ${boss.name}${batchim(boss.name)?'을':'를'} 이겼어요!`;
  if(navigator.vibrate)navigator.vibrate([100,60,100,60,200]);
  await sleep(1800);if(H!==h)return;
  if(!(mineDmg>0||R.pending>0)){$('bar').innerHTML='<button class="go" data-act="quit">🗺 지도로</button>';return}
  if((cfg.rewarded||[]).indexOf(R.id)<0){cfg.rewarded=(cfg.rewarded||[]).slice(-20).concat(R.id);addShard(h.who,1)}
  const w=Object.assign({},boss);w.show=await palSrc(w);if(H!==h)return;
  ['foe','mine','hpfoe','hpme','team','timer'].forEach(i=>{const e=$(i);if(e)e.remove()});
  h.state='seek';h.wild=w;h.raid=h.gym.name;h.pos={x:.5,y:.42,w:.62};
  const el=document.createElement('div');el.id='wild';el.className='appear';el.innerHTML=`<div class="bob"><img src="${w.show.src}" alt=""></div>`;$('hunt').appendChild(el);placeWild();
  const b=document.createElement('div');b.id='ball';$('hunt').appendChild(b);moveBall(.5,.84);h.state='ready';
  $('msg').textContent=`🎁 ${w.name}${batchim(w.name)?'을':'를'} 잡을 기회! (💎 +1)`;$('bar').innerHTML='<b style="color:#fff;text-shadow:0 1px 4px #000">몬스터볼을 위로 휙!</b>';
}

/* ---------- 손가락 ---------- */
let touch=null;
document.addEventListener('pointerdown',e=>{
  if(!H||e.target.closest('button'))return;
  if(H.state==='ready'&&(e.target.id==='ball'||e.clientY>innerHeight*.6))touch={type:'ball',y:e.clientY};
  else if(H.state==='photo'){const r=$('hunt').getBoundingClientRect();touch={type:'drag',dx:H.pos.x-(e.clientX-r.left)/r.width,dy:H.pos.y-(e.clientY-r.top)/r.height}}
});
document.addEventListener('pointermove',e=>{
  if(!H||!touch||touch.type!=='drag')return;
  const r=$('hunt').getBoundingClientRect(),c=v=>Math.max(.05,Math.min(.95,v));
  H.pos.x=c((e.clientX-r.left)/r.width+touch.dx);H.pos.y=c((e.clientY-r.top)/r.height+touch.dy);placeWild();
});
document.addEventListener('pointerup',e=>{const t=touch;touch=null;if(H&&t&&t.type==='ball'&&e.clientY<=t.y+10)throwBall()});
document.addEventListener('pointercancel',()=>{touch=null});
document.addEventListener('contextmenu',e=>{if(H)e.preventDefault()});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  const a=t.dataset.act;
  if(t.dataset.me!==undefined){
    const n=t.dataset.me,first=screen==='home'&&people().indexOf(cfg.me)<0;
    if(first?confirm(`${n}${batchim(n)?'으로':'로'} 시작할까? 다음부터는 계속 ${n}${batchim(n)?'이야':'야'}`):screen==='admin'&&canPickMe()){cfg.me=cfg.who=n;saveCfg();render()}
  }
  else if(t.dataset.set){if(adm.open&&adm.draft){readNames();const k=t.dataset.set,o=OPT[k].find(x=>String(x[0])===t.dataset.v);if(o){adm.draft[k]=o[0];adm.msg='아직 저장 전이에요';render()}}}
  else if(a==='admin'){unwatchRaid();loadMyGyms();adm={open:false,draft:null,msg:'',busy:false};screen='admin';render();scrollTo(0,0);pullSettings()}
  else if(a==='pinok'||a==='setsave'||a==='link'||a==='unlink')adminAct(a);
  else if(t.dataset.open){back=screen==='friend'?'friend':'album';openId=+t.dataset.open;screen='detail';render();scrollTo(0,0)}
  else if(t.dataset.bag!==undefined){bagWho=t.dataset.bag;render()}
  else if(t.dataset.friend){friendKey=t.dataset.friend;screen='friend';render();scrollTo(0,0)}
  else if(t.dataset.fighter){startBattle(t.dataset.fighter)}
  else if(t.dataset.move){battleMove(t.dataset.move)}
  else if(t.dataset.revive){revive(H?H.who:bagWho,t.dataset.revive)}
  else if(t.dataset.spawn){startHunt(+t.dataset.spawn)}
  else if(a==='gyms'){unwatchRaid();screen='gyms';render();scrollTo(0,0);loadMyGyms();loadFamous()}
  else if(t.dataset.gym){openGym(t.dataset.gym)}
  else if(t.dataset.raidjoin){raidJoin(t.dataset.raidjoin)}
  else if(a==='raidstart')raidStart();
  else if(a==='raidleave')raidLeave();
  else if(a==='raidenter'){cfg.entered=0;enterRaid()}
  else if(t.dataset.raid){raidPress(t.dataset.raid)}
  else if(a==='raidrevive')raidRevive();
  else if(a==='famsave')famSave();
  else if(a==='gymadd')gymEdit('add');
  else if(t.dataset.gymdel){gymEdit('del',t.dataset.gymdel)}
  else if(a==='recenter'){follow=true;stopLocate();locate();drawSpawns()}
  else if(a==='home'){unwatchRaid();screen='home';render();locate();pullSettings()}
  else if(a==='album'){screen='album';render()}
  else if(a==='bag'){if(screen==='home')bagWho=cfg.who;screen='bag';render()}
  else if(a==='back'){screen=back;render()}
  else if(a==='camtoggle'&&H)setCam(!H.camOn,H.state!=='photo');
  else if(a==='rkpick')rocketPick();
  else if(a==='rkrun')quitHunt();
  else if(a==='quit')quitHunt();
  else if(a==='flip'&&H){H.front=!H.front;if(H.camOn)startCam()}
  else if(a==='photo'&&H)photoMode();
  else if(a==='shutter'&&H)shutter();
  else if((a==='bigger'||a==='smaller')&&H){H.pos.w=Math.max(.15,Math.min(.95,H.pos.w*(a==='bigger'?1.18:1/1.18)));placeWild()}
  else if(a==='done'&&H)finishHunt(false);
  else if(a==='share'&&shareFile){
    if(navigator.canShare&&navigator.canShare({files:[shareFile]}))navigator.share({files:[shareFile]}).catch(()=>{});
    else{const l=document.createElement('a');l.href=URL.createObjectURL(shareFile);l.download=shareFile.name;l.click()}
  }
  else if(a==='del'){if(confirm('이 추억을 지울까요? 되돌릴 수 없고, 가방에서도 빠져요.')){await delMem(openId);screen=back;render()}}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='mplace'){const r=MEM.find(m=>m.id===openId);if(r){r.place=e.target.value.trim();await putMem(r);prepareShare(r)}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLocate();else locate();if(!H){if(!document.hidden){pullSettings();if(screen==='home')updateHome()}return}if(document.hidden)stopCam();else if(H.camOn)startCam()});

(async()=>{
  try{document.documentElement.style.setProperty('--scene',`url("${sceneSrc(sceneNow())}")`)}catch(e){}
  render();
  await loadMem();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();locate();pullSettings().then(loadMyGyms);
})();
</script>
</body>
