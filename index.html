<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집보드">
<title>우리집 포켓몬 보드</title>
<style>
:root{--bg:#e8f5e9;--card:#fff;--ink:#2b3a2f;--red:#e53935;--yellow:#fbc02d;--green:#43a047;--blue:#1e88e5;--line:#cfe3d1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:linear-gradient(#ffe0b2,#e8f5e9 240px) fixed;color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--red);color:#fff;border-bottom:6px solid #b71c1c}
header h1{font-size:20px;margin:0 auto 0 0}
.tabs,.kids,.acts{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.4}
.tabs button.on{background:var(--yellow)}
.kids{padding:12px 16px 0;max-width:1100px;margin:auto}
.kids button{font-size:20px;border:3px solid transparent}
.kids button.on{border-color:var(--ink);background:var(--yellow)}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 8px;font-size:18px}
.bar{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;flex-wrap:wrap}
.small{font-size:14px;opacity:.7}
.chip{background:var(--yellow);padding:3px 11px;border-radius:99px;font-weight:700;white-space:nowrap}
.coin{background:#fff3c4;border:2px solid #f0b400}
/* home */
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.home{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:560px){.home{grid-template-columns:1fr}}
.clock{font-size:64px;font-weight:800;line-height:1}
.date{font-size:22px;margin-top:6px}
.wx{font-size:22px;margin-top:10px}
.notice{background:#fff8e1;border-left:6px solid var(--yellow);padding:10px 12px;border-radius:8px;margin:6px 0;font-size:19px}
.ev{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:18px;gap:8px}
.kidcard{text-align:center;cursor:pointer}
.kidcard img{width:110px;height:110px;object-fit:contain}
/* mission */
.chore{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0;padding:18px;font-size:22px;text-align:left;background:#fffde7;border:3px solid var(--yellow)}
.chore .box{width:36px;height:36px;border-radius:50%;border:3px solid var(--yellow);background:#fff;display:grid;place-items:center;font-size:24px;color:#fff;flex:none}
.chore.done{background:#c8e6c9;border-color:var(--green)}
.chore.done .box{background:var(--green);border-color:var(--green)}
.chore.done .txt{text-decoration:line-through;opacity:.6}
.chore .txt{flex:1}
.prog{height:10px;background:#e0e0e0;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stats .chip{font-size:18px}
/* town */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mon{border:3px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:#fafafa}
.mon.sel{border-color:var(--red);background:#ffebee}
.mon img{width:90px;height:90px;object-fit:contain}
.hero{text-align:center}
.hero img{width:200px;height:200px;object-fit:contain;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.shake{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.go{background:var(--green)!important;color:#fff!important}
.egg{background:var(--blue)!important;color:#fff!important}
.acts{justify-content:center;margin-top:10px}
.stack>*+*{margin-top:14px}
/* 진화 계보 */
.evw{overflow-x:auto;padding:8px 0;margin:6px 0;border-bottom:1px dashed var(--line);text-align:left}
.evt{display:flex;align-items:center}
.evk{display:flex;flex-direction:column}
.evn{text-align:center;padding:4px 6px;border-radius:12px;min-width:84px}
.evn img{width:72px;height:72px;object-fit:contain}
.evn div{font-size:13px;font-weight:700}
.evn.cur{background:#ffebee;outline:3px solid var(--red)}
.arr{font-size:22px;margin:0 4px;color:var(--red)}
.row input[type=checkbox]{width:28px;height:28px;flex:none}
/* overlay / toast */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:9}
#ov.show{display:grid}
#ov .box{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:90vw}
#ov img{width:240px;height:240px;object-fit:contain;animation:pop .6s}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:99px;font-size:22px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
/* settings */
textarea,input,select{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;user-select:text;-webkit-user-select:text}
textarea{height:110px}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}
.row input{flex:1}
.row input.num{width:96px;flex:none;text-align:right}
.row button{padding:8px 12px}
label.small{display:block;margin:10px 0 4px}
/* 구형 iOS(12) 호환: flex gap 대체 */
header>*,.tabs>*,.kids>*,.acts>*,.stats>*{margin:4px}
.bar>*{margin-right:10px}
.chore>*+*{margin-left:14px}
.row>*+*{margin-left:8px}
.ev>*+*{margin-left:8px}
.mon{cursor:pointer}
body{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<header>
  <h1>🏠 우리집 포켓몬 보드</h1>
  <div class="tabs" id="tabs"></div>
  <button id="fs" title="전체화면">⛶</button>
</header>
<div class="kids" id="kids"></div>
<main id="main"></main>
<div id="ov"><div class="box" id="ovbox"></div></div>
<div id="toast"></div>

<script>
const API='https://pokeapi.co/api/v2/';
const ART=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const IDLE_MS=90000;                              // 90초 동안 터치가 없으면 홈으로
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const idFrom=u=>+u.split('/').filter(Boolean).pop();
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()};
const koName=s=>(s.names.find(n=>n.language.name==='ko')||{name:s.name}).name;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR');

/* ---------- 데이터 ---------- */
// 미션: t=이름, c=포켓코인
const newKid=(name,chores)=>({name,chores:chores.map(([t,c])=>({t,c})),done:{},coins:0,mons:[],sel:0});
function defaults(){
  const base=()=>[['세수하기',10],['양치하기',10],['책 읽기',30],['장난감 정리',20]];
  return {pin:'0000',lat:37.5665,lon:126.978,
    notices:'오늘도 화이팅! 💪',events:'',
    eggCost:100,evoCost:80,legend:false,                       // 알 가격 / 진화 가격 (포켓코인)
    kids:[newKid('한율',base()),newKid('이현',base()),newKid('서비',base())]};
}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('pkfam3'))}catch(e){}
  s=s||defaults();
  const d=defaults();
  ['pin','lat','lon','notices','events','eggCost','evoCost','legend'].forEach(k=>{if(s[k]===undefined)s[k]=d[k]});
  const t=today();s.kids.forEach(k=>{Object.keys(k.done||{}).forEach(x=>{if(x!==t)delete k.done[x]});k.done=k.done||{}});
  return s;
}
let S=load(), tab='home', kid=0, W=null, lastDay=today(), unlockUntil=0, busy=false;
const save=()=>{try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}};
const K=()=>S.kids[kid]||S.kids[0];
const leadOf=k=>k.mons[k.sel];

/* ---------- 포켓몬 API ---------- */
let dexTotal=0,chainTotal=0;                      // 도감 전체 종 수 / 진화 계보 수 (PokeAPI에서 실시간 조회)
async function speciesCount(){
  if(dexTotal)return dexTotal;
  try{dexTotal=(await jget(API+'pokemon-species?limit=1')).count}catch(e){dexTotal=1025}
  return dexTotal;
}
async function chainCount(){
  if(chainTotal)return chainTotal;
  try{chainTotal=(await jget(API+'evolution-chain?limit=1')).count}catch(e){chainTotal=500}
  return chainTotal;
}
async function rollEgg(){                         // 현존하는 전체 포켓몬 중에서 뽑고, 항상 진화 전 모습으로 부화
  const total=await speciesCount();
  for(let i=0;i<12;i++){
    try{
      let sp=await jget(API+'pokemon-species/'+(1+Math.floor(Math.random()*total)));
      if(!S.legend&&(sp.is_legendary||sp.is_mythical))continue;
      while(sp.evolves_from_species)sp=await jget(sp.evolves_from_species.url);
      return {id:sp.id,sp:sp.name,name:koName(sp)};
    }catch(e){}
  }
  throw new Error('roll');
}
/* ---- 진화 계보(트리) ---- */
const cache={};
async function speciesKo(id){if(cache['n'+id])return cache['n'+id];const sp=await jget(API+'pokemon-species/'+id);return cache['n'+id]=koName(sp)}
async function buildTree(n){const id=idFrom(n.species.url);const ko=await speciesKo(id);const kids=await Promise.all(n.evolves_to.map(buildTree));return {id,ko,kids}}
async function chainTreeByUrl(u){if(cache[u])return cache[u];const c=await jget(u);return cache[u]=await buildTree(c.chain)}
async function chainTreeOf(id){const sp=await jget(API+'pokemon-species/'+id);return chainTreeByUrl(sp.evolution_chain.url)}
async function randomChain(){
  const n=await chainCount();
  for(let i=0;i<15;i++){
    try{const c=await jget(API+'evolution-chain/'+(1+Math.floor(Math.random()*n)));
      if(c.chain.evolves_to.length)return await buildTree(c.chain)}catch(e){}
  }
  throw new Error('chain');
}
function treeHtml(n,cur){
  const me=`<div class="evn ${n.id===cur?'cur':''}"><img src="${ART(n.id)}" loading="lazy"><div>${esc(n.ko)}</div></div>`;
  if(!n.kids.length)return `<div class="evt">${me}</div>`;
  return `<div class="evt">${me}<div class="arr">➜</div><div class="evk">${n.kids.map(k=>treeHtml(k,cur)).join('')}</div></div>`;
}
async function evolve(m){            // 진화할 수 없으면 null
  const sp=await jget(API+'pokemon-species/'+m.id);
  const chain=await jget(sp.evolution_chain.url);
  let found=null;(function walk(n){if(n.species.name===m.sp)found=n;n.evolves_to.forEach(walk)})(chain.chain);
  if(!found||!found.evolves_to.length)return null;
  const nx=found.evolves_to[Math.floor(Math.random()*found.evolves_to.length)];
  const nid=idFrom(nx.species.url),nsp=await jget(API+'pokemon-species/'+nid);
  return {id:nid,sp:nsp.name,name:koName(nsp)};
}

/* ---------- 날씨 ---------- */
const WX=c=>c===0?'☀️ 맑음':c<=3?'⛅ 구름':c<=48?'🌫 안개':c<=57?'🌦 이슬비':c<=67?'🌧 비':c<=77?'❄️ 눈':c<=82?'🌧 소나기':c<=86?'❄️ 눈':'⛈ 천둥번개';
async function loadWeather(){
  try{const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
    W={t:Math.round(j.current.temperature_2m),c:j.current.weather_code,hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0])};
  }catch(e){W=null}
  if(tab==='home'&&!busy)render();
}

/* ---------- 일정 ---------- */
function parseEvents(){
  const base=new Date(today()+'T00:00:00'),out=[];
  (S.events||'').split('\n').forEach(l=>{const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);
    if(m)out.push({d:Math.round((new Date(m[1]+'T00:00:00')-base)/864e5),text:m[2]})});
  return {today:out.filter(e=>e.d===0),next:out.filter(e=>e.d>0&&e.d<=60).sort((a,b)=>a.d-b.d).slice(0,4)};
}

/* ---------- 화면 ---------- */
function overlay(html){document.getElementById('ovbox').innerHTML=html+'<p><button style="background:#eee" onclick="document.getElementById(\'ov\').classList.remove(\'show\')">확인!</button></p>';document.getElementById('ov').classList.add('show')}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400)}
function clockHtml(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dateHtml(){return new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}

function render(){
  document.getElementById('tabs').innerHTML=[['home','🏠 홈'],['todo','📝 미션'],['town','🌳 마을'],['dex','📖 도감'],['set','⚙️ 설정']]
    .map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  document.getElementById('kids').innerHTML=(tab==='todo'||tab==='town'||tab==='dex')?S.kids.map((k,i)=>`<button class="${i===kid?'on':''}" data-kid="${i}">${esc(k.name)}</button>`).join(''):'';
  const m=document.getElementById('main');
  m.innerHTML=tab==='home'?homeView():tab==='todo'?todoView():tab==='town'?townView():tab==='dex'?dexView():setView();
  if(tab==='dex')fillDex();
}
function homeView(){
  const ev=parseEvents();
  const notices=(S.notices||'').split('\n').filter(s=>s.trim());
  return `<div class="home">
  <div class="card"><div class="clock" id="clk">${clockHtml()}</div><div class="date" id="dt">${dateHtml()}</div>
    <div class="wx">${W?`${WX(W.c)} ${W.t}° <span class="small">(${W.lo}° / ${W.hi}°)</span>`:'<span class="small">날씨를 불러오는 중...</span>'}</div></div>
  <div class="card"><h2>📢 가족 공지</h2>${notices.length?notices.map(n=>`<div class="notice">${esc(n)}</div>`).join(''):'<div class="small">공지가 없어요</div>'}</div>
  <div class="card"><h2>📅 일정</h2>
    ${ev.today.map(e=>`<div class="ev"><b>오늘 · ${esc(e.text)}</b></div>`).join('')}
    ${ev.next.map(e=>`<div class="ev"><span>${esc(e.text)}</span><span class="chip">D-${e.d}</span></div>`).join('')}
    ${!ev.today.length&&!ev.next.length?'<div class="small">예정된 일정이 없어요</div>':''}</div>
  ${S.kids.map((k,i)=>{const d=(k.done[today()]||[]).length,t=k.chores.length,p=leadOf(k);
    return `<div class="card kidcard" data-gokid="${i}"><div class="bar" style="justify-content:center">${esc(k.name)}</div>
      ${p?`<img src="${ART(p.id)}">`:'<div style="font-size:70px;height:110px">🥚</div>'}
      <div class="small">${p?esc(p.name):'아직 포켓몬이 없어요'}</div>
      <div class="prog" style="margin:8px 0"><i style="width:${t?d/t*100:0}%"></i></div>
      <div class="bar" style="justify-content:center;font-size:18px">오늘 미션 ${d}/${t} ${d===t&&t?'🎉':''}</div>
      <div class="stats" style="justify-content:center"><span class="chip coin">🪙 ${won(k.coins)}</span><span class="chip">포켓몬 ${k.mons.length}마리</span></div></div>`}).join('')}
  </div>`;
}
function todoView(){
  const k=K(),d=k.done[today()]||[],n=d.length,t=k.chores.length;
  const p=leadOf(k);
  const gain=d.reduce((a,i)=>a+(k.chores[i]?k.chores[i].c:0),0),total=k.chores.reduce((a,c)=>a+c.c,0);
  return `<div class="stack"><div class="card"><div class="bar">오늘 미션 ${n}/${t} ${n===t&&t?'🎉 모두 완료!':''}<span class="chip coin">🪙 ${won(k.coins)}</span></div>
  <div class="prog" style="margin:8px 0"><i style="width:${t?n/t*100:0}%"></i></div>
  ${k.chores.map((c,i)=>`<button class="chore ${d.includes(i)?'done':''}" data-chore="${i}"><span class="box">${d.includes(i)?'✓':''}</span><span class="txt">${esc(c.t)}</span><span class="chip coin">🪙 +${won(c.c)}</span></button>`).join('')}
  <p class="small">오늘 번 코인 🪙${won(gain)} / 최대 🪙${won(total)} · 코인으로 마을에서 알을 뽑거나 진화시킬 수 있어요</p></div>
  ${p?`<div class="card hero"><img src="${ART(p.id)}"><div class="bar" style="justify-content:center">${esc(p.name)}</div></div>`:''}</div>`;
}
function townView(){
  const k=K(),p=leadOf(k);
  let hero='<p class="hero">아직 포켓몬이 없어요. 포켓코인으로 알을 뽑아 보세요! 🥚</p>';
  if(p){
    hero=`<div class="hero"><img src="${ART(p.id)}"><div class="bar" style="justify-content:center">${esc(p.name)} <span class="small">No.${p.id}</span></div>
    <div class="small">${p.final?'최종 진화! 🏆':`진화 비용 🪙${won(S.evoCost)}`}</div>
    <div class="acts"><button class="go" data-act="evo" ${p.final||k.coins<S.evoCost?'disabled':''}>✨ 진화시키기 (🪙${won(S.evoCost)})</button><button data-act="tree">🌱 진화 계보</button></div></div>`;
  }
  return `<div class="stack"><div class="card"><div class="stats"><span class="chip coin">🪙 ${won(k.coins)}</span></div>${hero}
  <div class="acts"><button class="egg" data-act="egg" ${k.coins<S.eggCost?'disabled':''}>🥚 알 뽑기 (🪙${won(S.eggCost)})</button></div></div>
  <div class="card"><h2>내 포켓몬 (${k.mons.length}마리)</h2><div class="grid">
  ${k.mons.map((q,i)=>`<div class="mon ${i===k.sel?'sel':''}" data-sel="${i}"><img src="${ART(q.id)}" loading="lazy"><div>${esc(q.name)}</div></div>`).join('')}</div></div></div>`;
}
let exTrees=null,exLoading=false;
function dexView(){
  const k=K();
  return `<div class="stack">
  <div class="card"><h2>📖 알과 진화 안내</h2>
    <p>🥚 알을 뽑으면 <b>진화 전 모습</b>의 포켓몬이 나와요. 전체 도감 <b>${dexTotal||'1000'}${dexTotal?'':'+'}</b>종 중에서 뽑아요${S.legend?'':' (전설·환상 포켓몬은 빼고)'}.</p>
    <p>✨ 코인으로 진화시키면 아래 계보처럼 다음 모습으로 바뀌어요. 갈래가 여러 개면 그중 하나가 <b>랜덤</b>으로 나와요!</p></div>
  <div class="card"><h2>🌱 ${esc(k.name)}의 포켓몬 진화 계보</h2>
    ${k.mons.length?k.mons.slice(-12).reverse().map(m=>`<div class="evw" data-mine="${m.id}">불러오는 중...</div>`).join(''):'<div class="small">아직 포켓몬이 없어요. 알을 뽑으면 여기에 계보가 나와요!</div>'}</div>
  <div class="card"><h2>✨ 이런 진화도 있어요 (랜덤 예시)</h2><div id="exs">불러오는 중...</div>
    <div class="acts"><button class="egg" data-act="exmore">🎲 다른 예시 보기</button></div></div></div>`;
}
function paintEx(){
  const el=document.getElementById('exs');if(!el)return;
  el.innerHTML=exTrees&&exTrees.length?exTrees.map(t=>`<div class="evw">${treeHtml(t,0)}</div>`).join(''):'<div class="small">불러오지 못했어요. 인터넷을 확인해 주세요</div>';
}
async function loadExamples(){
  if(exLoading)return;exLoading=true;
  try{const list=[];for(let i=0;i<3;i++)list.push(await randomChain());exTrees=list}catch(e){exTrees=[]}
  exLoading=false;paintEx();
}
async function fillDex(){
  speciesCount().then(()=>{});
  const els=Array.prototype.slice.call(document.querySelectorAll('[data-mine]'));
  for(const el of els){
    try{const tr=await chainTreeOf(el.dataset.mine);if(document.body.contains(el))el.innerHTML=treeHtml(tr,+el.dataset.mine)}
    catch(e){if(document.body.contains(el))el.textContent='불러오지 못했어요'}
  }
  if(exTrees)paintEx();else loadExamples();
}
function setView(){
  const g=(k,l,h)=>`<label class="small">${l}</label><textarea data-g="${k}" placeholder="${h||''}">${esc(S[k]||'')}</textarea>`;
  return `<div class="stack">
  <div class="card"><h2>📢 공지 · 📅 일정</h2>${g('notices','공지사항 (한 줄에 하나씩)')}
    ${g('events','일정 · D-day (한 줄에 하나씩: 2026-12-25 크리스마스)','2026-12-25 크리스마스')}</div>
  <div class="card"><h2>🪙 포켓코인 가격</h2>
    <div class="row"><span>🥚 알 뽑기</span><input class="num" type="number" min="1" value="${S.eggCost}" data-eggcost><span>코인</span></div>
    <div class="row"><span>✨ 진화시키기</span><input class="num" type="number" min="1" value="${S.evoCost}" data-evocost><span>코인</span></div>
    <div class="row"><input type="checkbox" data-legend ${S.legend?'checked':''}><span>전설·환상 포켓몬도 알에서 나오게 하기</span></div></div>
  ${S.kids.map((k,i)=>`<div class="card"><div class="row"><input value="${esc(k.name)}" data-kname="${i}" style="font-weight:700"><button data-act="delkid" data-k="${i}" style="background:#ffcdd2">삭제</button></div>
    <div class="small">미션 이름 · 받는 코인</div>
    ${k.chores.map((c,j)=>`<div class="row"><input value="${esc(c.t)}" data-ct="${i}.${j}"><input class="num" type="number" min="0" value="${c.c}" data-cc="${i}.${j}"><span>🪙</span><button data-act="delchore" data-k="${i}" data-c="${j}">✕</button></div>`).join('')}
    <div class="acts" style="justify-content:flex-start"><button data-act="addchore" data-k="${i}">➕ 미션 추가</button></div>
    <div class="row"><span class="chip coin">보유 🪙 ${won(k.coins)}</span><button data-act="adj" data-k="${i}" data-v="10">+10</button><button data-act="adj" data-k="${i}" data-v="50">+50</button><button data-act="adj" data-k="${i}" data-v="-10">-10</button><button data-act="adj" data-k="${i}" data-v="-50">-50</button></div></div>`).join('')}
  <div class="card"><h2>기타</h2>
    <div class="row"><input type="number" step="any" value="${S.lat}" data-lat> <input type="number" step="any" value="${S.lon}" data-lon><button data-act="geo">📍 내 위치</button></div>
    <div class="small">날씨 위치(위도·경도)</div>
    <label class="small">부모 PIN (숫자 4자리)</label><input value="${esc(S.pin)}" data-pin maxlength="8" inputmode="numeric">
    <div class="acts" style="justify-content:flex-start"><button data-act="addkid">➕ 아이 추가</button><button data-act="export">💾 백업 저장</button><button data-act="import">📂 백업 불러오기</button><button data-act="reset" style="background:#ffcdd2">🗑 전체 초기화</button></div>
    </div></div>`;
}

/* ---------- 부모 PIN ---------- */
function unlocked(){return Date.now()<unlockUntil}
function askPin(){
  if(unlocked())return true;
  const v=prompt('부모 PIN을 입력하세요');
  if(v!==null&&v===String(S.pin)){unlockUntil=Date.now()+5*60000;return true}
  if(v!==null)toast('PIN이 달라요');
  return false;
}

/* ---------- 이벤트 ---------- */
let idle;function bump(){clearTimeout(idle);idle=setTimeout(()=>{if(tab!=='home'&&!busy&&!document.getElementById('ov').classList.contains('show')&&!(tab==='set'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){tab='home';render()}},IDLE_MS)}
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
(function(){const b=document.getElementById('fs'),d=document.documentElement;
  if(!d.requestFullscreen){b.style.display='none';return} // 아이패드 Safari는 미지원 → 홈 화면에 추가해서 전체화면으로 사용
  b.onclick=()=>{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().catch(()=>{})}})();

document.addEventListener('click',async e=>{
  bump();wake();
  const t=e.target.closest('button,[data-sel],[data-gokid]');if(!t||t.id==='fs')return;
  const k=K();
  if(t.dataset.tab){const n=t.dataset.tab;if(n==='set'&&!askPin())return;tab=n}
  else if(t.dataset.gokid!==undefined){kid=+t.dataset.gokid;tab='todo'}
  else if(t.dataset.kid!==undefined){kid=+t.dataset.kid}
  else if(t.dataset.chore!==undefined){
    const i=+t.dataset.chore,d=k.done[today()]=k.done[today()]||[],at=d.indexOf(i),c=k.chores[i].c;
    if(at<0){d.push(i);k.coins+=c;toast(`🪙 +${won(c)}`)}else{d.splice(at,1);k.coins=Math.max(0,k.coins-c)}
  }
  else if(t.dataset.sel!==undefined){k.sel=+t.dataset.sel}
  else if(t.dataset.act==='egg'&&k.coins>=S.eggCost&&!busy){
    busy=true;t.disabled=true;t.innerHTML='<span class="shake" style="display:inline-block">🥚</span> 부화 중...';
    try{const p=await rollEgg();k.coins-=S.eggCost;k.mons.push(p);k.sel=k.mons.length-1;overlay(`<h2>🎉 ${esc(p.name)} 등장!</h2><img src="${ART(p.id)}">`)}
    catch(err){overlay('<h2>인터넷 연결을 확인해주세요 😢</h2>')}
    busy=false;
  }
  else if(t.dataset.act==='evo'&&!busy){
    const p=leadOf(k);if(!p||p.final||k.coins<S.evoCost)return;
    busy=true;t.disabled=true;t.textContent='진화 중...';
    try{const n=await evolve(p);
      if(n){const old=p.name;k.coins-=S.evoCost;Object.assign(p,n);overlay(`<h2>✨ ${esc(old)} → ${esc(p.name)} 진화!</h2><img src="${ART(p.id)}">`)}
      else{p.final=true;toast('더 이상 진화하지 않아요 (코인은 그대로예요)')}}
    catch(err){overlay('<h2>인터넷 연결을 확인해주세요 😢</h2>')}
    busy=false;
  }
  else if(t.dataset.act==='tree'){
    const p=leadOf(k);if(!p)return;
    overlay(`<h2>${esc(p.name)}의 진화 계보</h2><div id="ovtree" class="evw">불러오는 중...</div>`);
    chainTreeOf(p.id).then(tr=>{const el=document.getElementById('ovtree');if(el)el.innerHTML=treeHtml(tr,p.id)})
      .catch(()=>{const el=document.getElementById('ovtree');if(el)el.textContent='불러오지 못했어요'});
    return}
  else if(t.dataset.act==='exmore'){exTrees=null;const el=document.getElementById('exs');if(el)el.textContent='불러오는 중...';loadExamples();return}
  else if(t.dataset.act==='addkid'){S.kids.push(newKid('새 아이',[['양치하기',10]]))}
  else if(t.dataset.act==='delkid'){if(confirm('이 아이의 기록이 모두 지워져요. 정말요?')){S.kids.splice(+t.dataset.k,1);kid=0;if(!S.kids.length)S.kids.push(newKid('아이',[['양치하기',10]]))}}
  else if(t.dataset.act==='addchore'){S.kids[+t.dataset.k].chores.push({t:'새 미션',c:10})}
  else if(t.dataset.act==='delchore'){S.kids[+t.dataset.k].chores.splice(+t.dataset.c,1);S.kids[+t.dataset.k].done={}}
  else if(t.dataset.act==='adj'){const q=S.kids[+t.dataset.k];q.coins=Math.max(0,q.coins+(+t.dataset.v))}
  else if(t.dataset.act==='geo'){navigator.geolocation.getCurrentPosition(p=>{S.lat=+p.coords.latitude.toFixed(3);S.lon=+p.coords.longitude.toFixed(3);save();loadWeather();render()},()=>toast('위치를 가져오지 못했어요'));return}
  else if(t.dataset.act==='export'){overlay('<h2>💾 백업</h2><p class="small">아래 글자를 전부 복사해서 메모 앱에 저장해 두세요</p><textarea id="bk" readonly style="width:70vw;height:30vh">'+esc(JSON.stringify(S))+'</textarea>');const b=document.getElementById('bk');b.focus();b.select();return}
  else if(t.dataset.act==='import'){const v=prompt('백업 내용을 붙여넣으세요');if(v){try{const o=JSON.parse(v);if(!o.kids)throw 0;S=o;kid=0;save();render();toast('불러왔어요')}catch(err){toast('올바른 백업이 아니에요')}}return}
  else if(t.dataset.act==='reset'){if(confirm('모든 기록이 지워져요. 정말요?')){try{localStorage.removeItem('pkfam3')}catch(err){}S=defaults();kid=0}}
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  bump();const t=e.target,D=t.dataset;
  if(D.g)S[D.g]=t.value;
  else if(D.kname!==undefined)S.kids[+D.kname].name=t.value;
  else if(D.ct){const[i,j]=D.ct.split('.');S.kids[i].chores[j].t=t.value}
  else if(D.cc){const[i,j]=D.cc.split('.');S.kids[i].chores[j].c=Math.max(0,Math.round(+t.value)||0)}
  else if(D.eggcost!==undefined)S.eggCost=Math.max(1,Math.round(+t.value)||100);
  else if(D.evocost!==undefined)S.evoCost=Math.max(1,Math.round(+t.value)||80);
  else if(D.legend!==undefined)S.legend=t.checked;
  else if(D.lat!==undefined){S.lat=+t.value;loadWeather()}
  else if(D.lon!==undefined){S.lon=+t.value;loadWeather()}
  else if(D.pin!==undefined)S.pin=t.value.trim()||'0000';
  else return;
  save();
});
document.addEventListener('touchstart',bump,{passive:true});
/* 이미지가 없으면(신규 포켓몬 등) 기본 스프라이트로 대체 */
document.addEventListener('error',e=>{const i=e.target;if(!i||i.tagName!=='IMG')return;
  const m=i.src.match(/official-artwork\/(\d+)\.png/);
  if(m&&!i.dataset.fb){i.dataset.fb=1;i.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+m[1]+'.png'}else i.style.visibility='hidden'},true);

/* 시계 갱신 + 자정 지나면 새로고침 */
setInterval(()=>{
  const c=document.getElementById('clk');if(c){c.textContent=clockHtml();document.getElementById('dt').textContent=dateHtml()}
  if(today()!==lastDay){lastDay=today();S.kids.forEach(k=>k.done={});save();if(!busy)render()}
},15000);
setInterval(loadWeather,30*60000);

render();loadWeather();bump();speciesCount();
</script>
</body>
</html>
