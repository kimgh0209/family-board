<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="우리집보드">
<title>우리집 포켓몬 보드</title>
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5e9;--card:#fff;--ink:#2b3a2f;--red:#e53935;--yellow:#fbc02d;--green:#43a047;--blue:#1e88e5;--line:#cfe3d1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:linear-gradient(#ffe0b2,#e8f5e9 240px) fixed;color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--red);color:#fff;border-bottom:6px solid #b71c1c}
header h1{font-size:20px;margin:0 auto 0 0}
.tabs,.kids,.acts{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.4}
.tabs button{padding:10px 13px}
.tabs button.on{background:var(--yellow)}
.kids{padding:12px 16px 0;max-width:1100px;margin:auto}
.kids button{font-size:20px;border:3px solid transparent}
.kids button.on{border-color:var(--ink);background:var(--yellow)}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 8px;font-size:18px}
.bar{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;flex-wrap:wrap}
.small{font-size:14px;opacity:.7}
.chip{background:var(--yellow);padding:3px 11px;border-radius:99px;font-weight:700;white-space:nowrap}
.coin{background:#fff3c4;border:2px solid #f0b400}
/* home */
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.home{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:560px){.home{grid-template-columns:1fr}}
.clock{font-size:64px;font-weight:800;line-height:1}
.date{font-size:22px;margin-top:6px}
.wx{font-size:22px;margin-top:10px}
.notice{background:#fff8e1;border-left:6px solid var(--yellow);padding:10px 12px;border-radius:8px;margin:6px 0;font-size:19px}
.ev{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:18px;gap:8px}
.ev button{margin-left:6px;padding:8px 12px}
.kidcard{text-align:center;cursor:pointer}
.kidcard img.mon-img{width:110px;height:110px;object-fit:contain}
.kidcard img.tp1{height:44px;width:auto;vertical-align:middle;margin-right:6px}
/* mission */
.chore{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0;padding:18px;font-size:22px;text-align:left;background:#fffde7;border:3px solid var(--yellow)}
.chore .box{width:36px;height:36px;border-radius:50%;border:3px solid var(--yellow);background:#fff;display:grid;place-items:center;font-size:24px;color:#fff;flex:none}
.chore.done{background:#c8e6c9;border-color:var(--green)}
.chore.done .box{background:var(--green);border-color:var(--green)}
.chore.done .txt{text-decoration:line-through;opacity:.6}
.chore .txt{flex:1}
.prog{height:10px;background:#e0e0e0;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stats .chip{font-size:18px}
/* town */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mon{border:3px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:#fafafa}
.mon.sel{border-color:var(--red);background:#ffebee}
.mon img{width:90px;height:90px;object-fit:contain}
.hero{text-align:center}
.hero img{width:200px;height:200px;object-fit:contain;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.shake{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.go{background:var(--green)!important;color:#fff!important}
.egg{background:var(--blue)!important;color:#fff!important}
.acts{justify-content:center;margin-top:10px}
.stack>*+*{margin-top:14px}
/* 마을 풍경 */
.mbanner .mbrow{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.mbanner .mbrow b{font-size:22px;color:#e65100}
.morn{background:linear-gradient(#bfe6ff,#e8f7d8 70%);border-radius:18px;padding:12px;border:3px solid var(--line)}
.mhead{text-align:center}
.mt1{font-size:20px;font-weight:800;color:#33691e}
.mt2{font-size:44px;font-weight:900;color:#e65100;line-height:1.15}
.mt2.over{color:#d32f2f;animation:shake .5s infinite}
.mt3{font-size:15px;color:#6d4c41}
.mstage{position:relative;height:178px;margin:8px 0;overflow:hidden;border-radius:14px;background:linear-gradient(#cdeafc,#eaf7ff 60%)}
.mroad{position:absolute;left:0;right:0;bottom:0;height:46px;background:#8bc34a;border-top:4px solid #689f38}
.mroad:after{content:'';position:absolute;left:0;right:0;top:18px;border-top:4px dashed #fff}
.mschool{position:absolute;font-size:56px;line-height:1}
.mkid,.mchase{position:absolute;bottom:20px;-webkit-transition:left 1s linear,bottom 1s linear;transition:left 1s linear,bottom 1s linear;text-align:center}
.mkid{width:64px;margin-left:-8px;z-index:3;animation:bob 0.5s infinite ease-in-out}
.mkid.arrive{animation:none}
.mkid.caught{animation:shake .3s infinite}
.mface{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#fff;display:block;margin:0 auto}
.mbody{display:block;font-size:30px;line-height:1;margin-top:-6px}
.mchase{z-index:2;width:76px;margin-left:-8px}
.mchase img{width:70px;height:70px;object-fit:contain;display:block;animation:bob .4s infinite ease-in-out}
/* 로켓단이 포켓몬을 끌고 가요 */
.mrk{position:absolute;bottom:16px;z-index:2;white-space:nowrap;-webkit-transition:left 1s linear,bottom 1s linear;transition:left 1s linear,bottom 1s linear}
.mpath{position:absolute;left:0;top:0;width:100%;height:100%}
.mdc{position:absolute;line-height:1;opacity:.9}
.mroute{position:absolute;right:8px;top:6px;background:rgba(255,255,255,.85);border-radius:10px;padding:1px 9px;font-size:12px;font-weight:800;color:#5d4037;z-index:4}
.mschool{z-index:1}
@media(max-width:640px){.mrk{-webkit-transform:scale(.72);transform:scale(.72);-webkit-transform-origin:left bottom;transform-origin:left bottom}}
.mrkrow{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;position:relative}
.mrkmon{position:relative;width:66px;margin-right:6px;-webkit-animation:mfbob .8s infinite ease-in-out;animation:mfbob .8s infinite ease-in-out}
.mrkmon img{width:66px;height:66px;object-fit:contain;display:block;position:relative;z-index:1}
.mnet{position:absolute;left:-6px;right:-6px;top:-6px;bottom:-4px;z-index:2;border:2px solid rgba(110,70,160,.85);border-radius:14px;background:repeating-linear-gradient(45deg,rgba(110,70,160,.30) 0 3px,transparent 3px 9px),repeating-linear-gradient(-45deg,rgba(110,70,160,.30) 0 3px,transparent 3px 9px);-webkit-transition:opacity .6s;transition:opacity .6s}
.mrope{width:16px;height:0;border-top:3px dashed #5d4037;margin:0 -2px 26px 0;-webkit-transition:opacity .6s;transition:opacity .6s}
.mrkr{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end}
.mrkr .rkchar{width:60px;max-width:none}
.mrkr .rkcat{width:50px;max-width:none}
.mrk.worry .mrkr{-webkit-animation:shake .35s infinite;animation:shake .35s infinite}
.mrk .mfamb{left:30px}
.mrk.gone .mnet,.mrk.gone .mrope{opacity:0}
.mrk.gone .mrkmon{-webkit-animation:mfjump .45s infinite ease-in-out;animation:mfjump .45s infinite ease-in-out}
.mrk.gone .mrkr{-webkit-animation:mrkfly 1.6s ease-in forwards;animation:mrkfly 1.6s ease-in forwards}
@keyframes mrkfly{0%{transform:none;opacity:1}100%{transform:translate(170px,-160px) rotate(35deg);opacity:0}}
.mbye{position:absolute;left:62px;top:-34px;font-size:13px;font-weight:800;color:#c62828;background:#fff;border-radius:10px;padding:1px 7px}
.mfam{position:absolute;bottom:18px;left:62%;transform:translateX(-50%);text-align:center;z-index:2}
.mfrow{display:flex;justify-content:center;position:relative;z-index:1}
.mfp{width:52px;margin:0 -5px;animation:mfbob .8s infinite ease-in-out}
.mfpf{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:block;margin:0 auto;background:#fff}
.mfpe{display:block;font-size:40px;line-height:48px}
.mfpb{display:block;font-size:26px;line-height:1;margin-top:-4px;transform-origin:50% 100%;animation:mfwave .5s infinite ease-in-out}
@keyframes mfbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mfwave{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.mice2{position:absolute;left:-8px;right:-8px;top:-8px;bottom:-6px;background:rgba(160,225,255,.45);border:3px solid rgba(255,255,255,.85);border-radius:16px;z-index:2;transition:all .8s;box-shadow:inset 0 0 12px rgba(255,255,255,.8)}
.mice{position:absolute;right:-14px;top:-14px;font-size:30px;z-index:3;transition:all .8s}
.mfam.free .mice2{opacity:0;transform:scale(1.5)}
.mfam.free .mice{opacity:0;transform:scale(2.4)}
.mfam.free .mfp{animation:mfjump .45s infinite ease-in-out}
.mfam.free .mfpb{animation-duration:.25s}
@keyframes mfjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.mfam.worry .mfp{animation:shake .35s infinite}
.mfamb{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid #ef5350;color:#c62828;border-radius:12px;padding:1px 8px;font-size:13px;font-weight:800}
.mheart{position:absolute;left:30%;top:-34px;font-size:28px;animation:bob .6s infinite ease-in-out}
.mheart.h2{left:70%;animation-delay:-.3s}
.mbub{position:absolute;top:6px;background:#fff;border-radius:14px;padding:4px 10px;font-weight:800;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:left 1s linear;white-space:nowrap}
.msteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:4px}
.msteps>*{margin:5px}
.mstep{display:flex;align-items:center;padding:12px 10px;border-radius:16px;font-size:20px;text-align:left}
.mstep .mn{flex:none;width:34px;height:34px;border-radius:50%;background:#fff3e0;border:2px solid #ffb74d;display:inline-block;text-align:center;line-height:30px;font-weight:900;margin-right:10px}
.mstep.done{background:#c8e6c9;border-color:var(--green)}
.mstep.done .mn{background:var(--green);border-color:var(--green);color:#fff}
.mstep.done b{text-decoration:line-through;opacity:.65}
.mfin{font-size:22px;padding:12px 22px}
.mres{text-align:center;font-size:20px;font-weight:800;color:#2e7d32;margin:8px 0}
.scene{position:relative;height:420px;border-radius:18px;overflow:hidden;background:linear-gradient(#8ed1fc,#d9f3ff 62%);border:3px solid var(--line)}
.scene.ph-night{background:linear-gradient(#0d1b3e,#3b4f86 70%)}
.scene.ph-dawn{background:linear-gradient(#f8b7a0,#ffe9c7 65%)}
.scene.ph-dusk{background:linear-gradient(#5b6fb5,#f4a261 72%)}
.scene.wx-rain.ph-day,.scene.wx-cloudy.ph-day{background:linear-gradient(#9aa7b4,#d4dde5 65%)}
.scene.wx-rain.ph-dawn,.scene.wx-rain.ph-dusk,.scene.wx-snow.ph-dawn,.scene.wx-snow.ph-dusk{background:linear-gradient(#78828f,#b9c2cc 65%)}
.scene.wx-snow.ph-day,.scene.wx-fog.ph-day{background:linear-gradient(#c9d3dc,#eef3f7 65%)}
.scene.wx-rain.ph-night,.scene.wx-snow.ph-night{background:linear-gradient(#1a2233,#44506a 70%)}
.scene .tint{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:transparent}
.scene.wx-rain .tint{background:rgba(70,85,105,.22)}
.scene.wx-cloudy .tint{background:rgba(110,120,135,.12)}
.scene.wx-fog .tint{background:rgba(240,244,248,.45)}
.scene.wx-snow .tint{background:rgba(235,242,248,.2)}
.scene .sdrop,.scene .sflake,.scene .sleaf{position:absolute;pointer-events:none;font-style:normal;z-index:5}
.scene .sdrop{top:-8%;width:2px;height:16px;background:rgba(235,245,255,.8);animation:srain linear infinite}
@keyframes srain{from{transform:translate3d(0,0,0)}to{transform:translate3d(-10px,420px,0)}}
.scene .sflake{top:-6%;color:#fff;text-shadow:0 0 3px rgba(96,125,139,.9);animation:ssnow linear infinite}
@keyframes ssnow{from{transform:translate3d(0,0,0)}to{transform:translate3d(30px,420px,0)}}
.scene .sleaf{left:-6%;font-size:18px;animation:sleaf linear infinite}
@keyframes sleaf{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(900px,40px,0) rotate(540deg)}}
.scene .flash{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:6;animation:flash 6s infinite}
@keyframes flash{0%,93%,100%{opacity:0}95%{opacity:.55}97%{opacity:.1}98%{opacity:.4}}
.scene.windy .dc{transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
.scene .vwrap{position:absolute;z-index:4}
.vtag{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px;white-space:nowrap}
.bstage{position:relative;width:min(88vw,520px);height:290px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px #90a4ae}
.bsky{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(#8ed1fc,#d9f3ff 55%,#bde48a 56%,#8bc34a)}
.bground{position:absolute;left:-10%;right:-10%;bottom:-40px;height:150px;background:radial-gradient(ellipse at 50% 30%,#a5d66b,#7cb342 70%);border-radius:50%}
.bsh{position:absolute;width:100px;height:22px;background:rgba(0,0,0,.22);border-radius:50%}
.bmon{position:absolute;object-fit:contain;z-index:3}
.bmon.mine{width:150px;height:150px;left:6%;bottom:16px}
.bmon.foe{width:118px;height:118px;right:7%;top:56px}
.bpan{position:absolute;background:rgba(255,255,255,.92);border:2px solid #455a64;border-radius:12px;padding:3px 8px;font-size:13px;width:150px;z-index:5;text-align:left}
.bpan.foep{left:6px;top:8px}
.bpan.minep{right:6px;bottom:8px}
.bpan b{font-size:14px}
.bsub{font-size:11px;color:#546e7a}
.tchip{font-style:normal;font-size:10px;background:#eceff1;border-radius:8px;padding:0 4px;margin-left:2px;white-space:nowrap}
.bhp{height:10px;background:#cfd8dc;border-radius:6px;overflow:hidden;margin-top:2px}
.bhp i{display:block;height:100%;background:#43a047;transition:width .6s,background .3s}
.bpan small{font-size:10px;color:#607d8b}
#bfx{position:absolute;left:0;top:0;right:0;bottom:0;z-index:6;pointer-events:none}
.bproj,.bburst,.bdmg{position:absolute;transform:translate(-50%,-50%)}
.bproj{font-size:40px;transition:left .38s linear,top .38s linear}
.bburst{font-size:58px;animation:bburst .8s ease-out forwards}
@keyframes bburst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.bdmg{font-size:26px;font-weight:900;color:#fff;text-shadow:-2px 0 #c62828,2px 0 #c62828,0 -2px #c62828,0 2px #c62828;animation:bdmg 1.1s ease-out forwards}
.bdmg.crit{font-size:38px;color:#ffeb3b}
@keyframes bdmg{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.bmon.lungeA{animation:lungeA .5s}
.bmon.lungeB{animation:lungeB .5s}
@keyframes lungeA{40%{transform:translate(90px,-60px) scale(1.12)}100%{transform:none}}
@keyframes lungeB{0%{transform:scaleX(-1)}40%{transform:translate(-90px,60px) scaleX(-1) scale(1.12)}100%{transform:scaleX(-1)}}
.bmon.gethit{animation:gethit .42s}
@keyframes gethit{0%,100%{filter:none;margin-left:0}20%{filter:brightness(3) saturate(0);margin-left:-8px}40%{margin-left:8px}60%{filter:brightness(2);margin-left:-6px}80%{margin-left:5px}}
.bmon.faint{transition:all .9s;transform:translateY(60px) rotate(-25deg);opacity:0;filter:grayscale(1)}
.bmon.foe.faint{transform:translateY(60px) rotate(25deg) scaleX(-1)}
.bmon.popin{animation:popin .7s}
@keyframes popin{0%{transform:scale(.1) translateY(40px);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.bmon.cheer{animation:cheer .5s infinite ease-in-out}
@keyframes cheer{50%{margin-bottom:18px}}
.bstage.sk{animation:shake .4s}
.bbanner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);opacity:0;z-index:8;transition:opacity .4s,transform .4s;transform:scale(.6)}
.bbanner.show{opacity:1;transform:scale(1)}
.bbanner.l{color:#cfd8dc}
.bmsg{margin-top:8px;background:#263238;color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;min-height:44px;width:min(88vw,520px);box-sizing:border-box;text-align:left}
.bday{position:relative;overflow:hidden;border-radius:18px;padding:12px;text-align:center;background:linear-gradient(#ffe0f0,#fff4c9 55%,#d6f2ff);border:3px solid #ffb300}
.bdconf{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:1}
.bdc{position:absolute;top:-8%;font-style:normal;animation:bdfall linear infinite}
@keyframes bdfall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(20px,520px,0) rotate(360deg)}}
.bdhead,.bdguests,.bdmons,.bday .acts,.bdcake{position:relative;z-index:2}
.bdface{display:inline-block;position:relative}
.bdcrown{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:34px}
.bdt1{font-size:30px;font-weight:900;color:#d81b60;margin-top:2px}
.bdt2{font-size:18px;font-weight:800;color:#6d4c41}
.bdguests{display:flex;justify-content:center;margin-top:10px}
.bdg{width:30%;position:relative;padding-top:50px}
.bdgi{width:100%;max-width:170px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 10px #ffd54f);animation:bob 1.6s infinite ease-in-out}
.bdg.talk .bdgi{animation:bdjump .5s infinite ease-in-out;filter:drop-shadow(0 0 14px #ff80ab)}
@keyframes bdjump{50%{transform:translateY(-14px) scale(1.06)}}
.bdg small{display:block;font-weight:800;font-size:14px;min-height:18px}
.bdbub{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:90%;background:#fff;border:3px solid #ff80ab;border-radius:16px;padding:4px 8px;font-size:15px;font-weight:800;opacity:0;transition:opacity .3s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bdbub.show{opacity:1}
.bdcake{font-size:56px;line-height:1;margin-top:2px;animation:bob 1.2s infinite ease-in-out}
.bdmons{display:flex;justify-content:center;flex-wrap:wrap;margin-top:6px}
.bdm{width:15%;max-width:110px;aspect-ratio:1;object-fit:contain;margin:0 2px}
.bdm.d0{animation:bddance0 .9s infinite ease-in-out}
.bdm.d1{animation:bddance1 1.1s infinite ease-in-out}
.bdm.d2{animation:bddance2 .8s infinite ease-in-out}
@keyframes bddance0{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(8deg)}}
@keyframes bddance1{0%,100%{transform:scale(1) rotate(6deg)}50%{transform:scale(1.15) rotate(-6deg)}}
@keyframes bddance2{0%,100%{transform:translateX(-6px) scaleX(1)}25%{transform:translateX(6px) translateY(-10px)}50%{transform:translateX(6px) scaleX(-1)}75%{transform:translateX(-6px) translateY(-10px) scaleX(-1)}}
.dboard{background:linear-gradient(#fff8e1,#ffecb3);border:3px solid #ffb300;border-radius:18px;padding:10px}
.dhead{display:flex;align-items:center;flex-wrap:wrap}
.dhead>*{margin:2px 6px 2px 0}
.drem{margin-top:6px;background:#fff;border-radius:12px;padding:6px 10px;font-size:15px}
.drem span{display:inline-block;margin:2px 10px 2px 0;font-weight:700}
.drem b{color:#e65100}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));margin-top:8px}
.dgrid.s{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.dgrid.m{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.dgrid.l{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.dgrid.s .dtab{height:54px;font-size:16px}
.dgrid.m .dtab{height:76px;font-size:22px}
.dgrid.l .dtab{height:104px;font-size:28px}
.dgrid>*{margin:4px}
.dtab{position:relative;height:62px;border-radius:6px;background:repeating-linear-gradient(45deg,#fff3c4,#fff3c4 8px,#ffe69a 8px,#ffe69a 16px);border:2px solid #f9a825;box-shadow:1px 2px 3px rgba(0,0,0,.25);display:grid;place-items:center;font-size:18px;font-weight:900;color:#e65100;padding:0}
.dtab .stp{position:absolute;left:50%;top:4px;width:20px;height:5px;margin-left:-10px;background:#9e9e9e;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.4)}
.dtab.open{background:#eceff1;border:2px dashed #b0bec5;box-shadow:none;color:#607d8b;font-size:24px;line-height:1}
.dtab.open small{display:block;font-size:10px;font-weight:700}
.tearbox{position:relative;width:210px;height:170px;margin:8px auto}
.prz{position:absolute;left:0;top:0;right:0;bottom:0;display:grid;place-items:center;background:#fff;border:3px dashed #ffb300;border-radius:12px;font-size:24px;font-weight:900;padding:8px;text-align:center;line-height:1.3}
.prz.show{animation:przpop .6s .9s both}
@keyframes przpop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.tearp{position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#fff3c4,#fff3c4 10px,#ffe69a 10px,#ffe69a 20px);border:3px solid #f9a825;border-radius:12px;transform-origin:0 0;animation:tearoff 1.1s .2s forwards}
.tearp:before{content:'';position:absolute;left:50%;top:6px;width:30px;height:7px;margin-left:-15px;background:#9e9e9e;border-radius:3px}
@keyframes tearoff{0%{transform:none}35%{transform:rotate(-6deg) translateY(-4px)}100%{transform:rotate(-80deg) translate(-60px,-150px);opacity:0}}
.scene .wm.h-sky{animation-name:skydrift}
.scene .wm.h-lake,.scene .wm.h-sea{animation-name:swim}
.scene .wm.h-mountain,.scene .wm.h-volcano,.scene .wm.h-forest{animation-name:wander2}
.scene .wm.h-lake img,.scene .wm.h-sea img{-webkit-clip-path:inset(0 0 24% 0);clip-path:inset(0 0 24% 0)}
@keyframes skydrift{0%{transform:translate(0,0) scaleX(1)}25%{transform:translate(40px,-12px) scaleX(1)}49%{transform:translate(80px,4px) scaleX(1)}51%{transform:translate(80px,4px) scaleX(-1)}75%{transform:translate(40px,-12px) scaleX(-1)}99%{transform:translate(0,0) scaleX(-1)}100%{transform:translate(0,0) scaleX(1)}}
@keyframes swim{0%{transform:translate(0,0) scaleX(1)}25%{transform:translate(18px,-5px) scaleX(1)}48%{transform:translate(36px,0) scaleX(1)}50%{transform:translate(36px,0) scaleX(-1)}75%{transform:translate(18px,-5px) scaleX(-1)}98%{transform:translate(0,0) scaleX(-1)}100%{transform:translate(0,0) scaleX(1)}}
@keyframes wander2{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(26px) scaleX(1)}50%{transform:translateX(26px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.scene .smk{animation:smk 4s ease-in-out infinite}
.scene .smk.s2{animation-delay:-1.3s}
.scene .smk.s3{animation-delay:-2.6s}
@keyframes smk{0%,100%{opacity:.15}50%{opacity:.65}}
.mon{position:relative}
.mon.boxed{background:#eceff1;border-color:#b0bec5}
.mon.boxed img{opacity:.85}
.mon.marked{border-color:#1e88e5;background:#e3f2fd}
.mon .mk{position:absolute;right:6px;top:4px;color:#1e88e5;font-size:20px}
.pball{position:absolute;left:6px;top:6px;width:18px;height:18px;border-radius:50%;border:2px solid #37474f;background:linear-gradient(#e53935 46%,#37474f 46%,#37474f 54%,#fff 54%);z-index:1}
.pball:after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;border:2px solid #37474f}
.twe,img.twe{width:1.1em!important;height:1.1em!important;max-width:none!important;vertical-align:-0.15em!important;display:inline-block!important;margin:0 .02em!important;position:static!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:none!important;-webkit-animation:none!important;animation:none!important;-webkit-filter:none!important;filter:none!important;-webkit-clip-path:none!important;clip-path:none!important;object-fit:contain!important;opacity:1!important;float:none!important}
.rock{border-radius:18px;padding:14px;text-align:center;color:#fff;background:radial-gradient(#6a1b9a,#311b92 75%);border:4px solid #e53935;animation:rkflash 1s infinite alternate}
@keyframes rkflash{from{box-shadow:0 0 0 rgba(229,57,53,0)}to{box-shadow:0 0 28px rgba(229,57,53,.9)}}
.rkhead{font-size:34px;font-weight:900}
.rkR{display:inline-block;width:46px;height:46px;line-height:46px;border-radius:50%;background:#e53935;border:3px solid #fff;font-size:30px;margin-right:6px}
.rkcrew{display:flex;justify-content:center;align-items:flex-end;margin:4px 0}
.rkp{position:relative;width:31%;max-width:190px;text-align:center;padding-top:50px}
.rkp b{display:block;font-size:20px}
.rkchar{width:100%;max-width:150px;height:auto;animation:bob 1.1s infinite ease-in-out}
.rkchar.sp{image-rendering:pixelated;background:radial-gradient(circle,rgba(255,255,255,.85) 0,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 72%);border-radius:50%;-webkit-filter:drop-shadow(0 0 3px #fff);filter:drop-shadow(0 0 3px #fff)}
.rkp:nth-child(3) .rkchar{animation-delay:-.5s}
.rkcat{width:100%;max-width:150px;animation:bob .9s infinite ease-in-out}
.rkp.mid{padding-top:56px}
.rkballoon{position:absolute;left:50%;top:20px;margin-left:-60px;font-size:42px;transform:rotate(-15deg)}
.rkbub{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;color:#4a148c;border-radius:14px;padding:3px 8px;font-size:13px;font-weight:800;white-space:normal;width:max-content;max-width:94%;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rkmsg{font-size:20px;font-weight:800;margin:2px 0}
.rkt{font-size:24px;font-weight:800;margin:6px 0}
.rkt b{font-size:44px;color:#ffeb3b}
.rkhelp{font-size:17px;font-weight:700;background:rgba(0,0,0,.35);border-radius:12px;padding:6px 10px;margin:6px 0}
.rkbtns{display:flex;flex-wrap:wrap;justify-content:center}
.rkbtn{position:relative;display:flex;flex-wrap:wrap;align-items:center;width:calc(33% - 8px);min-width:200px;margin:6px 4px;padding:10px;border-radius:18px;background:#fff;color:#4a148c;font-size:20px;text-align:left}
.rkbtn img{width:64px;height:64px;object-fit:contain;margin-right:8px}
.rkbtn small{display:block;font-size:13px;color:#7b1fa2}
.rkbar{width:100%;height:14px;background:#e1bee7;border-radius:8px;overflow:hidden;margin-top:6px}
.rkbar i{display:block;height:100%;background:linear-gradient(#ff7043,#e53935);transition:width .1s}
.rkdone{width:calc(33% - 8px);min-width:200px;margin:6px 4px;padding:18px 10px;border-radius:18px;background:#c8e6c9;color:#1b5e20;font-size:22px;font-weight:800}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));margin-top:8px}
.shopg>*{margin:4px}
.shopi{display:block;text-align:center;padding:8px 4px}
.shopi span{display:block;font-size:34px;line-height:1.1}
.shopi b{display:block;font-size:14px}
.shopi small{display:block;font-size:13px}
.giverow{display:flex;align-items:center;margin-top:8px}
.giverow b{width:64px;flex:none}
.giverow button{margin-right:8px}
.scene svg{position:absolute;left:0;top:0;width:100%;height:100%}
.scene .dc,.scene .tr,.scene .wm,.scene .sun,.scene .cl{position:absolute}
.scene .dc{line-height:1;transform:translateX(-50%)}
.scene .sun{top:10px;right:6%;font-size:46px}
.scene .cl{font-size:40px;opacity:.9;animation:drift 50s linear infinite}
@keyframes drift{from{left:-12%}to{left:105%}}
.scene .tr img{height:88px;width:auto;display:block}
.scene .wm{cursor:pointer;animation:wander 9s ease-in-out infinite}
.scene .wm img{width:100%;display:block}
.scene .wm.sel img{filter:drop-shadow(0 0 6px #ff5252)}
@keyframes wander{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(70px) scaleX(1)}50%{transform:translateX(70px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.tpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:80vw}
.tpick button{padding:6px}
.tpick img{height:70px;width:auto;display:block;margin:auto}
/* 진화 계보 */
.evw{overflow-x:auto;padding:8px 0;margin:6px 0;border-bottom:1px dashed var(--line);text-align:left}
.evt{display:flex;align-items:center}
.evk{display:flex;flex-direction:column}
.evn{text-align:center;padding:4px 6px;border-radius:12px;min-width:84px}
.evn img{width:72px;height:72px;object-fit:contain}
.evn div{font-size:13px;font-weight:700}
.evn.cur{background:#ffebee;outline:3px solid var(--red)}
.arr{font-size:22px;margin:0 4px;color:var(--red)}
.gen{display:flex;align-items:center;margin:4px 0;font-size:14px}
.gen span:first-child{width:50px}
.gen .prog{flex:1;margin:0 8px}
.gen span:last-child{width:70px;text-align:right}
/* 기록 */
.wk{display:flex;align-items:flex-end;height:110px;margin:8px 0}
.wk div{flex:1;text-align:center;font-size:13px;margin:0 3px}
.wk i{display:block;background:var(--green);border-radius:6px 6px 0 0;min-height:3px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bd{text-align:center;border:3px solid var(--yellow);background:#fffde7;border-radius:14px;padding:8px}
.bd b{display:block;font-size:30px}
.bd span{font-size:14px;font-weight:700;display:block}
.bd small{font-size:12px;opacity:.7}
.bd.lock{opacity:.35;filter:grayscale(1);border-color:var(--line)}
/* overlay / toast */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:9}
#ov.show{display:grid}
#ov .box{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:90vw;max-height:92vh;overflow:auto}
#ov img.big{width:240px;height:240px;object-fit:contain;animation:pop .6s}
/* 비밀의 문 5개 + 캐릭터 마을 */
.sdoor{position:absolute;width:34px;height:52px;padding:0;border:0;border-radius:17px 17px 2px 2px;background:#a0693d;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.3);z-index:4;cursor:pointer}
.sdoor:after{content:"";position:absolute;right:6px;top:28px;width:5px;height:5px;border-radius:50%;background:#ffd54f}
.sdoor i{position:absolute;left:-4px;top:-20px;font-size:16px;font-style:normal;-webkit-animation:bob 2s ease-in-out infinite;animation:bob 2s ease-in-out infinite}
.sdoor.d-chii{background:#f48fb1}
.sdoor.op{box-shadow:inset 0 0 0 3px #fff,0 0 12px 3px #fff59d}
.vsc{position:relative;width:100%;max-width:560px;height:250px;margin:0 auto 10px;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.vs-chii{background:#bfe6ff;background:linear-gradient(#bfe6ff,#eaf8ff 55%,#a8dd84 55%,#7cc35b)}
.vd{position:absolute;line-height:1}
.vsea{position:absolute;left:0;right:0;top:90px;bottom:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 2px,transparent 2px 22px)}
.visl{position:absolute;left:-8%;bottom:-26px;width:56%;height:96px;border-radius:50%;background:#f0dfae;box-shadow:inset 0 7px 0 #b5d97a}
.vship{position:absolute;left:56%;top:56px;width:150px;-webkit-animation:vbob 2.4s ease-in-out infinite;animation:vbob 2.4s ease-in-out infinite}
.vship svg{width:150px;height:auto;display:block}
.vship .vtr{position:absolute;left:4px;top:40px;height:42px;width:auto}
.vcr{position:absolute;top:36px;width:24px;height:36px;border-radius:5px;object-fit:cover;object-position:center top;border:2px solid #fff;box-sizing:border-box;opacity:0;-webkit-transition:opacity .6s;transition:opacity .6s;background:#f1ecff}
.vsc.sail .vcr{opacity:1}
.vsc.sail .va{opacity:0}
.vsc.sail .vship{-webkit-animation:vsail 7s ease-in-out;animation:vsail 7s ease-in-out}
@keyframes vbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes vsail{0%{transform:translateX(0)}45%{transform:translateX(400px) rotate(2deg)}55%{transform:translateX(400px) rotate(-2deg)}100%{transform:translateX(0)}}
.va{position:absolute;width:50px;height:82px;-webkit-animation:vwalk 8s ease-in-out infinite;animation:vwalk 8s ease-in-out infinite;-webkit-transition:opacity .6s;transition:opacity .6s}
.va:before{content:"";position:absolute;left:-5px;right:-5px;bottom:-1px;height:10px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.va img{position:relative;width:50px;height:74px;border-radius:8px 8px 4px 4px;object-fit:cover;object-position:center top;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.45);display:block;background:#f1ecff;box-sizing:border-box}
.va img.cut{position:absolute;left:50%;bottom:6px;top:auto;width:auto;height:auto;max-width:64px;max-height:78px;border:0;border-radius:0;background:none;box-shadow:none;-webkit-transform:translateX(-50%);transform:translateX(-50%);-webkit-filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.va:before{left:2px;right:2px;bottom:-1px;height:9px;background:rgba(0,0,0,.28);box-shadow:none}
.va img.cut+span{top:84px}
.vcr.cut{width:auto;height:36px;border:0;border-radius:0;background:none;-webkit-filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.vbig img.cut{position:absolute;left:50%;top:auto;bottom:0;width:auto;height:auto;max-width:190px;max-height:250px;border:0;border-radius:0;box-shadow:none;-webkit-transform:translateX(-50%);transform:translateX(-50%);-webkit-filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.vsc.crowd .va span{display:none}
.va span{position:absolute;left:50%;top:84px;-webkit-transform:translateX(-50%);transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
@keyframes vwalk{0%{transform:translate(0,0)}25%{transform:translate(9px,-4px)}50%{transform:translate(18px,0)}75%{transform:translate(9px,-4px)}100%{transform:translate(0,0)}}
@keyframes vfall{from{transform:translate(0,-20px)}to{transform:translate(30px,260px)}}
.vpt{position:absolute;top:0;font-size:14px;-webkit-animation:vfall 7s linear infinite;animation:vfall 7s linear infinite}
.cv{position:absolute;z-index:3;width:46px;text-align:center;-webkit-animation:wander2 9s ease-in-out infinite;animation:wander2 9s ease-in-out infinite}
.cv img{display:block;margin:0 auto;width:auto;height:auto;max-width:48px;max-height:56px;-webkit-filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.cv img.nocut{height:56px;border:2px solid #fff;border-radius:6px;box-sizing:content-box}
.cv span{display:block;font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.vbr{margin:6px 0 10px;padding:8px 10px;border-radius:12px;background:#fff7fb;border:1px solid #f4c9d8}
.cva{position:absolute;width:104px;padding:0;border:0;background:none;box-shadow:none;text-align:center;-webkit-animation:vwalk2 9s ease-in-out infinite;animation:vwalk2 9s ease-in-out infinite;cursor:pointer}
.cva img{display:block;margin:0 auto;width:auto;height:auto;max-width:100px;max-height:128px;position:relative;-webkit-filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.cva img.nocut{width:84px;height:124px;object-fit:cover;object-position:center top;border:3px solid #fff;border-radius:10px;box-sizing:border-box}
.cva .shd{position:absolute;left:14%;right:14%;bottom:20px;height:14px;border-radius:50%;background:rgba(0,0,0,.25)}
.cva .nm{display:block;margin-top:2px;font-size:14px;font-weight:800;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap}
@keyframes vwalk2{0%{transform:translate(0,0)}25%{transform:translate(18px,-6px)}50%{transform:translate(36px,0)}75%{transform:translate(18px,-6px)}100%{transform:translate(0,0)}}
.chempty{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:800;color:#fff;text-shadow:0 0 4px #000;font-size:16px;z-index:3}
.vwrap{width:560px;max-width:80vw}
.vhead{border-radius:14px;padding:8px 10px;margin-bottom:10px}
.vhead h2{margin:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,92px);grid-gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.vt{width:92px;text-align:center}
.vt .vi{position:relative;width:92px;height:116px;border-radius:14px;overflow:hidden;background:#f1ecff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.vt .vi img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.vt .vph{position:absolute;left:0;right:0;top:34px;font-size:40px;font-weight:800;color:#b39ddb}
.vt:not(.on) .vi img{-webkit-filter:brightness(0);filter:brightness(0);opacity:.28}
.vt b{display:block;font-size:12px;margin-top:3px;color:#5b4a45;min-height:16px}
.vbig{position:relative;width:190px;height:250px;margin:0 auto 18px;-webkit-animation:pop .6s;animation:pop .6s}
.vbig:after{content:"";position:absolute;left:10px;right:10px;bottom:-4px;height:16px;border-radius:50%;background:rgba(0,0,0,.22)}
.vbig img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:12px 12px 6px 6px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.vbig .vph{z-index:1;position:absolute;left:0;right:0;top:80px;font-size:80px;font-weight:800;color:#b39ddb}
.vq{font-size:90px;-webkit-animation:bob .5s infinite;animation:bob .5s infinite;margin:30px 0}
.chb{min-height:30px;margin-top:10px;font-size:22px;font-weight:700;color:#d81b60}
/* 진화 연출: 빛나며 모습이 바뀌어요 */
.evst{position:relative;width:340px;max-width:78vw;height:340px;border-radius:20px;background:#1b1240;background:radial-gradient(circle,#4a3a8a,#120a2a);overflow:hidden;margin:0 auto}
.evray{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;opacity:0;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 8deg,rgba(255,255,255,0) 8deg 24deg);-webkit-animation:evspin 4s linear infinite;animation:evspin 4s linear infinite}
.evray.on{opacity:.55;transition:opacity .8s}
@keyframes evspin{to{transform:rotate(360deg)}}
.evimg{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;object-fit:contain}
.evimg.evw{-webkit-filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff);filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff);-webkit-animation:evwob .28s ease-in-out infinite alternate;animation:evwob .28s ease-in-out infinite alternate}
.evimg.evg{-webkit-animation:evgrow .9s ease-in-out forwards;animation:evgrow .9s ease-in-out forwards}
@keyframes evwob{from{transform:scale(.96) rotate(-3deg)}to{transform:scale(1.1) rotate(3deg)}}
@keyframes evgrow{from{transform:scale(1)}to{transform:scale(1.35)}}
.evfl{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none}
.evfl.go{-webkit-animation:evfl .9s ease-out;animation:evfl .9s ease-out}
@keyframes evfl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

  if(!k.vil||typeof k.vil!=='object'||Array.isArray(k.vil))k.vil={};if(!k.cc||typeof k.cc!=='object'||Array.isArray(k.cc))k.cc={};if(k.sdoor&&!k.vil.chii)k.vil.chii=1;if(!Array.isArray(k.cb))k.cb=[];   // 비밀의 문(열림) · 모은 캐릭터

  const keys=Object.keys(k.hist).sort();while(keys.length>45)delete k.hist[keys.shift()];

/* 스탠바이미처럼 큰 화면이면 전체를 비율에 맞춰 키워요 (아이패드는 그대로) */
function fitScreen(){
  try{
    const w=window.innerWidth,h=window.innerHeight,b=document.body,port=h>w*1.1;
    if(!w||!h)return;
    if(w<1200&&h<1100){b.style.zoom='';b.style.minHeight='';b.classList.remove('port');return}
    const z=port?w/800:h/760;b.style.zoom=String(Math.round(z*100)/100);b.style.minHeight=Math.floor(h/z)+'px';   // 확대된 만큼 높이 기준도 줄여요
    
    if(port)b.classList.add('port');else b.classList.remove('port');
    /* 홈 화면이 세로로 넘치면(아이 할 일이 많거나 글자가 커진 기기) 한 화면에 들어올 때까지 조금씩 줄여요 */
    if(!port&&document.querySelector('.tri')){let zz=z,n=0;while(n<5&&zz>z*0.6){const sh=document.documentElement.scrollHeight;if(sh<=h+2)break;zz=zz*h/sh*0.99;b.style.zoom=String(Math.round(zz*100)/100);b.style.minHeight=Math.floor(h/zz)+'px';n++}}
  }catch(e){}
}
if(window.addEventListener)window.addEventListener('resize',fitScreen);fitScreen();
const BUILD='20261124o';
/* 새 버전이 올라왔는지 가끔 확인해서 자동으로 다시 불러와요 (아이패드 캐시 때문에 옛 화면이 남는 것 방지) */
async function checkUpdate(){
  try{
    if(tab!=='home'||busy)return;
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);
    if(!m||m[1]===BUILD)return;
    let last='';try{last=localStorage.getItem('pk_upd')||''}catch(e){}
    if(last.split('|')[0]===m[1]&&Date.now()-(+last.split('|')[1]||0)<3600000)return;   // 같은 버전으로 계속 다시 불러오지 않게
    try{localStorage.setItem('pk_upd',m[1]+'|'+Date.now())}catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }catch(e){}
}
setInterval(checkUpdate,10*60000);setTimeout(checkUpdate,30000);

let AC=null;
function sfx(type){
  if(S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const seqs={coin:[[988,.08],[1319,.2]],win:[[523,.1],[659,.1],[784,.1],[1047,.35]],hatch:[[392,.1],[523,.1],[659,.1],[784,.1],[1047,.45]],
      evo:[[523,.12],[587,.12],[659,.12],[784,.12],[880,.12],[1047,.55]],badge:[[784,.12],[988,.12],[1175,.35]],buy:[[660,.1],[880,.25]]};
    let t=AC.currentTime;
    (seqs[type]||[]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9});
  }catch(e){}
}
/* ---------- 밤 화면 어둡게 (검은 막으로 덮어요. 실제로 화면이 꺼지는 건 아니에요) ---------- */
const DIM_DEF={on:true,from:'23:00',to:'07:00',ramp:60};      // 23시에 가장 어둡게, 7시에 가장 환하게, 22시부터 서서히 어두워져요
function dimCfg(){return Object.assign({},DIM_DEF,S.dim||{})}
let dimManual=false,dimPeek=0,dimEl=null;
function dimLevel(n){                                           // 0(환함) ~ 1(완전 어두움)
  if(dimManual)return 1;
  if(Date.now()<dimPeek)return 0;
  const c=dimCfg();if(!c.on)return 0;
  const p=s=>{const a=String(s).split(':');return (+a[0]||0)*60+(+a[1]||0)},m=n.getHours()*60+n.getMinutes(),f=p(c.from),t=p(c.to),r=Math.max(0,+c.ramp||0);
  const inNight=f>t?(m>=f||m<t):(m>=f&&m<t);
  if(inNight)return 1;
  const d=(f-m+1440)%1440;                                      // 어두워지는 시각까지 남은 분
  if(r&&d<=r)return Math.min(.85,(1-d/r)*.85);
  return 0;
}
function dimTick(){
  try{
    if(!dimEl){
      dimEl=document.createElement('div');dimEl.id='dim';
      dimEl.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;z-index:50;-webkit-transition:opacity 1.5s;transition:opacity 1.5s';
      (document.documentElement||document.body).appendChild(dimEl);

/* ---------- 아침 배경음악 (파일 없이 코드로 만든 잔잔한 오르골 멜로디) ---------- */
const BGM_DEF={on:true,from:'08:00',to:'09:00',vol:.1};          // 월~금 아침 8시~9시
function bgmCfg(){return Object.assign({},BGM_DEF,S.bgm||{})}
function bgmShould(n){
  const c=bgmCfg();if(!c.on||S.mute)return false;
  const d=n.getDay();if(d<1||d>5)return false;                   // 월~금만
  const m=n.getHours()*60+n.getMinutes(),p=s=>{const a=String(s).split(':');return (+a[0]||0)*60+(+a[1]||0)};
  return m>=p(c.from)&&m<p(c.to);
}
// 끝없이 조금씩 달라지는 멜로디: 조(키)·코드 진행·템포·리듬을 바꿔 가며 계속 새로 만들어요
const BGM_MAJ=[0,2,4,5,7,9,11],BGM_PROGS=[[0,9,5,7],[0,5,9,7],[5,0,7,0],[0,4,9,5],[9,5,0,7],[0,7,9,5],[5,7,4,9],[0,2,5,7]],
  BGM_RHY=[[1,1,1,1],[2,1,1],[1,1,2],[1.5,.5,1,1],[1,1,.5,.5,1],[2,2],[1,2,1],[.5,.5,1,2]],BGM_KEYS=[0,2,5,7,9,-2,4];
const mf=m=>440*Math.pow(2,(m-69)/12);
let bgmSec=null,bgmBarN=0,bgmLast=76;
function bgmNewSection(){
  const keyI=Math.floor(Math.random()*BGM_KEYS.length);
  bgmSec={key:60+BGM_KEYS[keyI],prog:BGM_PROGS[Math.floor(Math.random()*BGM_PROGS.length)],beat:.55+Math.random()*.2,
    arp:Math.random()<.6,rest:Math.random()<.25,len:8};
  bgmBarN=0;
}
function bgmGenBar(){                                  // 4박자 한 마디의 소리들을 [시작박,높이(MIDI),길이박,세기] 로 만들어요
  if(!bgmSec||bgmBarN>=bgmSec.len)bgmNewSection();
  const s=bgmSec,root=s.prog[bgmBarN%4],minor=[2,4,9].indexOf(root)>=0,ev=[];
  const ct=[root,root+(minor?3:4),root+7].map(x=>s.key+x);              // 코드 구성음
  ev.push([0,ct[0]-24,3.6,.7]);ev.push([2,ct[2]-24,1.8,.4]);              // 낮은 베이스
  if(s.arp)[0,1,2,3].forEach(b=>ev.push([b+.5,ct[b%3]-12+(b===3?12:0),1.2,.22]));   // 잔잔한 펼친 화음
  const rest=s.rest&&bgmBarN%4===3;
  if(!rest){
    const pool=[];for(let o=-1;o<=1;o++)BGM_MAJ.forEach(d=>pool.push(s.key+12+d+12*o));
    const near=(m,list)=>list.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a);
    const tones=[];for(let o=0;o<=1;o++)ct.forEach(x=>tones.push(x+12*o+12));
    let b=0,rh=BGM_RHY[Math.floor(Math.random()*BGM_RHY.length)];
    rh.forEach(d=>{
      let m;
      if(b%2===0||Math.random()<.2)m=near(bgmLast+(Math.random()<.5?-2:2),tones);                 // 강박에서는 화음 소리
      else{const i=pool.indexOf(near(bgmLast,pool))+(Math.random()<.5?-1:1)*(Math.random()<.7?1:2);m=pool[Math.max(0,Math.min(pool.length-1,i))]}
      m=Math.max(67,Math.min(88,m));
      if(Math.random()<.12){b+=d;return}                                                           // 가끔 쉬어요
      ev.push([b,m,d*1.5+.5,.9]);bgmLast=m;b+=d;
    });
  }
  bgmBarN++;return ev;
}
let bgmNext=0,audioOk=false,bgmHint=null;
function unlockAudio(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);   // iOS: 첫 터치에서 소리 잠금 해제
    audioOk=true;
  }catch(e){}
  bgmTick();
}
function bgmNote(f,t,dur,vol){
  [[f,1],[f*2,.25]].forEach(([fr,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=fr;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*a,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05)});
}
function bgmTick(){
  try{
    const raid=!!rockActive(),on=bgmShould(new Date())||raid;
    if(!bgmHint){bgmHint=document.createElement('div');bgmHint.id='bgmhint';
      bgmHint.style.cssText='position:fixed;right:12px;bottom:12px;z-index:30;background:#fff8e1;border:2px solid #ffb300;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;display:none';
      bgmHint.textContent='🎵 화면을 한 번 눌러 주세요 (음악 켜짐)';document.body.appendChild(bgmHint)}
    bgmHint.style.display=(on&&!audioOk)?'block':'none';
    if(!on||raid||!audioOk||!AC){bgmNext=0;return}                  // 습격 중에는 로켓단 음악이 나와서 아침 음악은 쉬어요
    if(AC.state==='suspended')AC.resume();
    if(AC.state!=='running')return;
    const vol=Math.max(.02,Math.min(.5,+bgmCfg().vol||.1));
    if(bgmNext<AC.currentTime+.1)bgmNext=AC.currentTime+.3;
    while(bgmNext<AC.currentTime+2.5){                              // 2초 정도 앞서서 예약해요
      const bar=bgmGenBar(),beat=bgmSec.beat;
      bar.forEach(([st,m,d,v])=>bgmNote(mf(m),bgmNext+st*beat,d*beat,vol*v));
      bgmNext+=4*beat;
    }
  }catch(e){}
}

/* ---- 알 부화 규칙 ----
   1번째 알: 피카츄·꼬부기·파이리·이상해씨 중에서 고르기
   2~6번째 알: 진화 전 모습으로 랜덤 (형제끼리 같은 계보는 겹치지 않고, 최종 진화가 강한 계보만)
   7번째 알: 전설·환상의 포켓몬 (역시 겹치지 않아요) */
const STARTERS=[{id:25,sp:'pikachu',name:'피카츄',root:172},{id:7,sp:'squirtle',name:'꼬부기',root:7},{id:4,sp:'charmander',name:'파이리',root:4},{id:1,sp:'bulbasaur',name:'이상해씨',root:1}];
const LEGENDS=[144,145,146,150,151,243,244,245,249,250,251,377,378,379,380,381,382,383,384,385,386,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,719,720,721,785,786,787,788,789,790,791,792,800,801,802,807,808,809,888,889,890,891,892,893,894,895,896,897,898,1001,1002,1003,1004,1007,1008,1014,1015,1016,1017,1024,1025];
const MIN_BST=480;                                   // 최종 진화 모습의 종족값 합이 이 이상인 계보만 "괜찮은 포켓몬"으로 봐요
const bstCache={},typeCache={};
async function rootOf(id){let sp=await jget(API+'pokemon-species/'+id);while(sp.evolves_from_species)sp=await jget(sp.evolves_from_species.url);return sp.id}
async function takenRoots(){                         // 모든 아이가 이미 가진 계보(첫 모습 번호)
  const set={};
  for(const q of S.kids)for(const m of q.mons){
    if(!m.root){try{m.root=await rootOf(m.id)}catch(e){m.root=m.id}}
    set[m.root]=1;
  }
  return set;
}
async function bstOf(id){
  if(bstCache[id])return bstCache[id];
  const p=await jget(API+'pokemon/'+id);
  typeCache[id]=p.types.map(t=>t.type.name);
  return bstCache[id]=p.stats.reduce((x,y)=>x+y.base_stat,0);
}
async function lineStrong(root){                      // 계보의 최종 진화들 중 가장 강한 종족값 합
  const sp=await jget(API+'pokemon-species/'+root),ch=await jget(sp.evolution_chain.url);
  const finals=[];(function walk(n){if(!n.evolves_to.length)finals.push(idFrom(n.species.url));n.evolves_to.forEach(walk)})(ch.chain);
  let best=0;for(const id of finals){try{best=Math.max(best,await bstOf(id))}catch(e){}}
  return best>=MIN_BST;
}
async function candidate(id,taken,needLegend,needStrong){        // 후보 하나를 검사해서 쓸 수 있으면 포켓몬 정보를, 아니면 null
  try{
    let sp=await jget(API+'pokemon-species/'+id);
    const isL=sp.is_legendary||sp.is_mythical;
    if(needLegend!==isL)return null;
    while(sp.evolves_from_species)sp=await jget(sp.evolves_from_species.url);
    if(taken[sp.id])return null;
    if(!needLegend&&needStrong&&!(await lineStrong(sp.id)))return null;
    return {id:sp.id,sp:sp.name,name:koName(sp),root:sp.id,legend:!!needLegend};
  }catch(e){return null}
}
async function ownRoots(k){                            // 이 아이가 이미 가진 계보
  const set={};
  for(const m of k.mons){if(!m.root){try{m.root=await rootOf(m.id)}catch(e){m.root=m.id}}set[m.root]=1}
  return set;
}
// 1순위: 형제들이 아무도 안 가진 새 포켓몬 → 다 떨어지면 2순위: 이 아이만 아직 없는 것 (아이들 모두 도감 전체를 채울 수 있게)
async function rollWith(pickId,needLegend,k){
  const tiers=k.adult?(needLegend?[[await ownRoots(k),true,40]]:[[await ownRoots(k),true,30],[await ownRoots(k),false,60]])     // 엄마·아빠: 처음부터 랜덤 (아이들 것과 겹쳐도 돼요)
    :needLegend?[[await takenRoots(),true,14],[await ownRoots(k),true,40]]
    :[[await takenRoots(),true,14],[await ownRoots(k),true,30],[await ownRoots(k),false,60]];
  for(const [taken,strong,rounds] of tiers){
    for(let round=0;round<rounds;round++){
      const ids=[pickId(),pickId(),pickId(),pickId()];   // 4개씩 동시에 확인해서 빨리 찾아요
      const ok=(await Promise.all(ids.map(i=>candidate(i,taken,needLegend,strong)))).filter(Boolean);
      if(ok.length)return ok[Math.floor(Math.random()*ok.length)];
    }
  }
  return null;
}
async function rollEgg(k){                            // 2~6번째 알
  const total=await speciesCount();
  const p=await rollWith(()=>1+Math.floor(Math.random()*total),false,k);
  if(!p)throw new Error('roll');
  return p;
}
async function rollLegend(k){                         // 7번째 알: 전설·환상 (찾지 못하면 일반 포켓몬)
  const p=await rollWith(()=>LEGENDS[Math.floor(Math.random()*LEGENDS.length)],true,k);
  return p||await rollEgg(k);
}

// 예비: 노르웨이 기상청(MET Norway). Open-Meteo 가 안 열리는 오래된 기기를 위해서예요 (미세먼지는 없어요)

const VCUT={};
function vCut(im){
  try{
    if(!im||im.dataset.cut||!im.naturalWidth)return;im.dataset.cut='1';
    const src=im.getAttribute('data-u')||im.src;
    if(VCUT[src]){if(VCUT[src]!=='x'){im.src=VCUT[src];im.className+=' cut'}else im.className+=' nocut';return}
    // 화면에 보이는 그림은 그대로 두고, 배경 지우기용 사본을 따로(보안 요청+주소 바꿔서) 불러와요. 사본이 실패해도 그림은 보여요(아이폰 사파리 대응)
    const o=new Image();o.crossOrigin='anonymous';
    o.onerror=()=>{VCUT[src]='x';im.className+=' nocut'};
    o.onload=()=>vCutRun(im,o,src);
    o.src=src+'?c=1';
  }catch(e){try{im.dataset.cut='1';im.className+=' nocut'}catch(e2){}}
}
function vCutRun(im,o,src){
  try{
    const W=o.naturalWidth,H=o.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d');x.drawImage(o,0,0);
    const d=x.getImageData(0,0,W,H),p=d.data,N=W*H;
    // 배경색: 가장자리 한 줄의 가장 흔한 색
    const bins={};let bk='',bc=0,tot=0;
    const addB=(i)=>{const k=(p[i*4]>>4)+','+(p[i*4+1]>>4)+','+(p[i*4+2]>>4);bins[k]=(bins[k]||0)+1;tot++;if(bins[k]>bc){bc=bins[k];bk=k}};
    for(let i=0;i<W;i++){addB(i);addB((H-1)*W+i)}for(let j=0;j<H;j++){addB(j*W);addB(j*W+W-1)}
    if(p[3]<20){VCUT[src]='x';return}                         // 이미 투명한 그림이면 그대로
    if(bc/tot<0.55){VCUT[src]='x';im.className+=' nocut';return}  // 가장자리가 한 색이 아니면(배경 그림) 안 지워요
    let r=0,g=0,b=0,n=0;for(let i=0;i<W;i++){for(const q of [i,(H-1)*W+i]){if((p[q*4]>>4)+','+(p[q*4+1]>>4)+','+(p[q*4+2]>>4)===bk){r+=p[q*4];g+=p[q*4+1];b+=p[q*4+2];n++}}}
    for(let j=0;j<H;j++){for(const q of [j*W,j*W+W-1]){if((p[q*4]>>4)+','+(p[q*4+1]>>4)+','+(p[q*4+2]>>4)===bk){r+=p[q*4];g+=p[q*4+1];b+=p[q*4+2];n++}}}
    r/=n;g/=n;b/=n;
    const T=44,T2=T*T,near=i=>{const a=p[i*4]-r,e=p[i*4+1]-g,f=p[i*4+2]-b;return a*a+e*e+f*f<T2};
    const seen=new Uint8Array(N),q=new Int32Array(N);let h=0,t=0;
    const push=i=>{if(!seen[i]&&near(i)){seen[i]=1;q[t++]=i}};
    for(let i=0;i<W;i++){push(i);push((H-1)*W+i)}for(let j=0;j<H;j++){push(j*W);push(j*W+W-1)}
    while(h<t){const i=q[h++],cx=i%W;if(cx>0)push(i-1);if(cx<W-1)push(i+1);if(i>=W)push(i-W);if(i<N-W)push(i+W)}
    if(t<N*0.12||t>N*0.9){VCUT[src]='x';im.className+=' nocut';return}   // 너무 적게/많이 지워지면 포기
    // 가장자리 부드럽게
    let x0=W,y0=H,x1=0,y1=0;
    for(let i=0;i<N;i++){
      if(seen[i]){p[i*4+3]=0;continue}
      const cx=i%W,cy=(i-cx)/W;

      if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy;
    }
    if(x1<=x0||y1<=y0){VCUT[src]='x';return}
    x.putImageData(d,0,0);
    const c2=document.createElement('canvas');c2.width=x1-x0+1;c2.height=y1-y0+1;c2.getContext('2d').drawImage(c,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
    const url=c2.toDataURL('image/png');
    const chk=new Image();chk.onload=()=>{if(chk.naturalWidth>1){VCUT[src]=url;im.src=url;im.className+=' cut'}else{VCUT[src]='x';im.className+=' nocut'}};
    chk.onerror=()=>{VCUT[src]='x';im.className+=' nocut'};chk.src=url;     // 지운 그림이 정말 그려지는지 확인한 뒤에만 바꿔요
  }catch(e){VCUT[src]='x';try{im.className+=' nocut'}catch(e2){}}
}

const MSTAGE_H=250;
const MROUTE_TH=[
  {n:'🌲 숲속 길',bg:'#cfeedd,#a9d8ab',road:'#a1887f',deco:['🌲','🌳','🌲','🍄','🌳']},
  {n:'🌷 꽃밭 길',bg:'#cdeafc,#dff3c8',road:'#c9ab7c',deco:['🌷','🌼','🦋','☁️','🌸']},

const mHash=x=>String(x).split('').reduce((a,c)=>(a*31+c.charCodeAt(0))%1000003,7);
function mornRoute(seed){
  const rd=i=>((Math.sin(seed*12.9898+i*78.233)*43758.5453)%1+1)%1;
  const type=seed%5,th=MROUTE_TH[Math.floor(rd(9)*4)%4],ph=rd(1)*6.283,ph2=rd(2)*6.283,cc=.35+rd(3)*.3,fq=1+rd(4)*.8,T=6.283;
  const f=t=>{let v;
    if(type===0)v=.5+.38*Math.sin(T*fq*t+ph);                                            // 물결 길
    else if(type===1)v=.5+.30*Math.sin(T*1.5*t+ph)+.12*Math.sin(T*3*t+ph2);              // 이리저리 굽은 길
    else if(type===2)v=.82-.62*Math.exp(-Math.pow((t-cc)/.2,2))+.08*Math.sin(T*3*t+ph);   // 언덕을 넘는 길
    else if(type===3)v=.2+.62*Math.exp(-Math.pow((t-cc)/.2,2))+.08*Math.sin(T*3*t+ph);    // 골짜기로 내려가는 길
    else v=.5+.4*(2/Math.PI)*Math.asin(Math.sin(T*2*t+ph));                              // 지그재그 길
    return Math.max(.04,Math.min(.96,v))};
  const at=t=>{t=Math.max(0,Math.min(1,t));const y=+(135+f(t)*95).toFixed(1);return {x:+(6+86*t).toFixed(2),y,b:Math.round(MSTAGE_H-y-4)}};
  const pts=[];for(let i=0;i<=60;i++){const q=at(i/60);pts.push(q.x+','+q.y)}
  const deco=th.deco.map((e,i)=>({e,x:+(3+i*19+rd(20+i)*8).toFixed(1),y:Math.round(6+rd(30+i)*48),s:Math.round(28+rd(40+i)*18)}));
  return {at,th,type,pts:pts.join(' '),deco};
}
const mornSeed=r=>(r&&r.seed)||mHash((r&&r.day)||today());
function mornCalc(){                                     // 화면에 그릴 값 (시간·단계 → 길 위의 위치)
  const c=morningCfg(),r=S.mrun,st=mornSteps(),n=st.length,dn=(r.done||[]).filter(i=>i<n).length,lv=leaveAt(),now=r.fin||Date.now();
  const ft=Math.max(0,Math.min(1,(now-r.start)/Math.max(lv-r.start,60000))),sf=n?dn/n:1;
  const R=mornRoute(mornSeed(r)),tr=0.5+0.08*ft;                // 로켓단은 시간이 갈수록 조금씩 멀어져요
  const tk=r.fin?Math.max(0,tr-0.15):0.02+(tr-0.24-0.02)*sf;      // 단계를 끝낼수록 서비가 가까워져요 → 다 하면 구출!
  const K=R.at(tk),X=R.at(tr);
  const behind=!r.fin&&ft>.2&&ft>sf+.25,rem=lv-Date.now(),pn=mornMon(r).n;
  const bub=r.fin?(r.ok?'🎉 구출 성공! 이제 학교 가자!':'😅 늦었지만 구했어요!'):rem<=0?'⏰ 출발 시간이에요!':behind?'😰 서둘러요! 로켓단이 멀어져요!':dn===0?'🚀 로켓단이 '+pn+'를 데려갔어!':'💪 조금만 더! 가까워졌어요!';
  const timer=r.fin?(r.ok?`${Math.max(1,Math.round((lv-r.fin)/60000))}분 일찍 끝!`:'준비 끝!'):rem>0?(rem>=600000?`${Math.ceil(rem/60000)}분 남았어요`:`${Math.floor(rem/60000)}분 ${pad(Math.floor(rem%60000/1000))}초`):'⏰ 지금 출발해요!';
  return {c,n,dn,kx:K.x,ky:K.b,rx:X.x,ry:X.b,R,behind,bub,timer,free:!!r.fin,over:rem<=0&&!r.fin};
}

function compress(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const M=520,s=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    im.src=u;
  });
}

function purgeUsedPhotos(){

function skyKind(day){
  if(!W)return 'winter';
  const SNOW=c=>(c>=71&&c<=77)||c===85||c===86,RAIN=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
  const hrs=day?(W.tom||[]):W.hours.slice(new Date().getHours());
  let snow=!day&&SNOW(W.c),rain=!day&&RAIN(W.c);
  hrs.forEach(h=>{if(!h)return;const p=h.p||0;if(SNOW(h.c)&&p>=40)snow=true;if(RAIN(h.c)&&p>=50)rain=true});
  return snow?'snow':rain?'rain':'winter';
}

/* ---- ☁️ 기기 연결(동기화): GitHub 비공개 저장소에 설정을 저장하고 모든 기기가 읽어요 ---- */
const GHAPI=(()=>{try{return localStorage.getItem('pkgh')||'https://api.github.com'}catch(e){return 'https://api.github.com'}})();
let syncing=false,syncTimer=null,lastCfgHash='',syncState={st:'off',msg:'',at:null};
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));
// 부모가 정하는 설정 (아이 기록은 아래 progress.json 으로 따로 맞춰요)
function cfgOf(){
  return {pin:S.pin,lat:S.lat,lon:S.lon,notices:S.notices,events:S.events,menu:S.menu,todoText:S.todoText,shopping:S.shopping,checklist:S.checklist,
    people:S.people,eggCost:S.eggCost,evoCost:S.evoCost,bonus:S.bonus,legend:S.legend,shift:S.shift,shiftOv:S.shiftOv,autoPurge:S.autoPurge,bgm:S.bgm,dim:S.dim,morning:S.morning,bdayCfg:S.bdayCfg,family:S.family,drawCfg:S.drawCfg,rocketCfg:S.rocketCfg,
    kids:S.kids.map(k=>({name:k.name,chores:k.chores,birthday:k.birthday,color:k.color,face:k.face||''})),closet:S.closet,outfit:S.outfit};
}
const cfgHash=()=>JSON.stringify(cfgOf());
lastCfgHash=cfgHash();
function applyCfg(c){
  ['pin','lat','lon','notices','events','menu','todoText','shopping','checklist','people','eggCost','evoCost','bonus','legend','closet','outfit','shift','shiftOv','autoPurge','bgm','dim','morning','bdayCfg','family','drawCfg','rocketCfg'].forEach(k=>{if(c[k]!==undefined)S[k]=c[k]});
  if(Array.isArray(c.kids)){
    c.kids.forEach((kc,i)=>{
      let k=S.kids[i];
      if(!k){k=newKid(kc.name,[],TR_DEFAULT[i%3]);S.kids.push(k);fixKid(k,i)}
      k.name=kc.name;k.chores=kc.chores||[];k.birthday=kc.birthday||'';if(kc.color)k.color=kc.color;if(kc.face!==undefined)k.face=kc.face;
    });
    if(S.kids.length>c.kids.length)S.kids.length=c.kids.length;
    if(kid>=S.kids.length)kid=0;
  }
}
// 덮어쓰기 전에 이 기기의 이전 설정을 자동으로 보관해요 (최근 5개)
function snapsGet(){try{return JSON.parse(localStorage.getItem('pkfam3_snaps'))||[]}catch(e){return []}}
function saveSnap(label){try{const a=snapsGet();a.unshift({at:Date.now(),label,cfg:cfgOf()});localStorage.setItem('pkfam3_snaps',JSON.stringify(a.slice(0,5)))}catch(e){}}
function setSync(st,msg){syncState={st,msg:msg||'',at:st==='ok'?new Date():syncState.at};paintCloud()}
function paintCloud(){
  const el=document.getElementById('cloud');if(!el)return;
  if(!(S.sync&&S.sync.on)){el.style.display='none';return}
  el.style.display='inline-block';
  el.textContent=syncState.st==='ok'?'☁️':syncState.st==='busy'?'🔄':'⚠️';
  el.title=syncState.msg||'';
}
function ghReq(method,path,body){
  const sc=S.sync||{};
  return fetch(`${GHAPI}/repos/${sc.repo}/contents/${path}${method==='GET'?`?t=${Date.now()}`:''}`,{
    method,cache:'no-store',
    headers:Object.assign({'Authorization':'Bearer '+sc.token,'Accept':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined});
}
function ghMsg(status){
  return status===401?'접속 키가 올바르지 않거나 만료됐어요':status===403?'이 키로는 저장소를 읽고 쓸 수 없어요 (키 권한을 확인해 주세요)':status===404?'저장소를 찾을 수 없어요 (이름과 키의 저장소 선택을 확인해 주세요)':status===409||status===422?'다른 기기가 방금 고쳤어요. 잠시 후 다시 맞춰요':`연결 오류 (${status})`;
}
async function pushPhotos(){
  const sc=S.sync;sc.sent=sc.sent||{};
  for(const c of photoIds()){
    if(sc.sent[c.id]||!IMG.mem[c.id])continue;
    const r=await ghReq('PUT',`photos/${c.id}.jpg`,{message:'photo',content:IMG.mem[c.id].split(',')[1]});
    if(r.ok||r.status===422)sc.sent[c.id]=true;else throw new Error(ghMsg(r.status));
  }
}
async function pullPhotos(){
  const sc=S.sync;sc.sent=sc.sent||{};let n=0,got=0;
  for(const c of photoIds()){
    if(IMG.mem[c.id])continue;
    if(n++>=12)break;                                   // 한 번에 너무 많이 받지 않고 나눠서 받아요
    try{const r=await ghReq('GET',`photos/${c.id}.jpg`);
      if(r.ok){const j=await r.json();await IMG.put(c.id,'data:image/jpeg;base64,'+String(j.content).replace(/\s/g,''));sc.sent[c.id]=true;got++}}catch(e){}
  }
  return got;
}
/* ---- 아이 기록(코인·포켓몬·할 일 체크 등) 기기 간 동기화: 아이별로 "나중에 바뀐 쪽"이 이겨요 ---- */
const PF=['coins','mons','sel','dex','evos','earned','streak','best','perfect','bought','hist','badges','lastPerfect','bonusDate','bonusAmt','done','hatched','trainer','prev','deco','out','bw','bl','bday','bn','freeEgg','tix','fday','fn','stolen','rday','rn','gf','wp','dg','sdoor','vil','cc','cb'];
const progOf=k=>{const o={};PF.forEach(f=>{if(k[f]!==undefined)o[f]=k[f]});return o};
function sweepTodo(){                                       // 오늘이 아닌 날 체크된 할 일은 지워요
  let n=0;Object.keys(S.todoDone).forEach(x=>{const v=S.todoDone[x];if(x.indexOf('__ck|')!==0&&typeof v==='string'&&v!==today()){delete S.todoDone[x];n++}});return n}
const progG=()=>({todoDone:S.todoDone,thanks:S.thanks,mrun:S.mrun||null,draw:S.drawBoard||null,trades:S.trades||[],rocket:S.rocket||null,bday:S.bdayDone||null});
let lastPH=[],lastPP=[],lastGH='';
function progMark(init){                                  // 바뀐 아이가 있으면 시각을 새로 찍어요
  let dirty=false;
  [[S.kids,lastPH],[S.parents,lastPP]].forEach(([L,LH])=>L.forEach((k,i)=>{const h=JSON.stringify(progOf(k));if(LH[i]!==h){LH[i]=h;if(!init){k.pts=Date.now();dirty=true}}}));
  const g=JSON.stringify(progG());if(lastGH!==g){lastGH=g;if(!init){S.gpts=Date.now();dirty=true}}
  return dirty;
}
progMark(true);
/* 엄마·아빠 매일 용돈: 엄마 50코인 · 아빠 20코인 (하루에 한 번, 어느 기기가 먼저 열어도 한 번만) */
const ALLOW=[50,20];
function allowanceApply(){
  let ch=false;S.parents.forEach((q,i)=>{const v=ALLOW[i]||0;if(v&&q.dg!==today()){q.dg=today();q.coins+=v;ch=true}});
  return ch;
}
const progScore=d=>(+d.earned||0)+100*(+d.hatched||0)+10*Object.keys(d.hist||{}).length+Object.keys(d.dex||{}).length;
async function syncProgress(){
  const r=await ghReq('GET','progress.json');
  let remote=null,sha=null;
  if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
  else if(r.status!==404)throw new Error(ghMsg(r.status));
  const rk=(remote&&remote.kids)||[],rp=(remote&&remote.parents)||[],rg=(remote&&remote.g)||null,now=Date.now();
  let push=!remote,pulled=false;
  [[S.kids,rk,lastPH,''],[S.parents,rp,lastPP,'p']].forEach(([L,R,LH,tg])=>L.forEach((k,i)=>{
    const x=R[i],lp=k.pts||0;
    if(x&&x.pts>lp){
      if(busy)return;
      if(lp===0&&progScore(progOf(k))>progScore(x.d)){k.pts=now;push=true;return}   // 처음 연결한 기기에 기록이 더 많으면(예: 며칠 쓴 패드) 그 기록을 지키고 올려요
      try{const bk=JSON.parse(localStorage.getItem('pkfam3_progsnap'))||{};bk[tg+i]={at:now,d:progOf(k)};localStorage.setItem('pkfam3_progsnap',JSON.stringify(bk))}catch(e){}   // 덮어쓰기 전 보관
      Object.assign(k,JSON.parse(JSON.stringify(x.d)));k.pts=x.pts;fixKid(k,i);LH[i]=JSON.stringify(progOf(k));pulled=true;
    }else if(!x&&lp===0){k.pts=now;push=true}
    else if(lp>(x?x.pts:0))push=true;
  }));
  if(rg&&rg.pts>(S.gpts||0)){
    if(!busy){S.todoDone=JSON.parse(JSON.stringify(rg.d.todoDone||{}));S.thanks=JSON.parse(JSON.stringify(rg.d.thanks||{}));S.mrun=rg.d.mrun?JSON.parse(JSON.stringify(rg.d.mrun)):null;S.drawBoard=rg.d.draw?JSON.parse(JSON.stringify(rg.d.draw)):null;S.trades=rg.d.trades?JSON.parse(JSON.stringify(rg.d.trades)):[];S.rocket=rg.d.rocket?JSON.parse(JSON.stringify(rg.d.rocket)):null;S.bdayDone=rg.d.bday?JSON.parse(JSON.stringify(rg.d.bday)):null;S.gpts=rg.pts;lastGH=JSON.stringify(progG());pulled=true;if(sweepTodo()){S.gpts=now;lastGH=JSON.stringify(progG());push=true}}
  }else if(!rg&&!(S.gpts)){S.gpts=now;push=true}
  else if((S.gpts||0)>(rg?rg.pts:0))push=true;
  const upToDate=S.parents.every((q,i)=>!rp[i]||(q.pts||0)>=rp[i].pts);          // 클라우드의 엄마·아빠 기록을 아직 못 받았으면(예: 입력 중이라 미룬 경우) 용돈을 주지 않아요
  if(upToDate&&allowanceApply()){progMark();push=true;pulled=true}      // 클라우드 기록을 받은 뒤에 용돈을 줘요 (옛 기록으로 두 번 주는 것 방지)
  if(pulled){try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}render()}
  if(push){
    const mk=(L,R)=>L.map((k,i)=>{const x=R[i];return (x&&x.pts>=(k.pts||0))?x:{pts:k.pts||0,d:progOf(k)}}),kids=mk(S.kids,rk),parents=mk(S.parents,rp);
    const g=(rg&&rg.pts>=(S.gpts||0))?rg:{pts:S.gpts||0,d:progG()};
    const body={message:'progress',content:b64e(JSON.stringify({kids,parents,g}))};
    if(sha)body.sha=sha;
    const w=await ghReq('PUT','progress.json',body);
    if(!w.ok&&w.status!==409&&w.status!==422)throw new Error(ghMsg(w.status));
    try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}
  }
}
async function syncNow(){
  const sc=S.sync;
  if(!sc||!sc.on||!sc.token||!sc.repo||syncing)return;
  if(tab==='set'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;   // 입력 중에는 잠시 미뤄요
  syncing=true;setSync('busy');
  try{
    const r=await ghReq('GET','data.json');
    let remote=null,sha=null;
    if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
    else if(r.status!==404)throw new Error(ghMsg(r.status));
    const mine=S.cfgTs||0;
    const ro=!!sc.ro;                                        // 보기 전용(거실 대시보드): 받아오기만 하고 올리지 않아요
    if(remote&&(remote.ts>mine||(ro&&(remote.ts!==mine||cfgHash()!==lastCfgHash)))){   // 다른 기기에서 고친 내용이 더 최신 → 받아오기
      if(mine===0||cfgHash()!==lastCfgHash)saveSnap('클라우드에서 받기 전');
      applyCfg(remote.cfg);S.cfgTs=remote.ts;lastCfgHash=cfgHash();
      try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}
      render();
    }else if(!ro&&(!remote||cfgHash()!==lastCfgHash||mine>remote.ts)){ // 이 기기가 더 최신 → 올리기
      if(!S.cfgTs)S.cfgTs=Date.now();
      await pushPhotos();
      const body={message:'update',content:b64e(JSON.stringify({ts:S.cfgTs,cfg:cfgOf()}))};
      if(sha)body.sha=sha;
      const w=await ghReq('PUT','data.json',body);
      if(!w.ok)throw new Error(ghMsg(w.status));
      lastCfgHash=cfgHash();
      try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}
    }
    await syncProgress();
    if(await pullPhotos()>0)render();
    if(!sc.ro){if(runPurge())render();await purgeRemote()}else gcPhotos();
    setSync('ok','마지막으로 맞춘 시각 '+apText(new Date())+' '+clockText(new Date()));
  }catch(e){setSync('err',e.message||'연결 오류')}
  syncing=false;
  if(tab==='set')render();
}
async function connectSync(repo,token,ro){
  const hdr={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  let r;
  try{r=await fetch(`${GHAPI}/repos/${repo}?t=${Date.now()}`,{headers:hdr,cache:'no-store'})}catch(e){toast('인터넷 연결을 확인해 주세요');return}

  S.sync={repo,token,on:true,sent:{},ro:!!ro};

  }else{S.cfgTs=ro?0:Date.now();if(ro)toast('아직 저장된 설정이 없어요. 폰에서 먼저 연결해 주세요',3500)}

}

/* ---- 교대 근무표 (예: 4조 2교대) ---- */
const SH={D:['☀️','주간 근무','#fb8c00'],N:['🌙','야간 근무','#3949ab'],O:['🏠','쉬는 날','#2e7d32']};
function shNorm(tok){
  const t=String(tok).trim().toLowerCase();
  if(/^(d|day|주|주간|데이)$/.test(t))return 'D';
  if(/^(n|night|야|야간|나이트)$/.test(t))return 'N';
  if(/^(o|off|휴|휴무|쉼|쉬는날)$/.test(t))return 'O';
  return null;
}
const shSeq=()=>String((S.shift||{}).seq||'').split(/[\s,/·]+/).map(shNorm).filter(Boolean);
// 그날의 근무: {t:'D'|'N'|'O', base(원래 근무), sub(대근), vac(연차)}
function shiftOf(ds){
  const sh=S.shift;if(!sh||!sh.on||!sh.anchor)return null;
  const seq=shSeq();if(!seq.length)return null;
  const [y,m,d]=ds.split('-').map(Number),[ay,am,ad]=sh.anchor.split('-').map(Number);
  if(!ay)return null;
  const n=dayNum(y,m,d)-dayNum(ay,am,ad),L=seq.length,base=seq[((n%L)+L)%L],ov=(S.shiftOv||{})[ds];
  if(ov)return {t:ov.t,base,sub:!!ov.sub,vac:!!ov.vac};
  return {t:base,base,sub:false,vac:false};
}
function shView(x){                                  // 화면에 보일 모양 [이모지, 글자, 색]
  if(x.vac)return ['🏖','연차 · 쉬는 날','#00838f'];
  if(x.sub)return [SH[x.t][0],'대근 · '+(x.t==='D'?'주간':'야간'),SH[x.t][2]];
  return SH[x.t];
}
const shOff=x=>x.t==='O';
function shMark(ds){
  const x=shiftOf(ds);if(!x||x.t==='O')return '';
  return `<span class="sh1">${SH[x.t][0]}${x.sub?'🔄':''}</span>`;
}
function shiftCard(){
  const sh=S.shift;if(!sh||!sh.on||!shSeq().length)return '';
  const box=(n,lab)=>{
    const d=addDays(n),x=shiftOf(dstr(d));if(!x)return '';
    const v=shView(x);
    return `<div class="shb" style="border-color:${v[2]}"><small>${lab} ${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})</small><div class="shi">${v[0]}</div><b style="color:${v[2]}">${v[1]}</b>${x.sub?'<span class="subt">🔄 대근이에요</span>':''}</div>`;
  };
  let strip='',nextOff=null;
  for(let i=0;i<7;i++){const d=addDays(i),x=shiftOf(dstr(d));
    strip+=`<div class="ss ${i===0?'now':''}"><small>${WD[d.getDay()]}</small><span>${x.vac?'🏖':SH[x.t][0]}${x.sub?'<i>🔄</i>':''}</span></div>`}
  for(let i=0;i<40&&!nextOff;i++){const d=addDays(i),x=shiftOf(dstr(d));if(x&&shOff(x))nextOff={i,d}}
  const off=nextOff?(nextOff.i===0?'오늘은 쉬는 날이에요! 🎉':nextOff.i===1?'내일은 쉬는 날이에요! 🎉':`다음 쉬는 날은 ${nextOff.d.getMonth()+1}/${nextOff.d.getDate()} (${WD[nextOff.d.getDay()]})`):'';
  return `<div class="sec"><div class="sh" style="--c:#3949ab;color:#283593">👨 ${esc(sh.name||'아빠')} 근무</div>

let rkm=null,rkmNb=null;

const RKM_LEAD=[                                                     // 4마디 돌아가며: 16칸(16분음표)마다 MIDI 음 또는 null (A단조 느낌)

function rkmStep(m,t,n,bar,p,ko,vol,sd){

  }
  if(n%2===0||p>.5){                                                 // 치치치 (시간이 갈수록 촘촘하게)

}
function rkmTick(a){                                                 // a = 지금 진행 중인 습격 (없으면 null). 반환: 음악이 나오고 있으면 true

/* ---------- 부모 PIN ---------- */
function unlocked(){return Date.now()<unlockUntil}
function askPin(){
  if(unlocked())return true;
  const v=prompt('부모 PIN을 입력하세요');
  if(v!==null&&v===String(S.pin)){unlockUntil=Date.now()+5*60000;return true}
  if(v!==null)toast('PIN이 달라요');
  return false;
}

/* ---------- 이벤트 ---------- */
function recordDay(k){
  const d=k.done[today()]||[];
  let c=d.reduce((a,i)=>a+(k.chores[i]?k.chores[i].c:0),0);
  if(k.bonusDate===today())c+=k.bonusAmt;
  k.hist[today()]={n:d.length,t:k.chores.length,c,m:d.map(i=>k.chores[i]?k.chores[i].t:'')};
}
let idle;function bump(){clearTimeout(idle);idle=setTimeout(()=>{if(tab==='home'&&calOff&&!busy){calOff=0;render()}if(tab!=='home'&&!editMode&&!busy&&!document.getElementById('ov').classList.contains('show')&&!(tab==='set'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){tab='home';render()}},IDLE_MS)}
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();syncNow()}});
(function(){const b=document.getElementById('fs'),d=document.documentElement;
  if(!d.requestFullscreen){b.style.display='none';return} // 아이패드 Safari는 미지원 → 홈 화면에 추가해서 전체화면으로 사용
  b.onclick=()=>{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().catch(()=>{})}})();

document.addEventListener('click',async e=>{
  bump();wake();
  if(e.target.id==='ov'){closeOv();return}
  const t=e.target.closest('button,[data-sel],[data-bx],[data-gokid],[data-gotab],[data-pick],[data-zoom],[data-tov],[data-famimg]');if(!t||t.id==='fs')return;
  if(t.id==='dimbtn'){dimManual=true;dimTick();return}
  if(t.id==='mute'){S.mute=!S.mute;save();render();return}
  if(t.id==='gohome'){tab='home';editMode=false;render();window.scrollTo(0,0);return}   // 어디서든 한 번에 홈으로
  const k=K();
  if(t.dataset.tab){const n=t.dataset.tab;if(n==='set'&&!askPin())return;tab=n;editMode=false}
  else if(t.dataset.gokid!==undefined){kid=+t.dataset.gokid;tab='todo'}
  else if(t.dataset.kid!==undefined){kid=+t.dataset.kid;boxSel={};boxMode=false}
  else if(t.dataset.chore!==undefined){choreToggle(k,+t.dataset.chore)}
  else if(/^m(start|practice|step|fin|reset)$/.test(t.dataset.act||'')){mornAct(t.dataset.act,t)}
  else if(t.dataset.bx!==undefined){const i=+t.dataset.bx;if(boxSel[i])delete boxSel[i];else boxSel[i]=1;render();return}
  else if(t.dataset.act==='bxmode'){boxMode=!boxMode;boxSel={};render();return}
  else if(t.dataset.act==='bxclear'){boxSel={};render();return}
  else if(t.dataset.act==='bxopen'){boxOpen=!boxOpen;render();return}
  else if(t.dataset.act==='bxput'||t.dataset.act==='bxout'){
    const put=t.dataset.act==='bxput';let n=0;
    Object.keys(boxSel).forEach(i=>{const m=k.mons[+i];if(m){if(put)m.box=true;else delete m.box;n++}});
    boxSel={};if(n)toast(put?`📦 ${n}마리를 보관함에 넣었어요`:`🌳 ${n}마리를 마을로 꺼냈어요`);
    if(put)boxOpen=true}
  else if(t.dataset.sel!==undefined){k.sel=+t.dataset.sel}
  else if(t.dataset.act==='egg'&&(k.coins>=S.eggCost||k.freeEgg>0)&&!busy){
    if(k.hatched===0&&!k.adult){await openStarter(k);return}      // 첫 알은 4마리 중에서 골라요
    await hatchEgg(k,t);
  }
  else if(t.dataset.starter){await hatchStarter(k,+t.dataset.starter)}
  else if(t.dataset.act==='train'){const m=k.mons[k.sel];if(m&&(m.lv||0)<MAX_LV&&k.coins>=trainCost(m)){k.coins-=trainCost(m);m.lv=(m.lv||0)+1;sfx('evo');toast(`💪 훈련 성공! ${m.name} Lv.${m.lv} ⚡${powerOf(m)}`)}}
  else if(t.dataset.act==='wild'){wildBattle(k);return}
  else if(t.dataset.act==='bdayclose'){const r=bdayRun();if(r)bdayStop(r.name);return}
  else if(t.dataset.act==='bdaytest'){const q=S.kids[+t.dataset.i];if(q){const o=bdLoad();delete o.done[q.name];o.run=null;bdSave(o);unlockAudio();bdayStart(q);tab='home'}}
  else if(t.dataset.draw!==undefined){drawConfirm(k,+t.dataset.draw);return}
  else if(t.dataset.act==='drawgo'){drawGo(k,+t.dataset.i)}
  else if(t.dataset.act==='drawpaid'){if(!askPin())return;const tb=S.drawBoard&&S.drawBoard.tabs[+t.dataset.i];if(tb){tb.paid=true;S.drawBoard=Object.assign({},S.drawBoard)}}
  else if(t.dataset.act==='dpadd'){const c=drawCfg();S.drawCfg=Object.assign(c,{items:c.items.concat([{n:'새 상품',c:1}])})}
  else if(t.dataset.act==='dpdel'){const c=drawCfg();S.drawCfg=Object.assign(c,{items:c.items.filter((_,j)=>j!==+t.dataset.i)})}
  else if(t.dataset.act==='drawnew'){if(confirm('새 판을 깔면 지금 판은 사라져요. 계속할까요?')){drawBuild();toast('🎟 새 뽑기판을 깔았어요!')}}
  else if(t.dataset.rkblock!==undefined){
    const r=rockActive();if(!r)return;const n=r.targets[+t.dataset.rkblock];if(!n||(r.done||{})[n])return;
    rkTap[n]=(rkTap[n]||0)+1;sfx('coin');
    const bar=document.getElementById('rkb'+t.dataset.rkblock);if(bar)bar.style.width=Math.min(100,Math.round(rkTap[n]/RK_TAPS*100))+'%';
    if(rkTap[n]>=RK_TAPS)rockBlock(n);
    return}
  else if(t.dataset.act==='rkrescue'){rockRescue(k,+t.dataset.i);return}
  else if(t.dataset.act==='rkransom'){rockRansom(k,+t.dataset.i)}
  else if(t.dataset.act==='rkpractice'){const t0=Date.now();rkTap={};S.rocket={day:today(),start:t0,dl:t0+3*60000,targets:rkTargets(),done:{},blocked:{},practice:true};tab='home';unlockAudio()}
  else if(t.dataset.act==='tradesend'){tradeSend(k)}
  else if(t.dataset.act==='tradeok'){tradeAccept(k,t.dataset.id)}
  else if(t.dataset.act==='tradeno'){S.trades=tradesOpen().filter(x=>x.id!==t.dataset.id);toast('교환 신청을 지웠어요')}
  else if(t.dataset.act==='vsend'){
    const f=ents().find(q=>q.name===vSel.to&&q!==k)||ents().find(q=>q!==k),cur=outOf(k);
    if(f&&cur.length<3){
      let o=null;
      if(vSel.who==='t'){if(!trainerAway(k))o={to:f.name,m:-1,id:0}}
      else{const i=+vSel.who,m=k.mons[i];if(m&&!isAway(k,i))o={to:f.name,m:i,id:m.id}}
      if(o){o.stay=vSel.mode==='stay';o.at=Date.now();k.out=cur.concat([o]);sfx('hatch');toast('🚌 '+(o.m<0?'트레이너':k.mons[o.m].name)+'가 '+f.name+'의 마을로 놀러 갔어요!')}
    }
  }
  else if(t.dataset.act==='vback'){const cur=outOf(k);k.out=cur.filter((_,j)=>j!==+t.dataset.j);toast('🏠 돌아왔어요!')}
  else if(t.dataset.buy){const d=SHOP.find(x=>x.id===t.dataset.buy);if(d&&(k.deco||[]).indexOf(d.id)<0&&k.coins>=d.p){k.coins-=d.p;k.deco.push(d.id);sfx('hatch');toast(d.e+' '+d.n+' 샀어요! 마을에 놓였어요')}}
  else if(t.dataset.act==='vdoor'){vdoorTap(k,t.dataset.v);return}
  else if(t.dataset.act==='vopen'){const v=t.dataset.v;if(VIL[v]&&!vOpen(k,v)&&k.coins>=SDOOR_COST){k.coins-=SDOOR_COST;k.vil[v]=1;sfx('evo');confetti();save();closeOv();goVil(k,v)}}
  else if(t.dataset.act==='vsail'){const sc=document.getElementById('vsc');if(sc&&!sc.classList.contains('sail')){sc.classList.add('sail');sfx('hatch');setTimeout(()=>{try{sc.classList.remove('sail')}catch(e){}},7200)}return}
  else if(t.dataset.act==='vbring'){const v=t.dataset.v,id=+t.dataset.id;if(VIL[v]&&vOwn(k,v).indexOf(id)>=0&&(k.cb||[]).indexOf(id)<0&&k.coins>=BRING_COST){k.cb=k.cb||[];k.coins-=BRING_COST;k.cb.push(id);sfx('evo');confetti();save();render()}return}
  else if(t.dataset.act==='vilsend'){const v=t.dataset.v,id=+t.dataset.id;if(VIL[v]&&k.cb&&k.cb.indexOf(id)>=0){k.cb=k.cb.filter(x=>x!==id);sfx('hatch');save();render()}return}
  else if(t.dataset.act==='vpull'){vilPull(k,t.dataset.v);return}
  else if(t.dataset.act==='charge'){if(!k.adult)return;if(!askPin())return;let n=t.dataset.v==='x'?Math.round(+(prompt('충전할 코인 수를 입력하세요 (줄이려면 앞에 - 를 붙여요)')||0)):+t.dataset.v;if(!n||isNaN(n))return;k.coins=Math.max(0,k.coins+n);sfx('coin');toast((n>0?'⚡ ':'')+k.name+' 코인 '+(n>0?'+':'')+won(n)+' → 지금 '+won(k.coins)+'개',3000)}

        evoAnim(old,oldId,p.name,p.id)}

/* ---- 이모티콘이 검정색으로만 나오는 기기(예: 스탠바이미 브라우저)에서는 그림 이모티콘으로 바꿔서 보여줘요 ---- */
let tweRe=null;
function emojiTest(){                                    // 색깔 이모티콘이 제대로 그려지는지 확인 (true = 정상)
  try{
    const c=document.createElement('canvas');c.width=c.height=28;const x=c.getContext('2d');
    x.font='20px sans-serif';x.textBaseline='top';x.fillStyle='#000';x.fillText('\uD83D\uDE00\u2764\uFE0F',0,2);
    const d=x.getImageData(0,0,28,28).data;let any=0,col=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]>40){any++;if(Math.abs(d[i]-d[i+1])>25||Math.abs(d[i+1]-d[i+2])>25)col++}}
    return any>0&&col>3;
  }catch(e){return true}
}
const tweCode=str=>{const a=[];Array.from(str).forEach(ch=>a.push(ch.codePointAt(0).toString(16)));let r=a.join('-');if(r.indexOf('200d')<0)r=r.replace(/-?fe0f/g,'');return r};
function tweWalk(root){
  if(!tweRe){try{tweRe=new RegExp(String.raw`(?:\p{Regional_Indicator}{2}|[#*0-9]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*)`,'gu')}catch(e){return}}

      const im=document.createElement('img');im.className='twe';im.alt=m[0];im.src='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/'+tweCode(m[0])+'.svg';

    const h=String(location.hash||'').replace(/^#/,''),q={};

  }catch(e){return false}
}
