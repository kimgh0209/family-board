<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="우리집보드">
<title>우리집 포켓몬 보드</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5e9;--card:#fff;--ink:#2b3a2f;--red:#e53935;--yellow:#fbc02d;--green:#43a047;--blue:#1e88e5;--line:#cfe3d1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:linear-gradient(#ffe0b2,#e8f5e9 240px) fixed;color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--red);color:#fff;border-bottom:6px solid #b71c1c}
header h1{font-size:20px;margin:0 auto 0 0}
.tabs,.kids,.acts{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.4}
.tabs button{padding:10px 13px}
.tabs button.on{background:var(--yellow)}
.kids{padding:12px 16px 0;max-width:1100px;margin:auto}
.kids button{font-size:20px;border:3px solid transparent}
.kids button.on{border-color:var(--ink);background:var(--yellow)}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 8px;font-size:18px}
.bar{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;flex-wrap:wrap}
.small{font-size:14px;opacity:.7}
.chip{background:var(--yellow);padding:3px 11px;border-radius:99px;font-weight:700;white-space:nowrap}
.coin{background:#fff3c4;border:2px solid #f0b400}
/* home */
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.home{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:560px){.home{grid-template-columns:1fr}}
.clock{font-size:64px;font-weight:800;line-height:1}
.date{font-size:22px;margin-top:6px}
.wx{font-size:22px;margin-top:10px}
.notice{background:#fff8e1;border-left:6px solid var(--yellow);padding:10px 12px;border-radius:8px;margin:6px 0;font-size:19px}
.ev{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:18px;gap:8px}
.ev button{margin-left:6px;padding:8px 12px}
.kidcard{text-align:center;cursor:pointer}
.kidcard img.mon-img{width:110px;height:110px;object-fit:contain}
.kidcard img.tp1{height:44px;width:auto;vertical-align:middle;margin-right:6px}
/* mission */
.chore{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0;padding:18px;font-size:22px;text-align:left;background:#fffde7;border:3px solid var(--yellow)}
.chore .box{width:36px;height:36px;border-radius:50%;border:3px solid var(--yellow);background:#fff;display:grid;place-items:center;font-size:24px;color:#fff;flex:none}
.chore.done{background:#c8e6c9;border-color:var(--green)}
.chore.done .box{background:var(--green);border-color:var(--green)}
.chore.done .txt{text-decoration:line-through;opacity:.6}
.chore .txt{flex:1}
.prog{height:10px;background:#e0e0e0;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stats .chip{font-size:18px}
/* town */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mon{border:3px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:#fafafa}
.mon.sel{border-color:var(--red);background:#ffebee}
.mon img{width:90px;height:90px;object-fit:contain}
.hero{text-align:center}
.hero img{width:200px;height:200px;object-fit:contain;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.shake{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.go{background:var(--green)!important;color:#fff!important}
.egg{background:var(--blue)!important;color:#fff!important}
.acts{justify-content:center;margin-top:10px}
.stack>*+*{margin-top:14px}
/* 마을 풍경 */
.scene{position:relative;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(#8ed1fc,#d9f3ff 62%);border:3px solid var(--line)}
.scene.night{background:linear-gradient(#0d1b3e,#3b4f86 70%)}
.scene svg{position:absolute;left:0;top:0;width:100%;height:100%}
.scene .dc,.scene .tr,.scene .wm,.scene .sun,.scene .cl{position:absolute}
.scene .dc{line-height:1;transform:translateX(-50%)}
.scene .sun{top:10px;right:6%;font-size:46px}
.scene .cl{font-size:40px;opacity:.9;animation:drift 50s linear infinite}
@keyframes drift{from{left:-12%}to{left:105%}}
.scene .tr img{height:88px;width:auto;display:block}
.scene .wm{cursor:pointer;animation:wander 9s ease-in-out infinite}
.scene .wm img{width:100%;display:block}
.scene .wm.sel img{filter:drop-shadow(0 0 6px #ff5252)}
@keyframes wander{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(70px) scaleX(1)}50%{transform:translateX(70px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.tpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:80vw}
.tpick button{padding:6px}
.tpick img{height:70px;width:auto;display:block;margin:auto}
/* 진화 계보 */
.evw{overflow-x:auto;padding:8px 0;margin:6px 0;border-bottom:1px dashed var(--line);text-align:left}
.evt{display:flex;align-items:center}
.evk{display:flex;flex-direction:column}
.evn{text-align:center;padding:4px 6px;border-radius:12px;min-width:84px}
.evn img{width:72px;height:72px;object-fit:contain}
.evn div{font-size:13px;font-weight:700}
.evn.cur{background:#ffebee;outline:3px solid var(--red)}
.arr{font-size:22px;margin:0 4px;color:var(--red)}
.gen{display:flex;align-items:center;margin:4px 0;font-size:14px}
.gen span:first-child{width:50px}
.gen .prog{flex:1;margin:0 8px}
.gen span:last-child{width:70px;text-align:right}
/* 기록 */
.wk{display:flex;align-items:flex-end;height:110px;margin:8px 0}
.wk div{flex:1;text-align:center;font-size:13px;margin:0 3px}
.wk i{display:block;background:var(--green);border-radius:6px 6px 0 0;min-height:3px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bd{text-align:center;border:3px solid var(--yellow);background:#fffde7;border-radius:14px;padding:8px}
.bd b{display:block;font-size:30px}
.bd span{font-size:14px;font-weight:700;display:block}
.bd small{font-size:12px;opacity:.7}
.bd.lock{opacity:.35;filter:grayscale(1);border-color:var(--line)}
/* overlay / toast */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:9}
#ov.show{display:grid}
#ov .box{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:90vw;max-height:92vh;overflow:auto}
#ov img.big{width:240px;height:240px;object-fit:contain;animation:pop .6s}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:99px;font-size:22px;opacity:0;transition:.3s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.cf{position:absolute;top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* settings */
textarea,input,select{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;user-select:text;-webkit-user-select:text}
textarea{height:110px}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}
.row input{flex:1}
.row input.num{width:96px;flex:none;text-align:right}
.row input[type=checkbox]{width:28px;height:28px;flex:none}
.row button{padding:8px 12px}
label.small{display:block;margin:10px 0 4px}
/* 대시보드(홈) */
.dash{max-width:1200px;margin:auto;font-size:15px}
main{max-width:1200px}
.skyrow{display:flex;flex-wrap:wrap;margin:-5px}
.skyrow>*{margin:5px}
.sky{position:relative;border-radius:18px;border:3px solid #fff;background:linear-gradient(#7ec8f5,#cdeeff 75%);padding:10px 16px 26px;overflow:hidden;min-height:150px}
.sky:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#66bb6a 0,#66bb6a 14px,#7cc47f 14px,#7cc47f 28px)}
.brand{display:flex;align-items:center;font-size:12px;font-weight:800;color:#1565c0;line-height:1.2}
.ball{display:inline-block;width:34px;height:34px;border-radius:50%;border:3px solid #222;margin-right:8px;position:relative;background:linear-gradient(#e53935 45%,#222 45%,#222 55%,#fff 55%)}
.ball:after{content:"";position:absolute;left:8px;top:8px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #222}
.dt2{text-align:right;font-size:22px;font-weight:800;color:#1565c0;margin-top:-18px}
.clk-row{display:flex;align-items:flex-end;justify-content:center;margin-top:2px}
.apm{font-size:20px;font-weight:800;color:#1565c0;margin-right:8px;margin-bottom:10px}
.clk2{font-family:"DotGothic16","Courier New",monospace;font-size:84px;line-height:1;color:#fff;text-shadow:3px 3px 0 #1565c0,-2px -2px 0 #1565c0,2px -2px 0 #1565c0,-2px 2px 0 #1565c0;letter-spacing:2px}
.wcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;align-items:center;flex-wrap:wrap}
.wcard>*{margin:4px}
.aqbox{color:#fff;border-radius:14px;padding:8px 12px;text-align:center;min-width:76px;display:flex;flex-direction:column}
.aqbox b{font-size:30px;line-height:1.1}.aqbox span{font-weight:800}
.wnow{flex:1 1 200px}
.wbig{display:flex;align-items:center}
.wbig .wi{font-size:46px;margin-right:6px}
.wbig b{font-size:46px;line-height:1;margin-right:10px}
.wtx{font-size:15px;font-weight:700}
.wcm{font-weight:700;color:#1565c0;margin-top:4px}
.muted{opacity:.6}
.whs{display:flex}
.wh{text-align:center;background:#f1f8ff;border-radius:12px;padding:6px 8px;margin-left:6px;min-width:56px;display:flex;flex-direction:column}
.wh .wi{font-size:22px}
.wh.past{opacity:.4}
.nbar{display:flex;flex-wrap:wrap;margin:6px -4px 0}
.nbar .notice{margin:4px;font-size:16px;padding:8px 12px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;grid-gap:10px;gap:10px;margin-top:10px}
@media(max-width:899px){.cols{grid-template-columns:1fr}}
.col>*+*{margin-top:10px}
.pair{display:grid;grid-template-columns:1.2fr 1fr;grid-gap:10px;gap:10px}
.pair>*{margin-top:0!important}
@media(max-width:620px){.pair{grid-template-columns:1fr}}
.sec{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px}
.sh{font-weight:800;font-size:16px;border-left:5px solid var(--c,#43a047);padding-left:8px;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap}
.sh>*{margin-right:8px}
.cnt{background:#f5f5f5;color:#555;border-radius:99px;padding:0 8px;font-size:13px}
.cnt2{margin-left:auto;font-size:13px;color:#2e7d32}
.calh{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.calh>*{margin-right:6px}
.ct{font-size:22px}
.mini{padding:4px 10px;font-size:14px;border-radius:10px}
.legend{margin-left:auto;font-size:12px;font-weight:700;display:flex;flex-wrap:wrap;justify-content:flex-end}
.legend span{margin-left:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #e3e8e3;border-left:1px solid #e3e8e3}
.cal>div{border-right:1px solid #e3e8e3;border-bottom:1px solid #e3e8e3;min-width:0}
.cw{text-align:center;font-weight:800;padding:3px 0;font-size:13px}
.cw.sun,.dn.sun{color:#e53935}.cw.sat,.dn.sat{color:#1e88e5}
.cd{min-height:58px;padding:2px;overflow:hidden}
.cd.out{background:#fafafa}
.cd.tod{background:#fff3e0}
.dn{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-weight:800;font-size:13px}
.cd.tod .dn{background:#e53935;color:#fff}
.ce{margin-top:2px;padding:1px 3px;border-radius:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cm{font-size:10px;opacity:.6;margin-top:2px}
.ckgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:0 8px;gap:0 8px}
.ti{display:flex;align-items:center;width:100%;background:none;box-shadow:none;padding:4px 0;font-weight:600;font-size:14px;text-align:left;border-radius:6px}
.ti:active{transform:none}
.ti .cb{width:17px;height:17px;border:2px solid #9aa;border-radius:4px;margin-right:6px;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800}
.ti.d .cb{background:var(--green);border-color:var(--green)}
.ti.d .t{text-decoration:line-through;opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.sdh{margin-bottom:4px}
.sev{display:flex;align-items:center;padding:3px 0 3px 8px;margin:3px 0;font-weight:700;font-size:14px;background:#fafafa;border-radius:4px}
.stm{font-size:12px;opacity:.7;width:68px;flex:none}
.tcols{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.cm2{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.inl{display:flex;flex-wrap:wrap}
.inl .ti{width:auto;margin-right:12px}
.shop{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;color:#2e7d32;font-weight:600}
.krow{display:flex;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.krow:last-child{border-bottom:0}
.krow img{width:56px;height:56px;object-fit:contain;margin-right:8px}
.egg0{font-size:40px;width:56px;text-align:center;margin-right:8px}
.kinfo{flex:1;min-width:0}
.kinfo .chip{font-size:12px;padding:1px 8px}
.up{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px;font-weight:600}
.up:last-child{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:6px 4px}
.mus{background:#1e88e5;color:#fff}
/* 한 화면에 최대한 들어오도록 간격 줄이기 */
header{padding:6px 12px}
header h1{font-size:16px}
.tabs button{padding:7px 9px;font-size:14px}
.tabs,header>*{margin:2px!important}
header>button{padding:7px 10px}
.clk2{font-size:68px}
.sky{min-height:126px;padding:8px 14px 24px}
.dt2{font-size:19px}
.cd{min-height:50px}
main{padding-top:8px}
/* 정렬: 윗줄과 아랫줄 칸 너비를 같게, 칸 높이를 맞추기 */
.skyrow{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px;margin:0}
.skyrow>*{margin:0}
@media(max-width:899px){.skyrow{grid-template-columns:1fr}}
.cols{grid-template-columns:1fr 1fr}
.sky,.wcard,.sec{border-radius:16px}
.sky{display:flex;flex-direction:column;justify-content:center}
.clk2{font-size:84px}
.wcard{display:block;padding:10px 12px}
.wtop{display:flex;align-items:center;flex-wrap:wrap}
.wtop>*{margin:3px}
.whs{flex:1 1 100%;display:flex;margin:3px 0 0 0}
.wh{flex:1;margin:0 3px}
.wtx small{display:block;font-weight:600;opacity:.6}
.mm{display:flex;margin-top:4px}
.mm span{font-weight:800;font-size:17px;border-radius:99px;padding:2px 12px;margin-right:6px}
.mn{background:#e3f2fd;color:#1565c0}
.mx{background:#ffebee;color:#c62828}
.outfit{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.oh{font-weight:800;margin-bottom:3px}
.oh small{font-weight:600;font-size:11px;margin-left:6px}
.orow{display:flex;font-weight:700;font-size:14px;margin:2px 0}
.ot{width:88px;flex:none;color:#555}
.otip{font-size:13px;font-weight:700;color:#1565c0;margin-top:4px}
.col{display:flex;flex-direction:column}
.col>.sec:last-child,.col>.pair:last-child{flex:1}
.nbar{margin:10px 0 0}
.nbar .notice{margin:0 8px 0 0}
/* 식단 · 별점 */
.menucard{cursor:pointer}
.mrow{display:flex;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.mrow.big{padding:10px 0}
.mt{width:84px;flex:none;font-weight:800}
.mv{font-weight:700;font-size:17px}
.mrow.big .mv{font-size:22px}
.mfoot{margin-top:6px;font-size:13px;font-weight:700;color:#ad1457}
.wm2{font-size:14px;font-weight:600;text-align:right}
.rate{border:3px solid var(--yellow);background:#fffde7;border-radius:14px;padding:10px;margin-top:10px}
.rh{font-size:18px;margin-bottom:4px}
.stars{display:flex}
.star{font-size:42px;padding:0 6px;background:none;box-shadow:none;color:#cfcfcf;line-height:1.1}
.star:active{transform:none}
.star.on{color:#fbc02d}
.emos{display:flex;flex-wrap:wrap;margin-top:6px}
.emo{margin:3px;padding:6px 10px;font-size:28px;border:3px solid transparent;display:flex;flex-direction:column;align-items:center}
.emo small{font-size:11px;font-weight:700}
.emo.on{border-color:var(--red);background:#ffebee}
.rcs{display:flex;flex-wrap:wrap}
.rc{margin:3px 6px 3px 0;padding:8px 18px;font-size:18px}
.rc.on{background:var(--yellow)}
/* 옷 · 인형 */
.okids{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;gap:8px}
.okid{display:flex;flex-direction:column;align-items:center;border:3px solid;background:#fff;padding:8px 4px;min-height:92px;font-size:20px}
.thumbs{display:flex;margin-top:4px;min-height:34px;align-items:center;justify-content:center;flex-wrap:wrap}
.thumbs img{width:32px;height:32px;object-fit:cover;border-radius:6px;margin:1px;border:1px solid #ddd}
.thumbs small{font-size:12px;font-weight:600;opacity:.6}
.stagewrap{display:flex;justify-content:center}
.stage{display:flex;align-items:center;width:100%;max-width:max(360px,min(100%,calc((100vh - 320px)*1.25)))}
.sc{flex:1 1 0;min-width:0}
.dollcol{flex:0 0 40%}
.dollbox{position:relative;width:100%;padding-top:200%}
.dollbox svg{position:absolute;left:0;top:0;width:100%;height:100%}
.z{position:absolute}
.zhat{left:33%;width:34%;top:0;height:11%}
.ztop{left:24%;width:52%;top:22%;height:27%}
.zbot{left:27%;width:46%;top:50%;height:37%}
.zshoe{left:20%;width:60%;top:88%;height:12%}
.tl{position:relative;cursor:pointer}
.z .tl{width:100%;height:100%}
.tl img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tl small{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:0 7px;font-size:12px;font-weight:700}
.sc .tl{width:calc(100% - 8px);margin:6px 4px;padding-top:calc(100% - 8px)}
.sc .tl img{position:absolute;left:0;top:0}
.cg{margin:10px 0}
.cg b{display:block;margin-bottom:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-gap:8px;gap:8px}
.cti{position:relative;border:4px solid transparent;border-radius:12px;background:#f1f1f1;cursor:pointer;padding-top:100%;overflow:hidden}

<body>
<header>

  <div class="tabs" id="tabs"></div>
  <span id="cloud" style="display:none"></span>

<script>
const API='https://pokeapi.co/api/v2/';
const ART=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const TRAINERS=['red','blue','ethan','lyra','brendan','may','lucas','dawn','hilbert','hilda','nate','rosa','calem','serena','elio','selene','victor','gloria','ash'];
const TR_DEFAULT=['red','ethan','lyra'];
const KID_COLORS=['#e53935','#fb8c00','#43a047','#00acc1','#8d6e63'];
const TRAINER=n=>`https://play.pokemonshowdown.com/sprites/trainers/${n}.png`;
const IDLE_MS=90000;                              // 90초 동안 터치가 없으면 홈으로
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dkey=off=>{const d=new Date();d.setDate(d.getDate()+off);return fmt(d)};
const today=()=>fmt(new Date());
const idFrom=u=>+u.split('/').filter(Boolean).pop();
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()};
const koName=s=>(s.names.find(n=>n.language.name==='ko')||{name:s.name}).name;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR');

/* ---------- 데이터 ---------- */
// 미션: t=이름, c=포켓코인
function newKid(name,chores,trainer){return {name,chores:chores.map(([t,c])=>({t,c})),done:{},coins:0,mons:[],sel:0,dex:{},trainer,
  evos:0,earned:0,streak:0,best:0,perfect:0,bought:0,hist:{},badges:{},lastPerfect:'',bonusDate:'',bonusAmt:0}}
function fixKid(k,i){
  const t=today();
  k.done=k.done||{};Object.keys(k.done).forEach(x=>{if(x!==t)delete k.done[x]});
  k.dex=k.dex||{};k.mons=k.mons||[];k.mons.forEach(m=>{k.dex[m.id]=1});
  if(!k.trainer)k.trainer=TR_DEFAULT[i%3];
  if(!k.color)k.color=KID_COLORS[i%KID_COLORS.length];
  k.birthday=k.birthday||'';
  ['evos','earned','streak','best','perfect','bought','bonusAmt','coins','sel'].forEach(f=>{if(typeof k[f]!=='number')k[f]=0});
  k.hist=k.hist||{};k.badges=k.badges||{};k.lastPerfect=k.lastPerfect||'';k.bonusDate=k.bonusDate||'';
  const keys=Object.keys(k.hist).sort();while(keys.length>45)delete k.hist[keys.shift()];
}
function defaults(){
  const base=()=>[['세수하기',10],['양치하기',10],['책 읽기',30],['장난감 정리',20]];
  return {pin:'0000',lat:37.5665,lon:126.978,
    notices:'오늘도 화이팅! 💪',
    events:`${dkey(0)} 10:30 도서관 그림책 시간 #이현\n${dkey(1)} 18:30 태권도 #한율\n${dkey(3)} 가족 외식 #가족\n${dkey(6)} 병원 예약 #엄마`,   // 예시예요. 설정에서 지우고 고쳐 쓰세요
    people:[{n:'엄마',c:'#ec407a'},{n:'아빠',c:'#1e88e5'},{n:'가족',c:'#8e24aa'}],
    todoText:{'한율':'책가방 챙기기\n숙제하기','이현':'알림장 확인\n준비물 챙기기','서비':'장난감 정리하기','가족':'가족 사진 고르기'},
    todoDone:{},shopping:'우유\n사과\n식빵\n요거트',
    checklist:{title:'여행 준비물',sub:'',text:'여권\n충전기\n카메라\n간식\n세면도구\n비상약'},
    menu:`${dkey(0)} 점심 비빔밥, 계란국\n${dkey(0)} 저녁 김치찌개, 계란말이, 시금치나물\n${dkey(1)} 저녁 삼겹살, 쌈채소`,   // 예시예요. 설정에서 고쳐 쓰세요
    thanks:{},thanksTo:'',closet:[],outfit:{},
    shift:{on:true,name:'아빠',anchor:'2026-11-17',seq:'휴 야 야 휴 휴 주 주 휴'},   // 4조 2교대: 기준일(휴)부터 휴·야·야·휴·휴·주·주·휴 를 반복
    shiftOv:{},
    eggCost:100,evoCost:80,legend:false,          // 알 가격 / 진화 가격 (포켓코인)
    bonus:20,mute:false,                           // 하루 미션 전부 완료 보너스
    kids:TR_DEFAULT.map((t,i)=>newKid(['한율','이현','서비'][i],base(),t))};
}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('pkfam3'))}catch(e){}
  s=s||defaults();
  const d=defaults();
  Object.keys(d).forEach(k=>{if(k!=='kids'&&s[k]===undefined)s[k]=d[k]});
  s.kids.forEach(fixKid);
  Object.keys(s.thanks).forEach(x=>{if(s.thanks[x].date<dkey(-90))delete s.thanks[x]});
  Object.keys(s.outfit).forEach(x=>{if(x<dkey(-14))delete s.outfit[x]});
  Object.keys(s.shiftOv).forEach(x=>{if(x<dkey(-60))delete s.shiftOv[x]});
  return s;
}
let S=load(), tab='home', kid=0, W=null, B=null, lastDay=today(), unlockUntil=0, busy=false;
const save=()=>{
  try{if(S.sync&&S.sync.on&&!S.sync.ro&&cfgHash()!==lastCfgHash){S.cfgTs=Date.now();clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}}catch(e){}   // 설정이 바뀌면 곧바로 클라우드에 올려요
  try{localStorage.setItem('pkfam3',JSON.stringify(S))}catch(e){}
};
const K=()=>S.kids[kid]||S.kids[0];
const leadOf=k=>k.mons[k.sel];
const curStreak=k=>(k.lastPerfect===today()||k.lastPerfect===dkey(-1))?k.streak:0;

/* ---------- 배지 ---------- */
const BADGES=[
  {id:'mon1',i:'🥚',n:'첫 포켓몬',d:'알을 부화시켰어요',f:k=>k.mons.length>=1},
  {id:'mon5',i:'🐾',n:'포켓몬 5마리',d:'친구가 5마리!',f:k=>k.mons.length>=5},
  {id:'mon10',i:'🐾',n:'포켓몬 10마리',d:'친구가 10마리!',f:k=>k.mons.length>=10},
  {id:'mon20',i:'🏰',n:'포켓몬 20마리',d:'대가족이 됐어요',f:k=>k.mons.length>=20},
  {id:'evo1',i:'✨',n:'첫 진화',d:'처음으로 진화시켰어요',f:k=>k.evos>=1},
  {id:'evo5',i:'🌟',n:'진화 5번',d:'진화 박사!',f:k=>k.evos>=5},
  {id:'dex10',i:'📖',n:'도감 10종',d:'10종을 만났어요',f:k=>Object.keys(k.dex).length>=10},
  {id:'dex30',i:'📚',n:'도감 30종',d:'30종을 만났어요',f:k=>Object.keys(k.dex).length>=30},
  {id:'dex100',i:'🏆',n:'도감 100종',d:'100종을 만났어요',f:k=>Object.keys(k.dex).length>=100},
  {id:'perfect1',i:'🎉',n:'첫 전체 완료',d:'하루 미션을 모두 끝냈어요',f:k=>k.perfect>=1},
  {id:'perfect10',i:'🎊',n:'전체 완료 10번',d:'꾸준함의 달인',f:k=>k.perfect>=10},
  {id:'st3',i:'🔥',n:'3일 연속',d:'3일 연속 전체 완료',f:k=>k.best>=3},
  {id:'st7',i:'🔥',n:'7일 연속',d:'일주일 연속 전체 완료',f:k=>k.best>=7},
  {id:'st14',i:'☄️',n:'14일 연속',d:'2주 연속 전체 완료',f:k=>k.best>=14},
  {id:'st30',i:'🌋',n:'30일 연속',d:'한 달 연속 전체 완료',f:k=>k.best>=30},
  {id:'earn100',i:'🪙',n:'누적 100코인',d:'코인을 100개 벌었어요',f:k=>k.earned>=100},
  {id:'earn1000',i:'💰',n:'누적 1000코인',d:'코인을 1000개 벌었어요',f:k=>k.earned>=1000},
  {id:'earn5000',i:'👑',n:'누적 5000코인',d:'코인 부자!',f:k=>k.earned>=5000}
];
function checkAll(){
  const out=[];
  S.kids.forEach(k=>BADGES.forEach(b=>{if(!k.badges[b.id]&&b.f(k)){k.badges[b.id]=today();out.push(`${k.name}: ${b.i} ${b.n}`)}}));
  return out;
}
checkAll();

/* ---------- 효과음 · 효과 ---------- */
let AC=null;
function sfx(type){
  if(S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const seqs={coin:[[988,.08],[1319,.2]],win:[[523,.1],[659,.1],[784,.1],[1047,.35]],hatch:[[392,.1],[523,.1],[659,.1],[784,.1],[1047,.45]],
      evo:[[523,.12],[587,.12],[659,.12],[784,.12],[880,.12],[1047,.55]],badge:[[784,.12],[988,.12],[1175,.35]],buy:[[660,.1],[880,.25]]};
    let t=AC.currentTime;
    (seqs[type]||[]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9});
  }catch(e){}
}
function confetti(){
  const c=document.createElement('div');c.style.cssText='position:fixed;left:0;right:0;top:0;height:0;z-index:20;pointer-events:none';
  const em=['🎉','⭐','✨','🪙','🎊','💛'];
  for(let i=0;i<30;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.className='cf';
    s.style.left=Math.random()*100+'%';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.5)+'s';s.style.fontSize=(18+Math.random()*20)+'px';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>{if(c.parentNode)c.parentNode.removeChild(c)},3800);
}

/* ---------- 포켓몬 API ---------- */
let dexTotal=0,chainTotal=0;                      // 도감 전체 종 수 / 진화 계보 수 (PokeAPI에서 실시간 조회)
async function speciesCount(){
  if(dexTotal)return dexTotal;
  try{dexTotal=(await jget(API+'pokemon-species?limit=1')).count}catch(e){dexTotal=1025}
  return dexTotal;
}
async function chainCount(){
  if(chainTotal)return chainTotal;
  try{chainTotal=(await jget(API+'evolution-chain?limit=1')).count}catch(e){chainTotal=500}
  return chainTotal;
}
async function rollEgg(){                         // 현존하는 전체 포켓몬 중에서 뽑고, 항상 진화 전 모습으로 부화
  const total=await speciesCount();
  for(let i=0;i<12;i++){
    try{
      let sp=await jget(API+'pokemon-species/'+(1+Math.floor(Math.random()*total)));
      if(!S.legend&&(sp.is_legendary||sp.is_mythical))continue;
      while(sp.evolves_from_species)sp=await jget(sp.evolves_from_species.url);
      return {id:sp.id,sp:sp.name,name:koName(sp)};
    }catch(e){}
  }
  throw new Error('roll');
}
async function evolve(m){            // 진화할 수 없으면 null
  const sp=await jget(API+'pokemon-species/'+m.id);
  const chain=await jget(sp.evolution_chain.url);
  let found=null;(function walk(n){if(n.species.name===m.sp)found=n;n.evolves_to.forEach(walk)})(chain.chain);
  if(!found||!found.evolves_to.length)return null;
  const nx=found.evolves_to[Math.floor(Math.random()*found.evolves_to.length)];
  const nid=idFrom(nx.species.url),nsp=await jget(API+'pokemon-species/'+nid);
  return {id:nid,sp:nsp.name,name:koName(nsp)};
}
/* ---- 진화 계보(트리) ---- */
const cache={};
async function speciesKo(id){if(cache['n'+id])return cache['n'+id];const sp=await jget(API+'pokemon-species/'+id);return cache['n'+id]=koName(sp)}
async function buildTree(n){const id=idFrom(n.species.url);const ko=await speciesKo(id);const kids=await Promise.all(n.evolves_to.map(buildTree));return {id,ko,kids}}
async function chainTreeByUrl(u){if(cache[u])return cache[u];const c=await jget(u);return cache[u]=await buildTree(c.chain)}
async function chainTreeOf(id){const sp=await jget(API+'pokemon-species/'+id);return chainTreeByUrl(sp.evolution_chain.url)}
async function randomChain(){
  const n=await chainCount();
  for(let i=0;i<15;i++){
    try{const c=await jget(API+'evolution-chain/'+(1+Math.floor(Math.random()*n)));
      if(c.chain.evolves_to.length)return await buildTree(c.chain)}catch(e){}
  }
  throw new Error('chain');
}
function treeHtml(n,cur){
  const me=`<div class="evn ${n.id===cur?'cur':''}"><img src="${ART(n.id)}" loading="lazy"><div>${esc(n.ko)}</div></div>`;
  if(!n.kids.length)return `<div class="evt">${me}</div>`;
  return `<div class="evt">${me}<div class="arr">➜</div><div class="evk">${n.kids.map(k=>treeHtml(k,cur)).join('')}</div></div>`;
}

/* ---------- 날씨 · 공지판 ---------- */
const WX=c=>c===0?['☀️','맑음']:c<=3?['⛅','구름']:c<=48?['🌫','안개']:c<=57?['🌦','이슬비']:c<=67?['🌧','비']:c<=77?['❄️','눈']:c<=82?['🌧','소나기']:c<=86?['❄️','눈']:['⛈','천둥번개'];
async function loadWeather(){
  try{
    const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
    const w={t:Math.round(j.current.temperature_2m),c:j.current.weather_code,hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),
      hours:j.hourly.time.map((x,i)=>({t:j.hourly.temperature_2m[i],c:j.hourly.weather_code[i],p:j.hourly.precipitation_probability[i]})),pm10:null,pm25:null};
    try{const a=await jget(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${S.lat}&longitude=${S.lon}&current=pm10,pm2_5&timezone=auto`);w.pm10=a.current.pm10;w.pm25=a.current.pm2_5}catch(e){}
    W=w;lastSync=new Date();
  }catch(e){}
  if(tab==='home'&&!busy)render();
}
// 폰에서 GitHub의 board.json 파일을 고치면 패드에 자동 반영돼요
async function loadBoard(){
  try{const r=await fetch('board.json?'+Date.now(),{cache:'no-store'});if(r.ok)B=await r.json()}catch(e){}

function parseEv(){

    const m=l.match(/^(?:(\d{4})-)?(\d{1,2})-(\d{1,2})\s+(?:(\d{1,2}:\d{2})\s+)?(.+)$/);
    if(!m)return;

function eventsOn(evs,ds){

function nextOcc(e){

function compress(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const M=520,s=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    im.src=u;
  });
}

/* ---- 교대 근무표 (예: 4조 2교대) ---- */
const SH={D:['☀️','주간 근무','#fb8c00'],N:['🌙','야간 근무','#3949ab'],O:['🏠','쉬는 날','#2e7d32']};
function shNorm(tok){
  const t=String(tok).trim().toLowerCase();
  if(/^(d|day|주|주간|데이)$/.test(t))return 'D';
  if(/^(n|night|야|야간|나이트)$/.test(t))return 'N';
  if(/^(o|off|휴|휴무|쉼|쉬는날)$/.test(t))return 'O';
  return null;
}
const shSeq=()=>String((S.shift||{}).seq||'').split(/[\s,/·]+/).map(shNorm).filter(Boolean);
// 그날의 근무: {t:'D'|'N'|'O', base(원래 근무), sub(대근), vac(연차)}
function shiftOf(ds){
  const sh=S.shift;if(!sh||!sh.on||!sh.anchor)return null;
  const seq=shSeq();if(!seq.length)return null;
  const [y,m,d]=ds.split('-').map(Number),[ay,am,ad]=sh.anchor.split('-').map(Number);
  if(!ay)return null;
  const n=dayNum(y,m,d)-dayNum(ay,am,ad),L=seq.length,base=seq[((n%L)+L)%L],ov=(S.shiftOv||{})[ds];
  if(ov)return {t:ov.t,base,sub:!!ov.sub,vac:!!ov.vac};
  return {t:base,base,sub:false,vac:false};
}
function shView(x){                                  // 화면에 보일 모양 [이모지, 글자, 색]
  if(x.vac)return ['🏖','연차 · 쉬는 날','#00838f'];
  if(x.sub)return [SH[x.t][0],'대근 · '+(x.t==='D'?'주간':'야간'),SH[x.t][2]];
  return SH[x.t];
}
const shOff=x=>x.t==='O';
function shMark(ds){
  const x=shiftOf(ds);if(!x||x.t==='O')return '';
  return `<span class="sh1">${SH[x.t][0]}${x.sub?'🔄':''}</span>`;
}
function shiftCard(){
  const sh=S.shift;if(!sh||!sh.on||!shSeq().length)return '';
  const box=(n,lab)=>{
    const d=addDays(n),x=shiftOf(dstr(d));if(!x)return '';
    const v=shView(x);
    return `<div class="shb" style="border-color:${v[2]}"><small>${lab} ${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})</small><div class="shi">${v[0]}</div><b style="color:${v[2]}">${v[1]}</b>${x.sub?'<span class="subt">🔄 대근이에요</span>':''}</div>`;
  };
  let strip='',nextOff=null;
  for(let i=0;i<7;i++){const d=addDays(i),x=shiftOf(dstr(d));
    strip+=`<div class="ss ${i===0?'now':''}"><small>${WD[d.getDay()]}</small><span>${x.vac?'🏖':SH[x.t][0]}${x.sub?'<i>🔄</i>':''}</span></div>`}
  for(let i=0;i<40&&!nextOff;i++){const d=addDays(i),x=shiftOf(dstr(d));if(x&&shOff(x))nextOff={i,d}}
  const off=nextOff?(nextOff.i===0?'오늘은 쉬는 날이에요! 🎉':nextOff.i===1?'내일은 쉬는 날이에요! 🎉':`다음 쉬는 날은 ${nextOff.d.getMonth()+1}/${nextOff.d.getDate()} (${WD[nextOff.d.getDay()]})`):'';
  return `<div class="sec"><div class="sh" style="--c:#3949ab;color:#283593">👨 ${esc(sh.name||'아빠')} 근무</div>
    <div class="shrow">${box(0,'오늘')}${box(1,'내일')}</div>
    <div class="shstrip">${strip}</div>${off?`<div class="small" style="margin-top:3px;font-weight:700">${off}</div>`:''}</div>`;
}
function shPreview(n){
  let s='';for(let i=0;i<n;i++){const d=addDays(i),x=shiftOf(dstr(d));if(!x)return '';s+=`${d.getMonth()+1}/${d.getDate()} ${x.vac?'🏖':SH[x.t][0]}${x.sub?'🔄':''} · `}
  return s.replace(/ · $/,'');
}

function sceneHtml(k){
  const n=k.mons.length,hr=new Date().getHours(),night=hr>=19||hr<6;

function dexProgress(k){
  const total=dexTotal||1025,ids=Object.keys(k.dex||{}).map(Number),got=ids.length;
  const fam={};S.kids.forEach(q=>Object.keys(q.dex||{}).forEach(x=>{fam[x]=1}));
  const gens=[['1세대',1,151],['2세대',152,251],['3세대',252,386],['4세대',387,493],['5세대',494,649],['6세대',650,721],['7세대',722,809],['8세대',810,905],['9세대',906,total]];
  const rows=gens.filter(g=>g[1]<=total).map(([n,a,b])=>{b=Math.min(b,total);const c=ids.filter(x=>x>=a&&x<=b).length,m=b-a+1;
    return `<div class="gen"><span>${n}</span><div class="prog"><i style="width:${c/m*100}%"></i></div><span>${c}/${m}</span></div>`}).join('');
  return `<div class="card"><h2>🏆 ${esc(k.name)}의 도감 완성도</h2>
    <div class="bar">${got} / ${total}종 <span class="chip">${(got/total*100).toFixed(1)}%</span></div>

    <div class="small" style="margin-top:8px">가족 전체: ${Object.keys(fam).length}종 · 알에서 나오거나 진화해서 만난 모습이 모두 기록돼요</div></div>`;
}

async function fillDex(){
  speciesCount().then(()=>{});
  const els=Array.prototype.slice.call(document.querySelectorAll('[data-mine]'));
  for(const el of els){
    try{const tr=await chainTreeOf(el.dataset.mine);if(document.body.contains(el))el.innerHTML=treeHtml(tr,+el.dataset.mine)}

function recView(){
  const k=K(),days=[];
  for(let i=6;i>=0;i--){const dk=dkey(-i),h=k.hist[dk];days.push({dk,h,pct:h&&h.t?h.n/h.t*100:0,w:new Date(dk+'T00:00:00').toLocaleDateString('ko-KR',{weekday:'short'})})}
  const active=days.filter(x=>x.h&&x.h.t),avg=active.length?Math.round(active.reduce((a,x)=>a+x.pct,0)/active.length):0;
  const coins=days.reduce((a,x)=>a+(x.h?x.h.c:0),0),perfectDays=days.filter(x=>x.h&&x.h.t&&x.h.n===x.h.t).length;
  const cnt={};days.forEach(x=>{if(x.h&&x.h.m)x.h.m.forEach(t=>{cnt[t]=(cnt[t]||0)+1})});
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const got=BADGES.filter(b=>k.badges[b.id]).length;
  return `<div class="stack">
  <div class="card"><h2>📊 ${esc(k.name)}의 이번 주</h2>
    <div class="wk">${days.map(x=>`<div><i style="height:${Math.max(3,x.pct*0.8)}px;${x.h&&x.h.t&&x.h.n===x.h.t?'':'background:#90caf9'}"></i>${x.w}</div>`).join('')}</div>
    <div class="stats"><span class="chip">평균 달성 ${avg}%</span><span class="chip">전체 완료 ${perfectDays}일</span><span class="chip coin">🪙 ${won(coins)} 벌었어요</span></div>
    <div class="small">${best?`가장 많이 한 미션: <b>${esc(best)}</b> (${cnt[best]}번) 👏`:'아직 이번 주 기록이 없어요'} · 초록 막대는 그날 미션을 전부 끝낸 날이에요</div></div>
  <div class="card"><h2>🔥 연속 · 누적</h2><div class="stats">
    <span class="chip">지금 연속 ${curStreak(k)}일</span><span class="chip">최고 연속 ${k.best}일</span><span class="chip">전체 완료 ${k.perfect}번</span><span class="chip coin">누적 🪙 ${won(k.earned)}</span><span class="chip">진화 ${k.evos}번</span></div></div>
  <div class="card"><h2>🏅 배지 (${got}/${BADGES.length})</h2><div class="bgs">
    ${BADGES.map(b=>`<div class="bd ${k.badges[b.id]?'':'lock'}"><b>${b.i}</b><span>${b.n}</span><small>${b.d}</small></div>`).join('')}</div></div></div>`;
}

/* ---------- 부모 PIN ---------- */
function unlocked(){return Date.now()<unlockUntil}
function askPin(){
  if(unlocked())return true;
  const v=prompt('부모 PIN을 입력하세요');
  if(v!==null&&v===String(S.pin)){unlockUntil=Date.now()+5*60000;return true}
  if(v!==null)toast('PIN이 달라요');
  return false;
}

/* ---------- 이벤트 ---------- */
function recordDay(k){
  const d=k.done[today()]||[];
  let c=d.reduce((a,i)=>a+(k.chores[i]?k.chores[i].c:0),0);
  if(k.bonusDate===today())c+=k.bonusAmt;
  k.hist[today()]={n:d.length,t:k.chores.length,c,m:d.map(i=>k.chores[i]?k.chores[i].t:'')};
}
let idle;function bump(){clearTimeout(idle);idle=setTimeout(()=>{if(tab==='home'&&calOff&&!busy){calOff=0;render()}if(tab!=='home'&&!editMode&&!busy&&!document.getElementById('ov').classList.contains('show')&&!(tab==='set'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){tab='home';render()}},IDLE_MS)}
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();syncNow()}});
(function(){const b=document.getElementById('fs'),d=document.documentElement;
  if(!d.requestFullscreen){b.style.display='none';return} // 아이패드 Safari는 미지원 → 홈 화면에 추가해서 전체화면으로 사용
  b.onclick=()=>{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().catch(()=>{})}})();

document.addEventListener('click',async e=>{
  bump();wake();
  if(e.target.id==='ov'){closeOv();return}
  const t=e.target.closest('button,[data-sel],[data-gokid],[data-gotab],[data-pick],[data-zoom]');if(!t||t.id==='fs')return;
  if(t.id==='mute'){S.mute=!S.mute;save();render();return}
  const k=K();
  if(t.dataset.tab){const n=t.dataset.tab;if(n==='set'&&!askPin())return;tab=n;editMode=false}
  else if(t.dataset.gokid!==undefined){kid=+t.dataset.gokid;tab='todo'}
  else if(t.dataset.kid!==undefined){kid=+t.dataset.kid}
  else if(t.dataset.chore!==undefined){
    const i=+t.dataset.chore,d=k.done[today()]=k.done[today()]||[],at=d.indexOf(i),c=k.chores[i].c;
    if(at<0){d.push(i);k.coins+=c;k.earned+=c;sfx('coin');toast(`🪙 +${won(c)}`)}
    else{d.splice(at,1);k.coins=Math.max(0,k.coins-c);k.earned=Math.max(0,k.earned-c)}
    const all=k.chores.length>0&&d.length===k.chores.length;
    if(all&&k.bonusDate!==today()){                       // 오늘 미션 전부 완료 → 연속일수 + 보너스
      k.prev={streak:k.streak,last:k.lastPerfect};
      k.streak=(k.lastPerfect===dkey(-1))?k.streak+1:1;k.lastPerfect=today();k.best=Math.max(k.best,k.streak);
      const b=S.bonus+5*Math.min(k.streak-1,5);
      k.bonusAmt=b;k.bonusDate=today();k.coins+=b;k.earned+=b;k.perfect++;
      sfx('win');confetti();toast(`🎉 전부 완료! 보너스 🪙+${b} (🔥 ${k.streak}일 연속)`,2800);
    }else if(!all&&k.bonusDate===today()){                // 체크를 취소하면 보너스도 회수
      k.coins=Math.max(0,k.coins-k.bonusAmt);k.earned=Math.max(0,k.earned-k.bonusAmt);k.perfect=Math.max(0,k.perfect-1);
      if(k.prev){k.streak=k.prev.streak;k.lastPerfect=k.prev.last}
      k.bonusDate='';k.bonusAmt=0;
    }
    recordDay(k);
  }
  else if(t.dataset.sel!==undefined){k.sel=+t.dataset.sel}
  else if(t.dataset.act==='egg'&&k.coins>=S.eggCost&&!busy){
    busy=true;t.disabled=true;t.innerHTML='<span class="shake" style="display:inline-block">🥚</span> 부화 중...';
    try{const p=await rollEgg();k.coins-=S.eggCost;k.mons.push(p);k.dex[p.id]=1;k.sel=k.mons.length-1;
      sfx('hatch');confetti();overlay(`<h2>🎉 ${esc(p.name)} 등장!</h2><img class="big" src="${ART(p.id)}">`)}
    catch(err){overlay('<h2>인터넷 연결을 확인해주세요 😢</h2>')}
    busy=false;
  }
  else if(t.dataset.act==='evo'&&!busy){
    const p=leadOf(k);if(!p||p.final||k.coins<S.evoCost)return;
    busy=true;t.disabled=true;t.textContent='진화 중...';
    try{const n=await evolve(p);
      if(n){const old=p.name;k.coins-=S.evoCost;Object.assign(p,n);k.dex[p.id]=1;k.evos++;
        sfx('evo');confetti();overlay(`<h2>✨ ${esc(old)} → ${esc(p.name)} 진화!</h2><img class="big" src="${ART(p.id)}">`)}
      else{p.final=true;toast('더 이상 진화하지 않아요 (코인은 그대로예요)')}}
    catch(err){overlay('<h2>인터넷 연결을 확인해주세요 😢</h2>')}
    busy=false;
  }
  else if(t.dataset.act==='tree'){
    const p=leadOf(k);if(!p)return;
    overlay(`<h2>${esc(p.name)}의 진화 계보</h2><div id="ovtree" class="evw">불러오는 중...</div>`);
    chainTreeOf(p.id).then(tr=>{const el=document.getElementById('ovtree');if(el)el.innerHTML=treeHtml(tr,p.id)})
      .catch(()=>{const el=document.getElementById('ovtree');if(el)el.textContent='불러오지 못했어요'});
    return}
  else if(t.dataset.act==='pickTrainer'){
    overlay(`<h2>🧢 ${esc(k.name)}의 트레이너를 골라요</h2><div class="tpick">${TRAINERS.map(n=>`<button data-trainer="${n}"><img src="${TRAINER(n)}"></button>`).join('')}</div>`);
    return}
  else if(t.dataset.trainer){k.trainer=t.dataset.trainer;closeOv();toast('트레이너를 바꿨어요!')}
  else if(t.dataset.act==='exmore'){exTrees=null;const el=document.getElementById('exs');if(el)el.textContent='불러오는 중...';loadExamples();return}
  else if(t.dataset.gotab){tab=t.dataset.gotab}
  else if(t.dataset.zoom){
    const x=S.closet.find(c=>c.id===t.dataset.zoom);
    if(x)overlay(`<img src="${IMG.mem[x.id]||''}" style="max-width:84vw;max-height:66vh;border-radius:12px"><div class="bar" style="justify-content:center">${catName(x.cat)}</div>`);
    return}
  else if(t.dataset.act==='gooutfit'){kid=+t.dataset.i;tab='outfit';outDay=0;editMode=false}
  else if(t.dataset.act==='oday'){outDay=+t.dataset.d}
  else if(t.dataset.act==='editout'){if(!askPin())return;editMode=true}
  else if(t.dataset.act==='editdone'){editMode=false}
  else if(t.dataset.pick){togglePick(t.dataset.pick)}
  else if(t.dataset.act==='delcloth'){
    if(!confirm('이 옷 사진을 지울까요?'))return;
    const id=t.dataset.id;S.closet=S.closet.filter(c=>c.id!==id);IMG.del(id);
    Object.keys(S.outfit).forEach(d=>Object.keys(S.outfit[d]).forEach(n=>{S.outfit[d][n]=S.outfit[d][n].filter(x=>x!==id)}));
  }
  else if(t.dataset.act==='to'){S.thanksTo=t.dataset.n}
  else if(t.dataset.act==='star'||t.dataset.act==='emo'){
    const key=`${today()}|${t.dataset.m}|${k.name}`;
    const r=S.thanks[key]=S.thanks[key]||{kid:k.name,date:today(),meal:t.dataset.m,stars:0,emo:[],to:'',ts:0};
    r.to=thanksTo();r.ts=Date.now();
    if(t.dataset.act==='star'){const n=+t.dataset.n;r.stars=r.stars===n?0:n}
    else{const e=t.dataset.e,i=r.emo.indexOf(e);if(i>=0)r.emo.splice(i,1);else r.emo.push(e)}
    if(!r.stars&&!r.emo.length)delete S.thanks[key];
    else{sfx('buy');toast(`💌 ${r.to}에게 마음을 보냈어요!`)}
  }
  else if(t.dataset.act==='addmenu'){
    const v=id=>{const el=document.getElementById(id);return el?el.value:''};
    const ds=v('mnd'),ml=v('mnm'),tx=v('mnt').trim();
    if(!ds||!tx){toast('날짜와 메뉴를 넣어주세요');return}
    S.menu=(S.menu?S.menu.replace(/\s+$/,'')+'\n':'')+`${ds} ${ml} ${tx}`;
    toast('식단을 추가했어요 ✅');
  }
  else if(t.dataset.act==='cal'){const d=+t.dataset.d;calOff=d===0?0:calOff+d}
  else if(t.dataset.act==='tg'){const key=t.dataset.k;if(S.todoDone[key])delete S.todoDone[key];else S.todoDone[key]=1}
  else if(t.dataset.act==='addev'){
    const v=id=>{const el=document.getElementById(id);return el?el.value:''};
    const ds=v('evd'),tm=v('evt'),ti=v('evn').trim(),wh=v('evw'),an=document.getElementById('eva').checked;
    if(!ds||!ti){toast('날짜와 일정 이름을 넣어주세요');return}
    const p=ds.split('-');
    S.events=(S.events?S.events.replace(/\s+$/,'')+'\n':'')+`${an?p[1]+'-'+p[2]:ds}${tm?' '+tm:''} ${ti}${wh?' #'+wh:''}`;
    toast('일정을 추가했어요 ✅');
  }
  else if(t.dataset.act==='cleardone'){
    Object.keys(S.todoText).forEach(w=>{S.todoText[w]=lines(S.todoText[w]).filter(x=>!S.todoDone[w+'|'+x]).join('\n')});
    S.checklist.text=lines(S.checklist.text).filter(x=>!S.todoDone['__ck|'+x]).join('\n');
    S.todoDone={};toast('완료한 항목을 지웠어요 🧹');
  }
  else if(t.dataset.act==='addshift'){
    const ds=(document.getElementById('shd')||{}).value,ty=(document.getElementById('shs')||{}).value;
    if(!ds){toast('날짜를 골라 주세요');return}
    S.shiftOv=S.shiftOv||{};
    if(ty==='X')delete S.shiftOv[ds];
    else S.shiftOv[ds]=ty==='DS'?{t:'D',sub:true}:ty==='NS'?{t:'N',sub:true}:{t:'O',vac:true};
    toast(ty==='X'?'원래 근무로 되돌렸어요':'표시했어요 ✅');
  }
  else if(t.dataset.act==='delshift'){delete S.shiftOv[t.dataset.d]}
  else if(t.dataset.act==='syncon'){
    const repo=(document.getElementById('syrepo').value||'').trim(),token=(document.getElementById('sytok').value||'').trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||token.length<20){toast('저장소 이름과 접속 키를 확인해 주세요',3000);return}
    t.disabled=true;t.textContent='연결 중...';
    await connectSync(repo,token,(document.getElementById('syro')||{}).checked);return}
  else if(t.dataset.act==='syncmode'){
    S.sync.ro=!S.sync.ro;if(S.sync.ro)S.cfgTs=0;           // 보기 전용으로 바꾸면 곧바로 폰의 설정으로 맞춰요
    save();render();await syncNow();return}
  else if(t.dataset.act==='syncoff'){if(!confirm('연결을 끊을까요? 이 기기의 설정은 그대로 남아요.'))return;S.sync=null;syncState={st:'off',msg:'',at:null}}
  else if(t.dataset.act==='syncnow'){await syncNow();return}
  else if(t.dataset.act==='addperson'){S.people.push({n:'새 구성원',c:'#00acc1'})}
  else if(t.dataset.act==='delperson'){S.people.splice(+t.dataset.j,1)}
  else if(t.dataset.act==='addkid'){S.kids.push(fixAdd(newKid('새 아이',[['양치하기',10]],TRAINERS[S.kids.length%TRAINERS.length])))}
  else if(t.dataset.act==='delkid'){if(confirm('이 아이의 기록이 모두 지워져요. 정말요?')){S.kids.splice(+t.dataset.k,1);kid=0;if(!S.kids.length)S.kids.push(newKid('아이',[['양치하기',10]],'red'))}}
  else if(t.dataset.act==='addchore'){S.kids[+t.dataset.k].chores.push({t:'새 미션',c:10})}
  else if(t.dataset.act==='delchore'){S.kids[+t.dataset.k].chores.splice(+t.dataset.c,1);S.kids[+t.dataset.k].done={}}
  else if(t.dataset.act==='adj'){const q=S.kids[+t.dataset.k];q.coins=Math.max(0,q.coins+(+t.dataset.v))}
  else if(t.dataset.act==='geo'){navigator.geolocation.getCurrentPosition(p=>{S.lat=+p.coords.latitude.toFixed(3);S.lon=+p.coords.longitude.toFixed(3);save();loadWeather();render()},()=>toast('위치를 가져오지 못했어요'));return}
  else if(t.dataset.act==='export'){overlay('<h2>💾 백업</h2><p class="small">아래 글자를 전부 복사해서 메모 앱에 저장해 두세요</p><textarea id="bk" readonly style="width:70vw;height:30vh">'+esc(JSON.stringify(Object.assign({},S,{sync:null})))+'</textarea>');const b=document.getElementById('bk');b.focus();b.select();return}
  else if(t.dataset.act==='import'){const v=prompt('백업 내용을 붙여넣으세요');if(v){try{const o=JSON.parse(v);if(!o.kids)throw 0;const keepSync=S.sync;S=o;S.sync=keepSync;const d=defaults();Object.keys(d).forEach(x=>{if(x!=='kids'&&S[x]===undefined)S[x]=d[x]});S.kids.forEach(fixKid);kid=0;save();render();toast('불러왔어요')}catch(err){toast('올바른 백업이 아니에요')}}return}
  else if(t.dataset.act==='reset'){if(confirm('모든 기록이 지워져요. 정말요?')){try{localStorage.removeItem('pkfam3')}catch(err){}S=defaults();S.kids.forEach(fixKid);kid=0}}
  else return;
  const nb=checkAll();
  save();render();
  if(nb.length){sfx('badge');setTimeout(()=>toast('🏅 새 배지! '+nb[0]+(nb.length>1?` 외 ${nb.length-1}개`:''),3200),900)}
});
function fixAdd(k){fixKid(k,S.kids.length);return k}
document.addEventListener('change',e=>{
  bump();const t=e.target,D=t.dataset;
  if(t.id==='clothfile'){const fs=t.files;if(fs&&fs.length)addPhotos(fs);return}
  if(t.id==='catsel'){lastCat=t.value;return}
  if(D.g)S[D.g]=t.value;
  else if(D.kname!==undefined){const old=S.kids[+D.kname].name;S.kids[+D.kname].name=t.value;
    S.closet.forEach(c=>{if(c.kid===old)c.kid=t.value});
    if(S.todoText[old]!==undefined&&t.value&&t.value!==old){S.todoText[t.value]=S.todoText[old];delete S.todoText[old]}
    Object.keys(S.outfit).forEach(d=>{if(S.outfit[d][old]){S.outfit[d][t.value]=S.outfit[d][old];delete S.outfit[d][old]}})}
  else if(D.ct){const[i,j]=D.ct.split('.');S.kids[i].chores[j].t=t.value}
  else if(D.cc){const[i,j]=D.cc.split('.');S.kids[i].chores[j].c=Math.max(0,Math.round(+t.value)||0)}
  else if(D.eggcost!==undefined)S.eggCost=Math.max(1,Math.round(+t.value)||100);
  else if(D.evocost!==undefined)S.evoCost=Math.max(1,Math.round(+t.value)||80);
  else if(D.bonus!==undefined)S.bonus=Math.max(0,Math.round(+t.value)||0);
  else if(D.legend!==undefined)S.legend=t.checked;
  else if(D.shon!==undefined){S.shift.on=t.checked}
  else if(D.sh!==undefined){S.shift[D.sh]=t.value;render()}
  else if(D.todo!==undefined)S.todoText[D.todo]=t.value;
  else if(D.cl!==undefined)S.checklist[D.cl]=t.value;
  else if(D.pn!==undefined){const p=S.people[+D.pn];if(S.todoText[p.n]!==undefined&&t.value&&t.value!==p.n){S.todoText[t.value]=S.todoText[p.n];delete S.todoText[p.n]}p.n=t.value}
  else if(D.pc!==undefined)S.people[+D.pc].c=t.value;
  else if(D.bday!==undefined)S.kids[+D.bday].birthday=t.value;
  else if(D.kcol!==undefined)S.kids[+D.kcol].color=t.value;
  else if(D.lat!==undefined){S.lat=+t.value;loadWeather()}
  else if(D.lon!==undefined){S.lon=+t.value;loadWeather()}
  else if(D.pin!==undefined)S.pin=t.value.trim()||'0000';
  else return;
  save();
});
document.addEventListener('touchstart',bump,{passive:true});
/* 이미지가 없으면(신규 포켓몬 등) 기본 스프라이트로 대체 */
document.addEventListener('error',e=>{const i=e.target;if(!i||i.tagName!=='IMG')return;
  const m=i.src.match(/official-artwork\/(\d+)\.png/);
  if(m&&!i.dataset.fb){i.dataset.fb=1;i.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+m[1]+'.png'}else i.style.visibility='hidden'},true);

/* 시계 갱신 + 자정 지나면 새로고침 */
setInterval(()=>{
  const c=document.getElementById('clk');
  if(c){const n=new Date();c.textContent=clockText(n);document.getElementById('apm').textContent=apText(n);document.getElementById('dt').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 ${WD[n.getDay()]}요일`}
  if(today()!==lastDay){lastDay=today();S.kids.forEach(k=>{k.done={}});save();if(!busy)render()}
},15000);
setInterval(loadWeather,30*60000);
setInterval(loadBoard,5*60000);
setInterval(syncNow,60000);                       // 1분마다 폰에서 고친 내용을 확인해요
setTimeout(syncNow,1500);

render();loadWeather();loadBoard();bump();speciesCount();
IMG.init().then(()=>render());
</script>
</body>
